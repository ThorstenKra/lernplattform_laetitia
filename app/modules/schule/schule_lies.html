<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Lies und leuchte</title>
<style>
:root{
  --bg:#fafaf9; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 10px 26px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --akzent:#0891b2; --akzent2:#0e7490; --radius:18px;
  --ja:#16a34a; --nein:#6b7280;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.progress-bar-wrap{ height:6px; background:rgba(8,145,178,.15); flex-shrink:0; }
.progress-bar-fill{ height:6px; background:var(--akzent); transition:width .3s ease; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--panel); border-bottom:2px solid var(--akzent); box-shadow:0 2px 8px rgba(15,23,42,.06); flex-shrink:0; }
.topbar-titel{ font-size:20px; font-weight:1000; color:var(--akzent); display:flex; align-items:center; gap:8px; }
.topbar-fortschritt{ font-size:13px; font-weight:900; color:var(--muted); }

.main{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 16px; gap:10px; overflow:hidden; }

/* Block-Uebersicht */
.block-auswahl{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; max-width:700px; width:100%; }
.block-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:90px; border-radius:16px; border:2px solid rgba(8,145,178,.30); background:rgba(8,145,178,.07); cursor:pointer; user-select:none; position:relative; text-decoration:none; color:var(--text); font-weight:1000; padding:12px; }
.block-btn:hover{ background:rgba(8,145,178,.15); }
.block-btn.dwell-active{ transform:scale(1.05) !important; outline:3px solid var(--akzent); transition:none !important; }
.block-btn-seite{ font-size:11px; font-weight:900; color:var(--muted); }
.block-btn-titel{ font-size:14px; font-weight:1000; text-align:center; }
.block-btn-emoji{ font-size:28px; }

/* Satz-Liste */
.satz-liste{ max-width:700px; width:100%; display:flex; flex-direction:column; gap:5px; overflow:hidden; flex:1; min-height:0; }
.satz-item{
  display:flex; align-items:center; gap:10px;
  padding:7px 10px; border-radius:12px;
  border:2px solid var(--border); background:var(--panel);
  font-size:clamp(13px,2vw,16px); font-weight:900;
  cursor:pointer; user-select:none; position:relative; transition:none;
}
#screenSaetze{ flex:1; min-height:0; }
.satz-item:hover{ background:rgba(8,145,178,.05); }
.satz-item.dwell-active{ transform:scale(1.02) !important; outline:3px solid var(--akzent); transition:none !important; }
.satz-item.bestaetigt{ background:rgba(22,163,74,.12); border-color:rgba(22,163,74,.40); }
.satz-item .satz-icon{ font-size:22px; flex-shrink:0; width:28px; text-align:center; }
.satz-item .satz-text{ flex:1; }

.block-titel-zeile{ font-size:16px; font-weight:1000; color:var(--akzent); text-align:center; max-width:700px; width:100%; }
.seiten-info{ font-size:12px; font-weight:900; color:var(--muted); text-align:center; }

/* Schluss-Frage */
.schluss-frage-karte{ background:var(--panel); border:2px solid rgba(8,145,178,.30); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 24px; max-width:700px; width:100%; text-align:center; }
.schluss-frage-text{ font-size:clamp(18px,3vw,26px); font-weight:900; margin-bottom:14px; }
.schluss-frage-row{ display:flex; gap:12px; justify-content:center; }
.schluss-btn{ display:flex; align-items:center; justify-content:center; min-height:64px; min-width:120px; border-radius:14px; border:2px solid var(--border); background:rgba(15,23,42,.06); font-size:18px; font-weight:1000; cursor:pointer; user-select:none; position:relative; }
.schluss-btn.ja{ border-color:var(--ja); background:rgba(22,163,74,.10); color:var(--ja); }
.schluss-btn.nein{ border-color:var(--nein); background:rgba(107,114,128,.10); color:var(--nein); }
.schluss-btn.dwell-active{ transform:scale(1.06) !important; transition:none !important; }
.schluss-btn.correct-flash{ animation:correctFlash .45s ease forwards; }
.schluss-btn.falsch-gewaehlt{ background:rgba(220,38,38,.25) !important; border-color:#dc2626 !important; }

.infoLine{ display:none; max-width:700px; width:100%; padding:10px 16px; border-radius:14px; font-size:14px; font-weight:900; text-align:center; }
.infoLine.richtig{ display:block; background:rgba(22,163,74,.15); border:1px solid rgba(22,163,74,.40); color:#166534; }
.infoLine.falsch{ display:block; background:rgba(220,38,38,.12); border:1px solid rgba(220,38,38,.35); color:#991b1b; }

/* Nav-Leiste unten (Goldstandard: alle Buttons in einer Zeile) */
.nav-leiste-unten{ display:flex; gap:8px; padding:8px 12px; flex-shrink:0; }
.nav-btn{
  flex:1; min-height:70px; border-radius:16px;
  font-size:17px; font-weight:1000;
  cursor:pointer; user-select:none; position:relative;
  display:flex; align-items:center; justify-content:center;
  gap:6px; transition:none; border:2px solid; text-decoration:none;
}
a.nav-btn{ color:inherit; }
.nav-btn-zurueck{ background:#ede9fe; border-color:#8b5cf6; color:#4c1d95; }
.nav-btn-zurueck:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }
.nav-btn-zurueck .dwell-ring-svg circle{ stroke:#8b5cf6; }
.nav-btn-weiter{ background:#dcfce7; border-color:#16a34a; color:#166534; display:none; }
.nav-btn-weiter.sichtbar{ display:flex; }
.nav-btn-weiter:hover{ background:#bbf7d0; outline:3px solid #16a34a; }
.nav-btn-weiter .dwell-ring-svg circle{ stroke:#16a34a; }
.nav-btn-ueberspringen{ background:#fff7ed; border-color:#f97316; color:#9a3412; display:none; }
.nav-btn-ueberspringen.sichtbar{ display:flex; }
.nav-btn-ueberspringen:hover{ background:#ffedd5; outline:3px solid #f97316; }
.nav-btn-ueberspringen .dwell-ring-svg circle{ stroke:#f97316; }
.nav-btn.dwell-active{ transform:scale(1.02) !important; outline:3px solid currentColor !important; transition:none !important; }

.abschluss{ display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; max-width:600px; width:100%; }
.abschluss.sichtbar{ display:flex; }
.abschluss-emoji{ font-size:64px; }
.abschluss-titel{ font-size:clamp(22px,4vw,34px); font-weight:1000; color:var(--akzent); }
.abschluss-sub{ font-size:15px; font-weight:900; color:var(--muted); }
.abschluss-btn{ display:flex; align-items:center; justify-content:center; min-height:60px; min-width:200px; border-radius:16px; border:2px solid var(--akzent); background:var(--akzent); color:#fff; font-size:17px; font-weight:1000; cursor:pointer; user-select:none; position:relative; text-decoration:none; }

@keyframes correctFlash{ 0%{background:rgba(22,163,74,.60);border-color:#16a34a;} 50%{background:rgba(22,163,74,.15);} 100%{background:rgba(22,163,74,.60);border-color:#16a34a;} }
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--akzent); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,.9s) linear forwards; }


</style>
</head>
<body>

<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
<div class="topbar">
  <div class="topbar-titel">💡 Lies und leuchte</div>
  <div class="topbar-fortschritt" id="fortschrittText"></div>
</div>

<div class="main" id="mainBereich">

  <!-- Screen 1: Block-Auswahl -->
  <div id="screenAuswahl" style="width:100%;max-width:700px;">
    <div class="block-titel-zeile" style="margin-bottom:12px;">Welche Geschichte möchtest du lesen?</div>
    <div class="block-auswahl" id="blockAuswahl"></div>
  </div>

  <!-- Screen 2: Sätze durchgehen -->
  <div id="screenSaetze" style="display:none;width:100%;max-width:700px;display:none;flex-direction:column;gap:10px;align-items:center;">
    <div class="block-titel-zeile" id="satzTitel"></div>
    <div class="seiten-info" id="satzSeitenInfo"></div>
    <div class="block-bild" id="blockBild" style="display:none"><img id="blockBildImg" src="" alt=""></div>
  <div class="satz-liste" id="satzListe"></div>
  </div>

  <!-- Screen 3: Schluss-Frage -->
  <div id="screenFrage" style="display:none;width:100%;max-width:700px;flex-direction:column;gap:12px;align-items:center;">
    <div class="schluss-frage-karte">
      <div class="schluss-frage-text" id="schlussFrageText"></div>
      <div class="schluss-frage-row">
        <button class="schluss-btn ja" id="btnSchlusJa" onclick="schlussAntworten('A')">
          <svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>
          ✅ Ja
        </button>
        <button class="schluss-btn nein" id="btnSchlusNein" onclick="schlussAntworten('B')">
          <svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>
          ❌ Nein
        </button>
      </div>
    </div>
    <div class="infoLine" id="infoLine"></div>
  </div>

</div>

<div class="abschluss" id="abschlussScreen">
  <div class="abschluss-emoji">🌟</div>
  <div class="abschluss-titel" id="abschlussTitel">Super!</div>
  <div class="abschluss-sub" id="abschlussSub"></div>
  <a class="abschluss-btn" href="./schule_deutsch.html" id="btnAbschluss">← Zurueck</a>
</div>

<div class="nav-leiste-unten" id="navLeiste">
  <a class="nav-btn nav-btn-zurueck" href="./schule_deutsch.html" id="btnZurueck">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
    ← Zurück
  </a>
  <button class="nav-btn nav-btn-weiter" id="btnWeiter">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
    Alle Sätze gelesen ✓
  </button>
  <button class="nav-btn nav-btn-ueberspringen" id="btnUeberspringen" onclick="ueberspringen()">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
    → Überspringen
  </button>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./schule_liesmal3_bilder.js"></script>
<script src="./schule_liesmal3_lies_data.js"></script>
<script src="./schule_lies_mod.js"></script>
</body>
</html>
