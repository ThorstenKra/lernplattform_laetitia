<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Stimmt das?</title>
<style>
:root{
  --bg:#f0fdf4; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 6px 18px rgba(15,23,42,.07);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --akzent:#16a34a; --akzent2:#15803d;
  --ja:#16a34a; --nein:#dc2626;
  --radius:16px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── Topbar ── */
.progress-bar-wrap{ height:4px; background:rgba(22,163,74,.15); flex-shrink:0; }
.progress-bar-fill{ height:4px; background:var(--akzent); transition:width .3s; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 14px; background:var(--panel);
  border-bottom:2px solid var(--akzent);
  flex-shrink:0;
}
.topbar-titel{ font-size:16px; font-weight:1000; color:var(--akzent); }
.topbar-info{ font-size:12px; font-weight:900; color:var(--muted); }

/* ── Screens ── */
.screen{ display:none; flex:1; flex-direction:column; overflow:hidden; }
.screen.aktiv{ display:flex; }

/* ── BILD-SCREEN ── */
.bild-container{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  padding:6px 0 6px 12px; gap:6px; overflow:hidden;
}
.bild-wrapper{
  width:100%; max-width:640px;
  border-radius:14px 0 0 14px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.14);
  margin-right:-12px;
}
.bild-wrapper img{
  height:auto; display:block;
  /* Crop-Werte werden per JS pro Bild gesetzt (bildCropSetzen) */
}
.bild-kontext{
  background:var(--panel); border:2px solid rgba(22,163,74,.25);
  border-radius:14px; padding:12px 16px;
  font-size:18px; font-weight:800; color:var(--akzent2);
  text-align:center; max-width:640px; width:100%;
  line-height:1.4;
}
.bild-titel{
  font-size:18px; font-weight:1000; color:var(--text);
  text-align:center;
}
.bild-sub{ font-size:12px; font-weight:800; color:var(--muted); text-align:center; }

/* ── FRAGEN-SCREEN ── */
.fragen-scroll{
  flex:1; overflow-y:auto; padding:6px 12px;
  display:flex; flex-direction:column; gap:4px;
}
.frage-zeile{
  background:var(--panel); border:2px solid var(--border);
  border-radius:12px; padding:7px 10px;
  display:flex; align-items:center; gap:8px;
  position:relative; transition:border-color .2s;
}
.frage-zeile.richtig{ border-color:var(--ja); background:rgba(22,163,74,.07); }
.frage-zeile.falsch{ border-color:var(--nein); background:rgba(220,38,38,.06); }
.frage-zeile.beantwortet .frage-btn-ja,
.frage-zeile.beantwortet .frage-btn-nein{ pointer-events:none; opacity:0.4; }

.frage-text{
  flex:1; font-size:clamp(12px,2.3vw,15px); font-weight:800;
  line-height:1.3;
}
.frage-status{
  font-size:18px; font-weight:1000; flex-shrink:0;
  width:24px; text-align:center;
}

.frage-btns{ display:flex; gap:14px; flex-shrink:0; }

.frage-btn{
  min-width:76px; min-height:60px;
  border-radius:12px; border:2px solid;
  font-size:16px; font-weight:1000;
  cursor:pointer; user-select:none;
  position:relative; display:flex;
  align-items:center; justify-content:center;
  gap:4px; transition:none;
}
.frage-btn.dwell-active{ transform:scale(1.08) !important; transition:none !important; }

.frage-btn-ja{
  border-color:rgba(22,163,74,.4);
  background:rgba(22,163,74,.08); color:var(--ja);
}
.frage-btn-ja:hover{ background:rgba(22,163,74,.18); }
.frage-btn-ja.gewaehlt{ background:rgba(22,163,74,.25) !important; border-color:var(--ja) !important; }

.frage-btn-nein{
  border-color:rgba(220,38,38,.35);
  background:rgba(220,38,38,.06); color:var(--nein);
}
.frage-btn-nein:hover{ background:rgba(220,38,38,.16); }
.frage-btn-nein.gewaehlt{ background:rgba(220,38,38,.20) !important; border-color:var(--nein) !important; }

.frage-btn-vorlesen{
  border-color:rgba(15,23,42,.18);
  background:rgba(15,23,42,.05); color:var(--muted);
  min-width:52px;
}
.frage-btn-vorlesen:hover{ background:rgba(15,23,42,.10); }
.frage-btn-vorlesen.spricht{ background:rgba(22,163,74,.15); border-color:var(--akzent); color:var(--akzent); }

/* ── Nav-Buttons (Bild ↔ Fragen) ── */
.nav-leiste{
  padding:6px 12px; flex-shrink:0;
  display:flex; gap:8px;
}
.bild-nav-leiste{ padding:4px 12px; }
.fragen-nav-leiste{ padding:4px 12px; }
.nav-btn{
  display:flex; align-items:center; justify-content:center;
  min-height:52px; flex:1;
  font-size:15px; font-weight:1000;
  border-radius:12px; cursor:pointer; user-select:none;
  position:relative; transition:none; border:2px solid;
  text-decoration:none;
}
.nav-btn.bild-btn{
  border-color:rgba(22,163,74,.4);
  background:rgba(22,163,74,.10); color:var(--akzent2);
}
.nav-btn.bild-btn:hover{ background:rgba(22,163,74,.20); }
.nav-btn.weiter-btn,
.nav-btn.fragen-klein-btn{
  border-color:var(--akzent); background:var(--akzent); color:#fff;
}
.nav-btn.weiter-btn:hover,
.nav-btn.fragen-klein-btn:hover{ background:var(--akzent2); }
.nav-btn.weiter-btn:disabled,
.nav-btn.weiter-btn.gesperrt{ opacity:.45; pointer-events:none; }
/* Zurück-Button (klein, lila) */
.nav-btn.zurueck-klein-btn{
  border-color:#8b5cf6; background:#ede9fe; color:#4c1d95;

}
.nav-btn.zurueck-klein-btn:hover{ background:#ddd6fe; }
/* Vorlesen-Button (klein, blau) */
.nav-btn.vorlesen-klein-btn{
  border-color:#0891b2; background:#e0f2fe; color:#0e7490;

}
.nav-btn.vorlesen-klein-btn:hover{ background:#bae6fd; }
.nav-btn.vorlesen-klein-btn.spricht{ background:#0891b2; color:#fff; }
.nav-btn.ueberspringen-btn{
  border-color:#f59e0b; background:#fff7ed; color:#92400e;
}
.nav-btn.ueberspringen-btn:hover{ background:#fef3c7; }
.nav-btn.ueberspringen-btn .dwell-ring-svg circle{ stroke:#f59e0b; }
.nav-btn.dwell-active{ transform:scale(1.02) !important; outline:3px solid var(--akzent) !important; transition:none !important; }

/* ── Abschluss-Screen ── */
.abschluss-screen{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; padding:24px; text-align:center;
}
.abschluss-emoji{ font-size:64px; }
.abschluss-titel{ font-size:clamp(22px,4vw,32px); font-weight:1000; color:var(--akzent); }
.abschluss-score{
  font-size:42px; font-weight:1000; color:var(--akzent);
  background:rgba(22,163,74,.12); border:2px solid rgba(22,163,74,.30);
  border-radius:16px; padding:10px 28px;
}
.abschluss-sub{ font-size:14px; font-weight:900; color:var(--muted); }

/* ── Zurück-Leiste ── */
.zurueck-leiste{ padding:8px 12px; flex-shrink:0; }
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:64px; font-size:17px; font-weight:1000;
  border-radius:14px; border:2px solid #8b5cf6;
  background:#ede9fe; color:#4c1d95;
  text-decoration:none; cursor:pointer; user-select:none;
  position:relative; transition:none; width:100%;
}
a.zurueckBtn:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }
a.zurueckBtn.dwell-active{ transform:scale(1.02) !important; outline:3px solid #8b5cf6 !important; }

/* ── Dwell-Ring ── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:60px; height:60px;
}
.dwell-ring-svg circle{
  fill:none; stroke:var(--akzent); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
a.zurueckBtn .dwell-ring-svg circle{ stroke:#8b5cf6; }


.nav-btn.zurueck-klein-btn .dwell-ring-svg circle{ stroke:#8b5cf6; }
.nav-btn.vorlesen-klein-btn .dwell-ring-svg circle{ stroke:#0891b2; }
.nav-btn.fragen-klein-btn .dwell-ring-svg circle,
.nav-btn.weiter-btn .dwell-ring-svg circle{ stroke:#fff; }
.nav-btn.bild-btn .dwell-ring-svg circle{ stroke:var(--akzent); }
.frage-btn .dwell-ring-svg{ width:44px; height:44px; }
.frage-btn.frage-btn-ja .dwell-ring-svg circle{ stroke:var(--ja); }
.frage-btn.frage-btn-nein .dwell-ring-svg circle{ stroke:var(--nein); }
.frage-btn.frage-btn-vorlesen .dwell-ring-svg circle{ stroke:var(--muted); }
.dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,.9s) linear forwards;
}

/* Seiten ohne Bild: zeige direkt Fragen */
.kein-bild-hinweis{
  text-align:center; font-size:12px; font-weight:800;
  color:var(--muted); padding:2px 0;
}
</style>
</head>
<body>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="topbar">
  <div class="topbar-titel">🦭 Stimmt das?</div>
  <div class="topbar-info" id="topbarInfo"></div>
</div>

<!-- SCREEN 1: Bild -->
<div class="screen" id="screenBild">
  <div class="bild-container">
    <div class="bild-sub" id="bildSub"></div>
    <div class="bild-wrapper" id="bildWrapper">
      <img id="bildImg" src="" alt="">
    </div>
    <div class="bild-kontext" id="bildKontext"></div>
  </div>
  <div class="nav-leiste bild-nav-leiste">
    <a class="nav-btn zurueck-klein-btn zurueckBtn" href="./schule_deutsch.html" id="btnZurueckBild">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#8b5cf6;"/></svg>
      ← Zurück
    </a>
    <button class="nav-btn vorlesen-klein-btn" id="btnBildVorlesen" onclick="vorlesenBild()">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#0891b2;"/></svg>
      🔊 Vorlesen
    </button>
    <button class="nav-btn fragen-klein-btn" id="btnZuFragen" onclick="zeigeFragen()">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#fff;"/></svg>
      Fragen →
    </button>
  </div>
</div>

<!-- SCREEN 2: Fragen -->
<div class="screen" id="screenFragen">
  <div class="fragen-scroll" id="fragenScroll"></div>
  <div class="nav-leiste fragen-nav-leiste" id="fragenNavLeiste">
    <button class="nav-btn bild-btn" id="btnZuBild" onclick="zeigeBild()">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      ← Bild
    </button>
    <button class="nav-btn weiter-btn gesperrt" id="btnWeiterEinheit" onclick="naechsteEinheit()">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      Weiter ✅
    </button>
    <button class="nav-btn ueberspringen-btn" id="btnUeberspringen" onclick="ueberspringen()">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      → Überspringen
    </button>
  </div>
</div>

<!-- SCREEN 3: Abschluss -->
<div class="screen" id="screenAbschluss">
  <div class="abschluss-screen">
    <div class="abschluss-emoji" id="abschlussEmoji">🎉</div>
    <div class="abschluss-titel" id="abschlussTitel">Toll!</div>
    <div class="abschluss-score" id="abschlussScore"></div>
    <div class="abschluss-sub" id="abschlussSub"></div>
  </div>
</div>


<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./schule_liesmal3_bilder.js"></script>
<script src="./schule_liesmal3_data.js"></script>
<script src="./schule_jaein_mod.js"></script>
</body>
</html>
