<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Laetitia – Test Suite</title>
<style>
:root{ --gruen:#16a34a; --rot:#dc2626; --gelb:#d97706; --bg:#0f172a; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,Arial,sans-serif; background:var(--bg); color:#e2e8f0; padding:16px; }
h1{ font-size:20px; font-weight:900; color:var(--gruen); margin-bottom:4px; }
.sub{ font-size:12px; color:#64748b; margin-bottom:16px; }
.modul-liste{ display:flex; flex-direction:column; gap:8px; }
.modul-card{
  background:#1e293b; border-radius:12px; padding:12px 16px;
  border:2px solid #2d3748; display:flex; align-items:flex-start; gap:12px;
}
.modul-card.ok{ border-color:var(--gruen); }
.modul-card.fehler{ border-color:var(--rot); }
.modul-card.laeuft{ border-color:var(--gelb); }
.ampel{ font-size:22px; flex-shrink:0; width:28px; text-align:center; padding-top:2px; }
.modul-info{ flex:1; }
.modul-name{ font-size:14px; font-weight:900; }
.check-zeile{ font-size:11px; margin-top:3px; line-height:1.6; }
.check-zeile.ok{ color:#86efac; }
.check-zeile.fehler{ color:#f87171; }
.check-zeile.info{ color:#94a3b8; }
.btn-alle{
  display:block; width:100%; padding:14px;
  background:var(--gruen); color:#fff; border:none; border-radius:10px;
  font-size:16px; font-weight:900; cursor:pointer; margin-bottom:16px;
}
.btn-alle:hover{ background:#15803d; }
.btn-alle:disabled{ opacity:0.5; cursor:default; }
.progress-wrap{ height:6px; background:#1e293b; border-radius:3px; margin-bottom:16px; }
.progress-fill{ height:6px; background:var(--gruen); border-radius:3px; transition:width .3s; width:0%; }
.zusammenfassung{
  background:#1e293b; border-radius:12px; padding:14px 16px;
  margin-top:12px; font-size:15px; font-weight:800; display:none;
  border-left:4px solid var(--gruen);
}
.zusammenfassung.sichtbar{ display:block; }
.hinweis-box{
  background:#1e293b; border:2px solid var(--gelb); border-radius:12px;
  padding:12px 16px; margin-bottom:16px; font-size:12px; color:#fcd34d;
  line-height:1.8; display:none;
}
.hinweis-box.sichtbar{ display:block; }
.hinweis-box code{
  background:#0f172a; border-radius:4px; padding:2px 6px;
  font-family:monospace; font-size:11px; display:block;
  margin:6px 0; color:#e2e8f0; word-break:break-all;
}
.modus-badge{
  display:inline-block; font-size:10px; font-weight:700;
  padding:2px 8px; border-radius:99px; margin-left:6px; vertical-align:middle;
}
.modus-badge.fetch{ background:#0e4429; color:#4ade80; }
.modus-badge.script{ background:#451a03; color:#fbbf24; }
</style>
</head>
<body>

<h1>Laetitia Test Suite</h1>
<div class="sub" id="modusAnzeige">Erkenne Lademodus...</div>

<div class="hinweis-box" id="hinweisBox"></div>
<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
<button class="btn-alle" id="btnTest" onclick="allesTesten()">Alle Module testen</button>
<div class="modul-liste" id="modulListe"></div>
<div class="zusammenfassung" id="zusammenfassung"></div>

<script src="./test_suite_mod.js"></script>
</body>
</html>
