<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Chronologie</title>
<style>
:root{
  --bg:#fafaf9; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 10px 26px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --akzent:#7c3aed; --akzent2:#6d28d9;
  --akzent-bg:rgba(124,58,237,0.07); --radius:18px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-y:auto; display:flex; justify-content:center; }
.app{ width:min(900px,96vw); display:flex; flex-direction:column; gap:12px; padding:16px; padding-bottom:28px; }

/* Header */
.header{ background:var(--panel); border:2px solid var(--akzent); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 24px; text-align:center; }
.header-emoji{ font-size:44px; margin-bottom:6px; }
.header-title{ font-size:clamp(22px,3.5vw,32px); font-weight:1000; color:var(--akzent); margin:0 0 4px 0; }
.header-sub{ font-size:14px; font-weight:800; color:var(--muted); }

/* Heft-Auswahl */
.heft-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.heft-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:100px; border-radius:16px; border:2px solid var(--border); background:var(--panel); box-shadow:var(--shadow); cursor:pointer; user-select:none; position:relative; font-weight:1000; padding:16px 12px; text-align:center; transition:none; }
.heft-btn:hover{ background:var(--akzent-bg); outline:3px solid var(--akzent); }
.heft-btn.dwell-active{ transform:scale(1.05) !important; outline:3px solid var(--akzent); transition:none !important; }
.heft-btn-emoji{ font-size:30px; }
.heft-btn-titel{ font-size:15px; font-weight:1000; }
.heft-btn-sub{ font-size:11px; font-weight:900; color:var(--muted); }
.heft-btn-count{ font-size:11px; font-weight:1000; padding:3px 8px; border-radius:999px; background:var(--akzent-bg); border:1px solid rgba(124,58,237,.25); color:var(--akzent); }

/* Seiten-Timeline */
.timeline-header{ display:flex; align-items:center; gap:10px; }
.timeline-heft-badge{ font-size:13px; font-weight:1000; padding:5px 12px; border-radius:999px; background:var(--akzent-bg); border:1px solid rgba(124,58,237,.25); color:var(--akzent); }
.timeline-titel{ font-size:18px; font-weight:1000; color:var(--akzent); }

.seiten-liste{ display:flex; flex-direction:column; gap:8px; }

/* Seiten-Karte */
.seite-karte{ background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:0 4px 12px rgba(15,23,42,.06); overflow:hidden; }
.seite-header{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(124,58,237,.04); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
.seite-nr{ font-size:13px; font-weight:1000; color:var(--akzent); background:var(--akzent-bg); border:1px solid rgba(124,58,237,.25); border-radius:8px; padding:3px 10px; flex-shrink:0; }
.seite-typ-icon{ font-size:18px; flex-shrink:0; }
.seite-typ-label{ font-size:13px; font-weight:900; color:var(--muted); flex-shrink:0; }
.seite-aufgaben-count{ font-size:12px; font-weight:900; color:var(--muted); margin-left:auto; flex-shrink:0; }
.seite-chevron{ font-size:14px; color:var(--muted); flex-shrink:0; transition:transform .2s; }
.seite-karte.offen .seite-chevron{ transform:rotate(90deg); }

.seite-body{ display:none; padding:10px 14px; border-top:1px solid var(--border); }
.seite-karte.offen .seite-body{ display:block; }

/* Aufgaben-Vorschau */
.aufgaben-preview{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.aufgabe-zeile{ font-size:13px; font-weight:800; padding:6px 10px; border-radius:8px; background:rgba(15,23,42,.03); border-left:3px solid rgba(124,58,237,.25); color:var(--text); }
.aufgabe-zeile.mehr{ color:var(--muted); font-style:italic; }

/* Spiel-Button */
.spiel-btn{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; border-radius:12px; border:2px solid var(--akzent); background:var(--akzent); color:#fff; font-size:14px; font-weight:1000; cursor:pointer; user-select:none; position:relative; text-decoration:none; width:100%; transition:none; }
.spiel-btn:hover{ background:var(--akzent2); }
.spiel-btn.dwell-active{ transform:scale(1.04) !important; transition:none !important; }

/* Lies-Block (kein Spielen, nur Vorlesen) */
.lies-btn{ background:rgba(8,145,178,.85); border-color:#0891b2; }
.lies-btn:hover{ background:#0891b2; }

/* Zurueck */
.zurueck-btn{ display:flex; align-items:center; justify-content:center; min-height:64px; border-radius:16px; border:2px solid #8b5cf6; background:#ede9fe; color:#4c1d95; font-size:17px; font-weight:1000; cursor:pointer; user-select:none; position:relative; text-decoration:none; transition:none; }
.zurueck-btn:hover{ background:#ddd6fe; }
.zurueck-btn.dwell-active{ transform:scale(1.04) !important; transition:none !important; }

/* Dwell */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--akzent); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,.9s) linear forwards; }

/* Zurueck-Button unten (Regel 8) */
.zurueck-leiste{ padding:10px 16px; flex-shrink:0; }
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:70px; font-size:18px; font-weight:1000;
  border-radius:16px; border:2px solid #8b5cf6;
  background:#ede9fe; color:#4c1d95;
  text-decoration:none; cursor:pointer; user-select:none;
  position:relative; transition:none; width:100%;
}
a.zurueckBtn:hover{ background:#ddd6fe; outline:4px solid #8b5cf6; }
a.zurueckBtn.dwell-active{ transform:scale(1.02) !important; outline:4px solid #8b5cf6 !important; transition:none !important; }

</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-emoji">📅</div>
    <div class="header-title">Chronologie</div>
    <div class="header-sub">Aufgaben nach Schulheft und Seitenzahl</div>
  </div>

  <!-- Screen 1: Heft-Auswahl -->
  <div id="screenHeft">
    <div class="heft-grid" id="heftGrid"></div>
  </div>

  <!-- Screen 2: Seiten-Timeline -->
  <div id="screenTimeline" style="display:none;flex-direction:column;gap:12px;">
    <div class="timeline-header">
      <button class="zurueck-btn" id="btnZurueckHeft" style="min-height:44px;min-width:44px;width:auto;padding:0 14px;font-size:15px;">
        <svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>
        ← Heft wechseln
      </button>
      <div id="timelineTitel" class="timeline-titel"></div>
    </div>
    <div class="seiten-liste" id="seitenListe"></div>
  </div>

  <a class="zurueck-btn" href="./schule.html" id="btnZurueck">
    <svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>
    ← Zurueck zur Schule
  </a>

</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./schule_liesmal3_data.js"></script>
<script src="./schule_liesmal3_raetsel_data.js"></script>
<script src="./schule_liesmal3_buchstaben_data.js"></script>
<script src="./schule_liesmal3_lies_data.js"></script>
<script src="./schule_mathe_data.js"></script>
<script src="./schule_chronologie_mod.js"></script>
</body>
</html>
