<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Chronologie</title>
<style>
:root{
  --bg:#fafaf9; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 10px 26px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --akzent:#7c3aed; --akzent2:#6d28d9;
  --akzent-bg:rgba(124,58,237,0.07); --radius:18px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-y:auto; display:flex; justify-content:center; }
.app{ width:min(900px,96vw); display:flex; flex-direction:column; gap:12px; padding:16px; padding-bottom:28px; }

/* Header */
.header{ background:var(--panel); border:2px solid var(--akzent); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 24px; text-align:center; }
.header-emoji{ font-size:44px; margin-bottom:6px; }
.header-title{ font-size:clamp(22px,3.5vw,32px); font-weight:1000; color:var(--akzent); margin:0 0 4px 0; }
.header-sub{ font-size:14px; font-weight:800; color:var(--muted); }

/* Heft-Auswahl */
.heft-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.heft-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:100px; border-radius:16px; border:2px solid var(--border); background:var(--panel); box-shadow:var(--shadow); cursor:pointer; user-select:none; position:relative; font-weight:1000; padding:16px 12px; text-align:center; transition:none; }
.heft-btn:hover{ background:var(--akzent-bg); outline:3px solid var(--akzent); }
.heft-btn.dwell-active{ transform:scale(1.05) !important; outline:3px solid var(--akzent); transition:none !important; }
.heft-btn-emoji{ font-size:30px; }
.heft-btn-titel{ font-size:15px; font-weight:1000; }
.heft-btn-sub{ font-size:11px; font-weight:900; color:var(--muted); }
.heft-btn-count{ font-size:11px; font-weight:1000; padding:3px 8px; border-radius:999px; background:var(--akzent-bg); border:1px solid rgba(124,58,237,.25); color:var(--akzent); }

/* Seiten-Timeline */
.timeline-header{ display:flex; align-items:center; gap:10px; }
.timeline-heft-badge{ font-size:13px; font-weight:1000; padding:5px 12px; border-radius:999px; background:var(--akzent-bg); border:1px solid rgba(124,58,237,.25); color:var(--akzent); }
.timeline-titel{ font-size:18px; font-weight:1000; color:var(--akzent); }

.seiten-liste{ display:flex; flex-direction:column; gap:8px; }

/* Seiten-Karte */
.seite-karte{ background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:0 4px 12px rgba(15,23,42,.06); overflow:hidden; }
.seite-header{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(124,58,237,.04); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
.seite-nr{ font-size:13px; font-weight:1000; color:var(--akzent); background:var(--akzent-bg); border:1px solid rgba(124,58,237,.25); border-radius:8px; padding:3px 10px; flex-shrink:0; }
.seite-typ-icon{ font-size:18px; flex-shrink:0; }
.seite-typ-label{ font-size:13px; font-weight:900; color:var(--muted); flex-shrink:0; }
.seite-aufgaben-count{ font-size:12px; font-weight:900; color:var(--muted); margin-left:auto; flex-shrink:0; }
.seite-chevron{ font-size:14px; color:var(--muted); flex-shrink:0; transition:transform .2s; }
.seite-karte.offen .seite-chevron{ transform:rotate(90deg); }

.seite-body{ display:none; padding:10px 14px; border-top:1px solid var(--border); }
.seite-karte.offen .seite-body{ display:block; }

/* Aufgaben-Vorschau */
.aufgaben-preview{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.aufgabe-zeile{ font-size:13px; font-weight:800; padding:6px 10px; border-radius:8px; background:rgba(15,23,42,.03); border-left:3px solid rgba(124,58,237,.25); color:var(--text); }
.aufgabe-zeile.mehr{ color:var(--muted); font-style:italic; }

/* Spiel-Button */
.spiel-btn{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; border-radius:12px; border:2px solid var(--akzent); background:var(--akzent); color:#fff; font-size:14px; font-weight:1000; cursor:pointer; user-select:none; position:relative; text-decoration:none; width:100%; transition:none; }
.spiel-btn:hover{ background:var(--akzent2); }
.spiel-btn.dwell-active{ transform:scale(1.04) !important; transition:none !important; }

/* Lies-Block (kein Spielen, nur Vorlesen) */
.lies-btn{ background:rgba(8,145,178,.85); border-color:#0891b2; }
.lies-btn:hover{ background:#0891b2; }

/* Zurueck */
.zurueck-btn{ display:flex; align-items:center; justify-content:center; min-height:64px; border-radius:16px; border:2px solid #8b5cf6; background:#ede9fe; color:#4c1d95; font-size:17px; font-weight:1000; cursor:pointer; user-select:none; position:relative; text-decoration:none; transition:none; }
.zurueck-btn:hover{ background:#ddd6fe; }
.zurueck-btn.dwell-active{ transform:scale(1.04) !important; transition:none !important; }

/* Dwell */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--akzent); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,.9s) linear forwards; }

/* Zurueck-Button unten (Regel 8) */
.zurueck-leiste{ padding:10px 16px; flex-shrink:0; }
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:70px; font-size:18px; font-weight:1000;
  border-radius:16px; border:2px solid #8b5cf6;
  background:#ede9fe; color:#4c1d95;
  text-decoration:none; cursor:pointer; user-select:none;
  position:relative; transition:none; width:100%;
}
a.zurueckBtn:hover{ background:#ddd6fe; outline:4px solid #8b5cf6; }
a.zurueckBtn.dwell-active{ transform:scale(1.02) !important; outline:4px solid #8b5cf6 !important; transition:none !important; }

</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-emoji">📅</div>
    <div class="header-title">Chronologie</div>
    <div class="header-sub">Aufgaben nach Schulheft und Seitenzahl</div>
  </div>

  <!-- Screen 1: Heft-Auswahl -->
  <div id="screenHeft">
    <div class="heft-grid" id="heftGrid"></div>
  </div>

  <!-- Screen 2: Seiten-Timeline -->
  <div id="screenTimeline" style="display:none;flex-direction:column;gap:12px;">
    <div class="timeline-header">
      <button class="zurueck-btn" id="btnZurueckHeft" style="min-height:44px;min-width:44px;width:auto;padding:0 14px;font-size:15px;">
        <svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>
        ← Heft wechseln
      </button>
      <div id="timelineTitel" class="timeline-titel"></div>
    </div>
    <div class="seiten-liste" id="seitenListe"></div>
  </div>

  <a class="zurueck-btn" href="./schule.html" id="btnZurueck">
    <svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>
    ← Zurueck zur Schule
  </a>

</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./schule_liesmal3_data.js"></script>
<script src="./schule_liesmal3_raetsel_data.js"></script>
<script src="./schule_liesmal3_buchstaben_data.js"></script>
<script src="./schule_liesmal3_lies_data.js"></script>
<script src="./schule_mathe_data.js"></script>
<script>
"use strict";

// ── Alle Aufgaben aus allen Quellen sammeln ───────────────────────────────────
var alleAufgaben = [];

(function(){
  // Aus Registry
  var api = window.LaetitiaDataRegistryApi;
  if(api && typeof api.get === "function"){
    ["schule_liesmal3","schule_liesmal3_raetsel","schule_liesmal3_buchstaben","schule_mathe"].forEach(function(key){
      var items = api.get(key) || [];
      alleAufgaben = alleAufgaben.concat(items);
    });
  }
  // Fallback: globale Variablen
  if(!alleAufgaben.length){
    var quellen = [
      window.LaetitiaSchuleLiesmal3Aufgaben,
      window.LaetitiaSchuleLiesmal3Raetsel,
      window.LaetitiaSchuleLiesmal3Buchstaben,
      window.LaetitiaSchuleMatheAufgaben
    ];
    quellen.forEach(function(q){ if(Array.isArray(q)) alleAufgaben = alleAufgaben.concat(q); });
  }
  // Lies-Bloecke separat (anderes Format)
  // werden direkt aus window.LaetitiaSchuleLiesmal3Lies gelesen
})();

// ── Heft-Konfiguration ────────────────────────────────────────────────────────
// Wird automatisch aus den Daten abgeleitet + hier angereichert
var HEFT_META = {
  "liesmal3": {
    emoji: "📖",
    titel: "Lies mal 3",
    untertitel: "Das Heft mit der Robbe (Jandorf Verlag)",
    farbe: "#16a34a",
    spielSeiten: {
      "ja_nein":     { url:"./schule_jaein.html",      label:"Stimmt das?",      icon:"✅" },
      "raetsel":     { url:"./schule_raetsel.html",    label:"Was bin ich?",     icon:"🔍" },
      "buchstaben":  { url:"./schule_buchstaben.html", label:"Buchstabenraetsel",icon:"🔤" },
      "lies_leuchte":{ url:"./schule_lies.html",       label:"Lies und leuchte", icon:"💡" }
    }
  },
  "nasevorn": {
    emoji: "🔢",
    titel: "Nase vorn!",
    untertitel: "Rechnen bis 20 (Cornelsen, Klasse 1)",
    farbe: "#2563eb",
    spielSeiten: {
      "mathe": { url:"./schule_mathe.html", label:"Mathe üben", icon:"🔢" }
    }
  }
};

// ── Daten nach Heft + Seite gruppieren ────────────────────────────────────────
function gruppiereNachHeftUndSeite(){
  var hefte = {}; // { heft: { seite: [aufgaben] } }

  // Normale Aufgaben
  alleAufgaben.forEach(function(t){
    if(!t.heft || !t.seite) return;
    if(!hefte[t.heft]) hefte[t.heft] = {};
    var s = String(t.seite);
    if(!hefte[t.heft][s]) hefte[t.heft][s] = [];
    hefte[t.heft][s].push(t);
  });

  // Lies-Bloecke einfuegen
  var liesBloecke = window.LaetitiaSchuleLiesmal3Lies || [];
  liesBloecke.forEach(function(block){
    var heft = block.heft || "liesmal3";
    var s = String(block.seite);
    if(!hefte[heft]) hefte[heft] = {};
    if(!hefte[heft][s]) hefte[heft][s] = [];
    // Als Pseudo-Aufgabe eintragen
    hefte[heft][s].push({
      heft: heft,
      seite: block.seite,
      typ: "lies_leuchte",
      stufe: "SL_LIES",
      text: block.titel,
      _liesBlock: true,
      _blockTitel: block.titel
    });
  });

  return hefte;
}

// ── Typ-Labels ────────────────────────────────────────────────────────────────
var TYP_LABELS = {
  "ja_nein":     { icon:"✅", label:"Ja / Nein" },
  "raetsel":     { icon:"🔍", label:"Was bin ich?" },
  "buchstaben":  { icon:"🔤", label:"Buchstabenraetsel" },
  "lies_leuchte":{ icon:"💡", label:"Lies und leuchte" },
  "mathe":       { icon:"🔢", label:"Mathe" }
};

// ── Screen-Steuerung ──────────────────────────────────────────────────────────
function zeigeScreen(id){
  document.getElementById("screenHeft").style.display    = (id==="heft")     ? "block" : "none";
  document.getElementById("screenTimeline").style.display= (id==="timeline") ? "flex"  : "none";
}

// ── Heft-Auswahl aufbauen ─────────────────────────────────────────────────────
var hefte = {};

function aufbauenHeftAuswahl(){
  hefte = gruppiereNachHeftUndSeite();
  var grid = document.getElementById("heftGrid");
  grid.innerHTML = "";

  Object.keys(hefte).forEach(function(heftKey){
    var meta = HEFT_META[heftKey] || { emoji:"📄", titel:heftKey, untertitel:"", farbe:"#6b7280" };
    var seitenCount = Object.keys(hefte[heftKey]).length;
    var aufgabenCount = 0;
    Object.values(hefte[heftKey]).forEach(function(arr){ aufgabenCount += arr.length; });

    var btn = document.createElement("div");
    btn.className = "heft-btn";
    btn.innerHTML =
      '<svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" style="stroke:'+meta.farbe+'"/></svg>'+
      '<div class="heft-btn-emoji">'+meta.emoji+'</div>'+
      '<div class="heft-btn-titel">'+meta.titel+'</div>'+
      '<div class="heft-btn-sub">'+meta.untertitel+'</div>'+
      '<div class="heft-btn-count">'+seitenCount+' Seiten · '+aufgabenCount+' Aufgaben</div>';
    btn.addEventListener("click", function(){ zeigeTimeline(heftKey); });
    bindDwellEinzel(btn);
    grid.appendChild(btn);
  });

  zeigeScreen("heft");
}

// ── Timeline aufbauen ─────────────────────────────────────────────────────────
function zeigeTimeline(heftKey){
  var meta = HEFT_META[heftKey] || { emoji:"📄", titel:heftKey, farbe:"#6b7280", spielSeiten:{} };
  document.getElementById("timelineTitel").textContent = meta.emoji+" "+meta.titel;

  var seitenData = hefte[heftKey];
  var seitenNummern = Object.keys(seitenData).map(Number).sort(function(a,b){return a-b;});

  var liste = document.getElementById("seitenListe");
  liste.innerHTML = "";

  seitenNummern.forEach(function(seiteNr){
    var aufgaben = seitenData[String(seiteNr)];
    if(!aufgaben || !aufgaben.length) return;

    // Typen auf dieser Seite ermitteln
    var typen = {};
    aufgaben.forEach(function(t){ typen[t.typ] = (typen[t.typ]||0)+1; });
    var ersterTyp = Object.keys(typen)[0];
    var typInfo = TYP_LABELS[ersterTyp] || { icon:"📄", label:ersterTyp };

    var karte = document.createElement("div");
    karte.className = "seite-karte";

    // Header
    var header = document.createElement("div");
    header.className = "seite-header";
    header.innerHTML =
      '<span class="seite-nr">Seite '+seiteNr+'</span>'+
      '<span class="seite-typ-icon">'+typInfo.icon+'</span>'+
      '<span class="seite-typ-label">'+typInfo.label+'</span>'+
      '<span class="seite-aufgaben-count">'+aufgaben.length+' Aufgaben</span>'+
      '<span class="seite-chevron">▶</span>';
    header.addEventListener("click", function(){
      karte.classList.toggle("offen");
    });

    // Body
    var body = document.createElement("div");
    body.className = "seite-body";

    // Aufgaben-Vorschau (max. 3)
    var preview = document.createElement("div");
    preview.className = "aufgaben-preview";
    var max = Math.min(aufgaben.length, 3);
    for(var i=0; i<max; i++){
      var zeile = document.createElement("div");
      zeile.className = "aufgabe-zeile";
      var t = aufgaben[i];
      if(t._liesBlock){
        zeile.textContent = "📖 "+t._blockTitel;
      } else {
        zeile.textContent = (t.text||"").substring(0,70) + (t.text && t.text.length>70?"…":"");
      }
      preview.appendChild(zeile);
    }
    if(aufgaben.length > 3){
      var mehr = document.createElement("div");
      mehr.className = "aufgabe-zeile mehr";
      mehr.textContent = "... und "+(aufgaben.length-3)+" weitere Aufgaben";
      preview.appendChild(mehr);
    }
    body.appendChild(preview);

    // Spiel-Buttons fuer jeden Typ auf dieser Seite
    Object.keys(typen).forEach(function(typ){
      var spielInfo = (meta.spielSeiten||{})[typ];
      if(!spielInfo) return;

      var spielBtn = document.createElement("a");
      spielBtn.className = "spiel-btn" + (typ==="lies_leuchte"?" lies-btn":"");
      spielBtn.innerHTML =
        '<svg class="dwell-ring-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25"/></svg>'+
        spielInfo.icon+' '+spielInfo.label+' — Seite '+seiteNr+' spielen';

      // URL mit Seiten-Filter
      spielBtn.href = spielInfo.url + "?seite="+seiteNr+"&heft="+heftKey;
      bindDwellEinzel(spielBtn);
      body.appendChild(spielBtn);
    });

    karte.appendChild(header);
    karte.appendChild(body);
    liste.appendChild(karte);
  });

  zeigeScreen("timeline");
}

// ── Seiten-Filter in Spielseiten ──────────────────────────────────────────────
// Die Spielseiten lesen den ?seite= Parameter um nur diese Seite zu spielen.
// Das wird in den Spielseiten selbst implementiert — hier nur der Link.

// ── Navigation ────────────────────────────────────────────────────────────────
document.getElementById("btnZurueckHeft").addEventListener("click", function(){
  zeigeScreen("heft");
});

// ── Dwell (Regel 7: LaetitiaAttachDwell) ─────────────────────────────────────
var _attachDwell = window.LaetitiaAttachDwell || function(){ return {cancelDwell:function(){}}; };
var dwellMs    = parseInt(localStorage.getItem("laetitia_dwell_ms"))    || 900;
var leaveGrace = parseInt(localStorage.getItem("laetitia_leave_grace_ms")) || 150;
var _dwellHandle = { cancelDwell: function(){} };

var DWELL_SELECTOR = "a.heft-btn, a.spiel-btn, #btnZurueck, #btnZurueckHeft, a.zurueckBtn";

function rebindDwell(){
  if(_dwellHandle && typeof _dwellHandle.cancelDwell === "function") _dwellHandle.cancelDwell();
  _dwellHandle = _attachDwell(DWELL_SELECTOR, {
    dwellMs: dwellMs, leaveGrace: leaveGrace,
    onActivate: function(el){
      if(el.getAttribute("aria-disabled") === "true") return;
      if(el.classList.contains("is-disabled")) return;
      try{ el.click(); }catch(e){}
    }
  });
}
function bindDwellEinzel(el){ rebindDwell(); }

try{ localStorage.setItem("laetitia_return_url_v1", new URL("./schule.html", window.location.href).href); }catch(e){}

aufbauenHeftAuswahl();
</script>
</body>
</html>
