<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia - Schule Mathe</title>
<style>
:root{
  --bg:#f0fdf4; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 6px 18px rgba(15,23,42,.07);
  --text:#0f172a; --muted:rgba(15,23,42,.65);
  --akzent:#16a34a; --akzent2:#15803d;
  --akzent-bg:rgba(22,163,74,0.08); --radius:16px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}
.header{
  background:var(--panel); border-bottom:2px solid var(--akzent);
  box-shadow:0 2px 8px rgba(15,23,42,.06); flex-shrink:0;
  padding:10px 16px; display:flex; align-items:center; gap:10px;
}
.header-emoji{ font-size:30px; }
.header-titel{ font-size:22px; font-weight:1000; color:var(--akzent); }
.header-sub{ font-size:14px; font-weight:800; color:var(--muted); margin-left:auto; }

.modul-bereich{
  flex:1; display:flex; padding:10px 12px; overflow:hidden;
}
.modul-grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  gap:10px;
  width:100%; max-width:960px;
  margin:0 auto;
}
.modul-grid .btn-alle{
  grid-column:1 / -1;
}
a.modBtn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding:12px 8px;
  background:var(--panel); border:2px solid var(--border);
  border-radius:16px; box-shadow:var(--shadow);
  text-decoration:none; color:var(--text); font-weight:1000;
  user-select:none; cursor:pointer; position:relative; transition:none;
}
a.modBtn:hover, a.modBtn:focus{
  transform:scale(1.03); outline:3px solid var(--akzent); background:var(--akzent-bg);
}
a.modBtn.dwell-active{
  transform:scale(1.04) !important; outline:3px solid var(--akzent) !important;
  background:var(--akzent-bg) !important; transition:none !important;
}
a.modBtn.btn-alle{
  flex-direction:row; gap:14px;
  border-color:var(--akzent); background:var(--akzent-bg);
}
.mod-emoji{ font-size:40px; }
.mod-label{ font-size:16px; text-align:center; font-weight:1000; line-height:1.3; }
.mod-code{ font-size:13px; color:var(--akzent); font-weight:1000; }

.zurueck-leiste{ padding:8px 12px; flex-shrink:0; }
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:72px; font-size:20px; font-weight:1000;
  border-radius:16px; border:2px solid #8b5cf6;
  background:#ede9fe; color:#4c1d95;
  text-decoration:none; cursor:pointer; user-select:none;
  position:relative; transition:none; width:100%;
}
a.zurueckBtn:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }
a.zurueckBtn.dwell-active{
  transform:scale(1.02) !important; outline:3px solid #8b5cf6 !important; transition:none !important;
}

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:60px; height:60px;
}
.dwell-ring-svg circle{
  fill:none; stroke:var(--akzent); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
a.zurueckBtn .dwell-ring-svg circle{ stroke:#8b5cf6; }
.dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,.9s) linear forwards;
}
</style>
</head>
<body>

<div class="header">
  <span class="header-emoji">🔢</span>
  <span class="header-titel">Mathe</span>
  <span class="header-sub">Thema wählen</span>
</div>

<div class="modul-bereich">
  <div class="modul-grid">

    <a class="modBtn" href="./schule_mathe.html?stufe=SMA1">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">🔟</div>
      <div class="mod-label">Mit der 10 rechnen</div>
      <div class="mod-code">SMA1</div>
    </a>

    <a class="modBtn" href="./schule_mathe.html?stufe=SMA2">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">📏</div>
      <div class="mod-label">Groß + klein</div>
      <div class="mod-code">SMA2</div>
    </a>

    <a class="modBtn" href="./schule_mathe.html?stufe=SMA3">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">✌️</div>
      <div class="mod-label">Verdoppeln + Halbieren</div>
      <div class="mod-code">SMA3</div>
    </a>

    <a class="modBtn" href="./schule_mathe.html?stufe=SMA4">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">➕</div>
      <div class="mod-label">Fast verdoppeln</div>
      <div class="mod-code">SMA4</div>
    </a>

    <a class="modBtn" href="./schule_mathe.html?stufe=SMA5">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">🔄</div>
      <div class="mod-label">Tausch&shy;aufgaben</div>
      <div class="mod-code">SMA5</div>
    </a>

    <a class="modBtn" href="./schule_mathe.html?stufe=SMA6">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">9️⃣</div>
      <div class="mod-label">+9 / +11 / −9 / −11</div>
      <div class="mod-code">SMA6</div>
    </a>

    <a class="modBtn btn-alle" href="./schule_mathe.html">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
      <div class="mod-emoji">🎯</div>
      <div class="mod-label">Alle Themen gemischt</div>
    </a>

  </div>
</div>

<div class="zurueck-leiste">
  <a class="zurueckBtn" href="./schule.html" id="btnZurueck">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70" style="width:50px;height:50px;">
      <circle cx="35" cy="35" r="30" style="stroke:#8b5cf6;"/>
    </svg>
    ← Zurück zur Schule
  </a>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script>
try{ localStorage.setItem("laetitia_return_url_v1", new URL("./schule_mathe_uebersicht.html", window.location.href).href); }catch(e){}
var attachDwell = window.LaetitiaAttachDwell || function(){ return {cancelDwell:function(){}}; };
var dwellMs    = parseInt(localStorage.getItem("laetitia_dwell_ms"))    || 900;
var leaveGrace = parseInt(localStorage.getItem("laetitia_leave_grace_ms")) || 150;
attachDwell("a.modBtn, a.zurueckBtn", {
  dwellMs: dwellMs, leaveGrace: leaveGrace,
  onActivate: function(el){
    try{ el.click(); }catch(e){}
  }
});
</script>
</body>
</html>
