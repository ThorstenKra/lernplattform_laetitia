<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Kackhaufen-Jagd</title>
<style>
:root{
  --bg:#1a0f00;
  --lila:#8b5cf6; --lila-bg:#ede9fe; --lila-dark:#4c1d95;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  height:100vh; overflow:hidden; user-select:none;
}

#bg{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
.stern{
  position:absolute; border-radius:50%; background:#fff; opacity:0;
  animation:sternBlinken var(--d,3s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes sternBlinken{ 0%,100%{ opacity:0; } 50%{ opacity:var(--op,0.4); } }

#hud{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px;
  background:rgba(26,15,0,0.90);
  border-bottom:2px solid rgba(139,92,246,0.4);
}
#zaehler{ font-size:clamp(18px,3vw,26px); font-weight:1000; color:#fff; }
#zaehler span{ color:#f59e0b; }
#jubel{
  font-size:clamp(15px,2.5vw,22px); font-weight:1000;
  color:#f59e0b; opacity:0; transition:opacity 0.3s;
}
#jubel.aktiv{ opacity:1; }

#feld{ position:fixed; inset:0; top:56px; bottom:88px; overflow:hidden; }

/* ── Kackhaufen ──────────────────────────────────────────────────────────── */
.kack{
  position:absolute; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.kack-emoji{ line-height:1; display:block; }

/* Glow bei Dwell — benutzt CSS-Variable --ring pro Typ */
.kack.dwell-aktiv{
  filter:drop-shadow(0 0 14px var(--ring,#f59e0b))
         drop-shadow(0 0 28px rgba(255,107,107,0.6));
}
.kack.dwell-aktiv .kack-emoji{
  transform:scale(1.2) rotate(-10deg) !important;
  animation:none !important;
}

/* Deko-Badge (Typ-Symbol oben rechts) */
.kack-deko{
  position:absolute; top:-14px; right:-6px;
  line-height:1; z-index:5; pointer-events:none;
}

/* Typ: Alien — wackelt */
@keyframes wackeln{
  0%,100%{ transform:rotate(-14deg) scale(1); }
  50%{ transform:rotate(14deg) scale(1.1); }
}
.kack-wackelt .kack-emoji{
  animation:wackeln 0.48s ease-in-out infinite;
}

/* Typ: Frost — pendelt langsam */
@keyframes pendeln{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-8px); }
}
.kack-pendelt .kack-emoji{
  animation:pendeln 1.2s ease-in-out infinite;
}

/* Dwell-Ring */
.kack-ring{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:10;
}
.kack-ring circle{
  fill:none; stroke-width:4;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
  opacity:0;
}
.kack-ring circle.animating{
  opacity:1;
  animation:dwellRing var(--dwell-duration,1.2s) linear forwards;
}
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }

/* ── Partikel ────────────────────────────────────────────────────────────── */
.partikel{
  position:absolute; border-radius:50%;
  pointer-events:none; z-index:200;
  animation:partikelFly var(--t,.8s) ease-out forwards;
}
@keyframes partikelFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,0px)) scale(0); opacity:0; }
}
.emojiPartikel{
  position:absolute; pointer-events:none; z-index:200;
  animation:emojiFlug var(--t,1s) ease-out forwards;
}
@keyframes emojiFlug{
  0%{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,0px)) scale(0.15) rotate(540deg); opacity:0; }
}
.furzWolke{
  position:absolute; pointer-events:none; z-index:200;
  animation:wolkeFly var(--t,1.2s) ease-out forwards;
}
@keyframes wolkeFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,-90px)) scale(0.15); opacity:0; }
}
.konfetti{
  position:fixed; pointer-events:none; z-index:300;
  width:10px; height:10px; border-radius:2px;
  animation:konfettiFall var(--t,2s) ease-in forwards;
}
@keyframes konfettiFall{
  0%{ transform:translateY(-20px) rotate(0deg); opacity:1; }
  100%{ transform:translateY(100vh) rotate(720deg); opacity:0; }
}

/* ── Zurück-Leiste Goldstandard ──────────────────────────────────────────── */
.zurueck-leiste{
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  padding:8px 12px;
  background:rgba(26,15,0,0.90);
  border-top:2px solid rgba(139,92,246,0.4);
}
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:72px; font-size:20px; font-weight:1000;
  border-radius:16px; border:2px solid var(--lila);
  background:var(--lila-bg); color:var(--lila-dark);
  text-decoration:none; cursor:pointer; position:relative; transition:none; width:100%;
}
a.zurueckBtn:hover, a.zurueckBtn:focus{ background:#ddd6fe; outline:3px solid var(--lila); }
a.zurueckBtn.dwell-active{ transform:scale(1.02) !important; outline:3px solid var(--lila) !important; }
a.zurueckBtn .dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:70px; height:70px;
}
a.zurueckBtn .dwell-ring-svg circle{
  fill:none; stroke:var(--lila); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
a.zurueckBtn .dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,1.2s) linear forwards;
}
</style>
</head>
<body>

<div id="bg"></div>

<div id="hud">
  <div id="zaehler">💩 Erwischt: <span id="anzahl">0</span></div>
  <div id="jubel">🌟 Super! 🌟</div>
</div>

<div id="feld"></div>

<div class="zurueck-leiste">
  <a class="zurueckBtn" id="btnZurueck" href="#">
    ← Zurück zur Spielewelt
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </a>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script>
(function(){
"use strict";

// ── Konfiguration ────────────────────────────────────────────────────────────
var DWELL_MS    = 1200;
var MAX_KACK    = 4;
var SPAWN_MS    = 2000;
var SPEED_BASIS = 48;

var GROESSEN = [
  { sz:58,  spd:1.3  },
  { sz:85,  spd:1.0  },
  { sz:118, spd:0.72 }
];

// 6 visuelle Kack-Typen: filter, deko-emoji, CSS-Klasse, Geschw.-Faktor, Ring-Farbe, Partikel-Farben
var KACK_TYPEN = [
  {
    filter:"",
    deko:"", extraKlasse:"",
    spdMod:1.0, ring:"#f59e0b",
    farben:["#8B4513","#A0522D","#D2691E","#c17f3e"],
    emojis:["💩","💨","✨","💥"]
  },
  {
    filter:"hue-rotate(110deg)",
    deko:"☠️", extraKlasse:"",
    spdMod:1.2, ring:"#22c55e",
    farben:["#14532d","#4ade80","#052e16","#16a34a"],
    emojis:["💩","☠️","✨","💀"]
  },
  {
    filter:"hue-rotate(350deg) saturate(1.6)",
    deko:"🔥", extraKlasse:"",
    spdMod:1.4, ring:"#ef4444",
    farben:["#b91c1c","#fb923c","#fbbf24","#7f1d1d"],
    emojis:["💩","🔥","💥","⭐"]
  },
  {
    filter:"hue-rotate(200deg) brightness(1.25)",
    deko:"❄️", extraKlasse:"kack-pendelt",
    spdMod:0.55, ring:"#60a5fa",
    farben:["#1e3a8a","#93c5fd","#bfdbfe","#0369a1"],
    emojis:["💩","❄️","⭐","✨"]
  },
  {
    filter:"sepia(1) brightness(1.9) saturate(2.5)",
    deko:"⭐", extraKlasse:"",
    spdMod:0.9, ring:"#fbbf24",
    farben:["#b45309","#d97706","#fef08a","#92400e"],
    emojis:["💩","⭐","✨","🏆"]
  },
  {
    filter:"hue-rotate(280deg) saturate(1.9)",
    deko:"👽", extraKlasse:"kack-wackelt",
    spdMod:0.85, ring:"#a78bfa",
    farben:["#4c1d95","#c4b5fd","#7c3aed","#ddd6fe"],
    emojis:["💩","👽","✨","🌟"]
  }
];

// ── Zustand ──────────────────────────────────────────────────────────────────
var anzahl    = 0;
var kackListe = [];
var feld      = document.getElementById("feld");
var anzahlEl  = document.getElementById("anzahl");
var jubelEl   = document.getElementById("jubel");
var jubelTimer= null;
var animFrame = null;
var letzteZeit= null;

// ── Sternenhimmel ────────────────────────────────────────────────────────────
(function(){
  var bg = document.getElementById("bg");
  for(var i=0; i<40; i++){
    var s = document.createElement("div");
    s.className = "stern";
    var sz2 = Math.random()*2+0.8;
    s.style.cssText =
      "width:"+sz2+"px;height:"+sz2+"px;" +
      "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;" +
      "--d:"+(2+Math.random()*4)+"s;--delay:"+(Math.random()*4)+"s;" +
      "--op:"+(0.12+Math.random()*0.35)+";";
    bg.appendChild(s);
  }
})();

// ── Audio ────────────────────────────────────────────────────────────────────
var audioCtx = null;

function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume().catch(function(){});
  }
  return audioCtx;
}

// Mehrere Ausloeser — wichtig fuer Augensteuerung (Dwell feuert click ohne pointerdown)
["pointerdown","mousedown","touchstart","click"].forEach(function(ev){
  document.addEventListener(ev, getAudioCtx, {capture:true, passive:true});
});
// pointermove: Augensteuerung bewegt den Zeiger staendig — fruehzeitig aktivieren
document.addEventListener("pointermove", getAudioCtx, {once:true, passive:true});

// Rausch-Puffer (pink noise — tieffrequenter als weisses Rauschen)
function rauschPuffer(ctx, dauer){
  var n  = Math.ceil(ctx.sampleRate * (dauer + 0.08));
  var buf = ctx.createBuffer(1, n, ctx.sampleRate);
  var d   = buf.getChannelData(0);
  var b0=0, b1=0, b2=0, b3=0;
  for(var i=0; i<n; i++){
    var w = Math.random()*2 - 1;
    b0 = 0.99886*b0 + w*0.0555179;
    b1 = 0.99332*b1 + w*0.0750759;
    b2 = 0.96900*b2 + w*0.1538520;
    b3 = 0.86650*b3 + w*0.3104856;
    d[i] = (b0+b1+b2+b3) * 0.28;
  }
  return buf;
}

// Einzelnen Rausch-Furz verbinden und abspielen
function rauschFurz(ctx, dauer, f0, f1, fTyp, Q, gainSpitze, zeitOffset){
  var tOff = zeitOffset || 0;
  var buf  = rauschPuffer(ctx, dauer);
  var src  = ctx.createBufferSource();
  src.buffer = buf;
  var fil  = ctx.createBiquadFilter();
  fil.type = fTyp; fil.Q.value = Q;
  fil.frequency.setValueAtTime(f0, ctx.currentTime + tOff);
  fil.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + tOff + dauer);
  var gain = ctx.createGain();
  gain.gain.setValueAtTime(0.001, ctx.currentTime + tOff);
  gain.gain.linearRampToValueAtTime(gainSpitze, ctx.currentTime + tOff + 0.012);
  gain.gain.setValueAtTime(gainSpitze, ctx.currentTime + tOff + dauer * 0.42);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + tOff + dauer);
  src.connect(fil); fil.connect(gain); gain.connect(ctx.destination);
  src.start(ctx.currentTime + tOff);
  src.stop(ctx.currentTime + tOff + dauer + 0.05);
}

// Juhu-Ausruf per TTS (Katja-Goldstandard)
var JUHU_TEXTE = ["Juhu!", "Super!", "Toll!", "Wunderbar!", "Klasse!", "Genial!", "Bravo!", "Fantastisch!"];
function spieleJuhu(){
  try{
    speechSynthesis.cancel();
    var text = JUHU_TEXTE[Math.floor(Math.random() * JUHU_TEXTE.length)];
    setTimeout(function(){
      try{
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE"; u.rate = 1.1; u.pitch = 1.2; u.volume = 1.0;
        var vv = speechSynthesis.getVoices();
        var de = vv.find(function(v){ return v.name === "Microsoft Katja Online (Natural) - German (Germany)"; })
              || vv.find(function(v){ return v.name === "Microsoft Katja - German (Germany)"; })
              || vv.find(function(v){ return v.name.indexOf("Katja") >= 0; })
              || vv.find(function(v){ return v.name.indexOf("Microsoft") >= 0 && v.lang.startsWith("de") && v.name.indexOf("Hedda") < 0; })
              || vv.find(function(v){ return v.name.indexOf("Microsoft") >= 0 && v.lang.startsWith("de"); })
              || vv.find(function(v){ return v.lang.startsWith("de"); });
        if(de) u.voice = de;
        speechSynthesis.speak(u);
      }catch(e){}
    }, 120);
  }catch(e){}
}

// 7 verschiedene Furz-Charaktere
function spieleFurz(){
  var ctx = getAudioCtx();
  if(!ctx) return;

  // Falls noch suspended: Resume abwarten, dann spielen
  if(ctx.state !== "running"){
    ctx.resume().then(function(){ _furzIntern(ctx); }).catch(function(){});
    return;
  }
  _furzIntern(ctx);
}

function _furzIntern(ctx){
  var typ = Math.floor(Math.random() * 7);

  if(typ === 0){
    // Kurzer Knaller
    rauschFurz(ctx, 0.16+Math.random()*0.08, 720, 110, "bandpass", 1.8, 3.0);

  } else if(typ === 1){
    // Langer Schleicher
    rauschFurz(ctx, 0.85+Math.random()*0.65, 300, 155, "bandpass", 1.2, 2.5);

  } else if(typ === 2){
    // Hochpfeifer — schrill und feucht
    rauschFurz(ctx, 0.22+Math.random()*0.18, 1200, 200, "bandpass", 5.0, 2.8);

  } else if(typ === 3){
    // Tiefer Brummer — voluminoes
    rauschFurz(ctx, 0.6+Math.random()*0.5, 190, 70, "lowpass", 4.0, 3.5);

  } else if(typ === 4){
    // Trommelfeuer — 3-5 kurze Stoesse
    var anzBursts = 3 + Math.floor(Math.random()*3);
    var bd = (0.45 + Math.random()*0.25) / anzBursts;
    var pitches = [600, 420, 300, 220, 180];
    for(var b=0; b<anzBursts; b++){
      rauschFurz(ctx, bd*0.72, pitches[b % pitches.length], 130, "bandpass", 2.0, 2.8, b*bd);
    }

  } else if(typ === 5){
    // Grosse Bombe — Rauschen + tiefer Saegeschwingung
    var dauer5 = 0.5 + Math.random()*0.35;
    rauschFurz(ctx, dauer5, 380, 90, "lowpass", 2.5, 2.2);
    var osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(110, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime + dauer5);
    var oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(1.8, ctx.currentTime);
    oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dauer5);
    osc.connect(oscGain); oscGain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dauer5);

  } else {
    // Dreier-Melodie — drei Toene fallend (putt-putt-putt)
    var pitchFolge = [780, 480, 260];
    var dauern     = [0.14, 0.12, 0.20];
    var offset = 0;
    for(var p=0; p<3; p++){
      rauschFurz(ctx, dauern[p], pitchFolge[p], pitchFolge[p]*0.55, "bandpass", 3.0, 2.6, offset);
      offset += dauern[p] + 0.06;
    }
  }
}

// ── Kackhaufen erzeugen ──────────────────────────────────────────────────────
function neuerKack(){
  if(kackListe.length >= MAX_KACK) return;
  var feldR = feld.getBoundingClientRect();
  var fw = feldR.width, fh = feldR.height;
  var gi  = Math.floor(Math.random()*GROESSEN.length);
  var ti  = Math.floor(Math.random()*KACK_TYPEN.length);
  var g   = GROESSEN[gi];
  var typ = KACK_TYPEN[ti];
  var sz  = g.sz;
  var speed = SPEED_BASIS * g.spd * typ.spdMod;

  var seite  = Math.floor(Math.random()*4);
  var x, y, vx, vy;
  var winkel = (Math.random()*60+15) * (Math.PI/180);
  if(seite===0){ x=Math.random()*(fw-sz); y=-sz; vx=(Math.random()-.5)*speed; vy=speed*Math.sin(winkel)+26; }
  else if(seite===1){ x=fw; y=Math.random()*(fh-sz); vx=-speed*Math.cos(winkel)-26; vy=(Math.random()-.5)*speed; }
  else if(seite===2){ x=Math.random()*(fw-sz); y=fh; vx=(Math.random()-.5)*speed; vy=-speed*Math.sin(winkel)-26; }
  else { x=-sz; y=Math.random()*(fh-sz); vx=speed*Math.cos(winkel)+26; vy=(Math.random()-.5)*speed; }

  // Container
  var el = document.createElement("div");
  var spawnRot = (Math.random()*50 - 25);
  el.className = "kack" + (typ.extraKlasse ? " "+typ.extraKlasse : "");
  el.style.cssText =
    "left:"+x+"px;top:"+y+"px;width:"+sz+"px;height:"+sz+"px;" +
    "transform:rotate("+spawnRot+"deg);" +
    "--ring:"+typ.ring+";";

  // Emoji
  var emojiEl = document.createElement("span");
  emojiEl.className = "kack-emoji";
  emojiEl.style.fontSize = Math.round(sz * 0.86) + "px";
  if(typ.filter) emojiEl.style.filter = typ.filter;
  emojiEl.textContent = "💩";  // 💩

  // Deko-Badge
  if(typ.deko){
    var dekoEl = document.createElement("span");
    dekoEl.className = "kack-deko";
    dekoEl.style.fontSize = Math.round(sz * 0.36) + "px";
    dekoEl.textContent = typ.deko;
    el.appendChild(dekoEl);
  }

  // Dwell-Ring (Farbe per Typ)
  var ringW = sz + 18;
  var ringEl = document.createElementNS("http://www.w3.org/2000/svg","svg");
  ringEl.setAttribute("class","kack-ring");
  ringEl.setAttribute("viewBox","0 0 70 70");
  ringEl.style.cssText = "width:"+ringW+"px;height:"+ringW+"px;";
  var circ = document.createElementNS("http://www.w3.org/2000/svg","circle");
  circ.setAttribute("cx","35"); circ.setAttribute("cy","35"); circ.setAttribute("r","30");
  circ.style.stroke = typ.ring;
  ringEl.appendChild(circ);

  el.appendChild(emojiEl);
  el.appendChild(ringEl);
  feld.appendChild(el);

  var k = { el:el, x:x, y:y, vx:vx, vy:vy, sz:sz, typ:typ, dwellAktiv:false };
  kackListe.push(k);
  bindKackDwell(k);
}

function bindKackDwell(k){
  var ring  = k.el.querySelector(".kack-ring circle");
  var timer = null;

  function startDwell(){
    if(k.dwellAktiv) return;
    k.dwellAktiv = true;
    k.el.classList.add("dwell-aktiv");
    ring.style.setProperty("--dwell-duration", (DWELL_MS/1000)+"s");
    ring.classList.add("animating");
    timer = setTimeout(function(){ platzeKack(k); }, DWELL_MS);
  }
  function stopDwell(){
    if(!k.dwellAktiv) return;
    k.dwellAktiv = false;
    k.el.classList.remove("dwell-aktiv");
    ring.classList.remove("animating");
    var clone = ring.cloneNode(true);
    ring.parentNode.replaceChild(clone, ring);
    ring = clone;
    if(timer){ clearTimeout(timer); timer = null; }
  }

  k.el.addEventListener("pointerenter", startDwell);
  k.el.addEventListener("pointerleave", stopDwell);
  k.el.addEventListener("click", function(){ platzeKack(k); });
}

// ── Kackhaufen platzt ────────────────────────────────────────────────────────
function platzeKack(k){
  var idx = kackListe.indexOf(k);
  if(idx === -1) return;
  kackListe.splice(idx, 1);

  var cx = k.x + k.sz / 2;
  var cy = k.y + k.sz * 0.82;
  if(k.el.parentNode) k.el.parentNode.removeChild(k.el);

  if(Math.random() < 0.20){ spieleJuhu(); } else { spieleFurz(); }

  // Furz-Wolken (aufsteigend)
  var wolkenTypen = ["💨","💨","🌫️","✨","💨","💥"];
  for(var w=0; w<6; w++){
    var wEl = document.createElement("div");
    wEl.className = "furzWolke";
    var wW = (w/6)*Math.PI*2 - Math.PI/2;
    var wd = 35 + Math.random()*45;
    wEl.textContent = wolkenTypen[w];
    wEl.style.cssText =
      "font-size:"+(20+Math.random()*14)+"px;" +
      "left:"+(cx + Math.cos(wW)*wd)+"px;" +
      "top:" +(cy + Math.sin(wW)*wd*0.6)+"px;" +
      "--dx:"+(Math.cos(wW)*(40+Math.random()*50))+"px;" +
      "--t:"+(0.7+Math.random()*0.6)+"s;";
    feld.appendChild(wEl);
    setTimeout(function(el){ if(el.parentNode) el.parentNode.removeChild(el); }, 2000, wEl);
  }

  // Partikel (Farbe + Emojis per Typ)
  var farben = k.typ.farben;
  var emojiL = k.typ.emojis;
  for(var i=0; i<26; i++){
    var p = document.createElement("div");
    var istEmoji = i < 8;
    p.className = istEmoji ? "emojiPartikel" : "partikel";
    var pW  = (i/26)*Math.PI*2;
    var dist = 50 + Math.random()*120;
    var dx  = Math.cos(pW)*dist;
    var dy  = Math.sin(pW)*dist;
    var t   = 0.4 + Math.random()*0.65;
    if(istEmoji){
      p.textContent = emojiL[i % emojiL.length];
      p.style.cssText = "font-size:"+(16+Math.random()*10)+"px;" +
        "left:"+cx+"px;top:"+cy+"px;--dx:"+dx+"px;--dy:"+dy+"px;--t:"+t+"s;";
    } else {
      var farbe = farben[Math.floor(Math.random()*farben.length)];
      var psz   = 5+Math.random()*14;
      p.style.cssText = "left:"+cx+"px;top:"+cy+"px;width:"+psz+"px;height:"+psz+"px;" +
        "background:"+farbe+";--dx:"+dx+"px;--dy:"+dy+"px;--t:"+t+"s;";
    }
    feld.appendChild(p);
    setTimeout(function(el){ if(el.parentNode) el.parentNode.removeChild(el); }, t*1000+120, p);
  }

  anzahl++;
  anzahlEl.textContent = anzahl;
  if(anzahl % 5 === 0){ zeigeJubel(); konfettiRegen(); }
  setTimeout(neuerKack, 800);
}

// ── Jubel ────────────────────────────────────────────────────────────────────
function zeigeJubel(){
  var texte = [
    "💩 Voll erwischt! 💩",
    "💨 Igitt, das stinkt! 💨",
    "🏆 Klo-Rekord! 🏆",
    "⭐ Stinki-Meister! ⭐",
    "🌟 Mega-Furz! 🌟",
    "👽 Alien-Kack erwischt! 👽",
    "🔥 Feuer-Furz! 🔥",
    "❄️ Eis-Bombe! ❄️"
  ];
  jubelEl.textContent = texte[Math.floor(anzahl/5 - 1) % texte.length];
  jubelEl.classList.add("aktiv");
  if(jubelTimer) clearTimeout(jubelTimer);
  jubelTimer = setTimeout(function(){ jubelEl.classList.remove("aktiv"); }, 2500);
}

function konfettiRegen(){
  var farben = ["#8B4513","#A0522D","#D2691E","#22c55e","#ef4444","#60a5fa","#fbbf24","#a78bfa"];
  for(var i=0; i<44; i++){
    var kEl = document.createElement("div");
    kEl.className = "konfetti";
    kEl.style.cssText =
      "left:"+(Math.random()*100)+"vw;top:-20px;" +
      "background:"+farben[Math.floor(Math.random()*farben.length)]+";" +
      "transform:rotate("+(Math.random()*360)+"deg);" +
      "--t:"+(1.4+Math.random()*1.6)+"s;" +
      "animation-delay:"+(Math.random()*0.6)+"s;";
    document.body.appendChild(kEl);
    setTimeout(function(el){ if(el.parentNode) el.parentNode.removeChild(el); }, 3500, kEl);
  }
}

// ── Spielschleife ────────────────────────────────────────────────────────────
function update(ts){
  if(!letzteZeit) letzteZeit = ts;
  var dt = Math.min((ts - letzteZeit)/1000, 0.05);
  letzteZeit = ts;

  var feldR = feld.getBoundingClientRect();
  var fw = feldR.width, fh = feldR.height;

  kackListe.forEach(function(k){
    k.x += k.vx * dt;
    k.y += k.vy * dt;
    if(k.x < 0){ k.x = 0; k.vx = Math.abs(k.vx); }
    if(k.x + k.sz > fw){ k.x = fw - k.sz; k.vx = -Math.abs(k.vx); }
    if(k.y < 0){ k.y = 0; k.vy = Math.abs(k.vy); }
    if(k.y + k.sz > fh){ k.y = fh - k.sz; k.vy = -Math.abs(k.vy); }
    if(Math.random() < 0.002){
      var wink = (Math.random()-0.5)*0.4;
      var spd  = Math.sqrt(k.vx*k.vx + k.vy*k.vy);
      var wa   = Math.atan2(k.vy, k.vx) + wink;
      k.vx = Math.cos(wa)*spd;
      k.vy = Math.sin(wa)*spd;
    }
    k.el.style.left = k.x + "px";
    k.el.style.top  = k.y + "px";
  });

  animFrame = requestAnimationFrame(update);
}

// ── Dwell Zurück-Button ──────────────────────────────────────────────────────
var _attach    = window.LaetitiaAttachDwell || function(){ return {cancelDwell:function(){}}; };
var dwellMs    = parseInt(localStorage.getItem("laetitia_dwell_ms"))       || 2000;
var leaveGrace = parseInt(localStorage.getItem("laetitia_leave_grace_ms")) || 150;
_attach("#btnZurueck", {
  dwellMs: dwellMs, leaveGrace: leaveGrace,
  onActivate: function(el){ try{ el.click(); }catch(e){} }
});
document.getElementById("btnZurueck").addEventListener("click", function(e){
  e.preventDefault();
  cancelAnimationFrame(animFrame);
  try{
    window.location.href = new URL("../../spielewelt.html", window.location.href).href;
  }catch(ex){ history.back(); }
});

// ── Start ────────────────────────────────────────────────────────────────────
for(var i=0; i<MAX_KACK; i++){
  (function(d){ setTimeout(neuerKack, d); })(i * 500);
}
setInterval(function(){ if(kackListe.length < MAX_KACK) neuerKack(); }, SPAWN_MS);
animFrame = requestAnimationFrame(update);

})();
</script>
