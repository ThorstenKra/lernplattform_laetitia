<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Eierjagd</title>
<style>
:root{
  --bg:#0d1b2a;
  --lila:#8b5cf6; --lila-bg:#ede9fe; --lila-dark:#4c1d95;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  height:100vh; overflow:hidden; user-select:none;
}

/* Sternenhimmel-Hintergrund */
#bg{
  position:fixed; inset:0; pointer-events:none; overflow:hidden;
}
.stern{
  position:absolute; border-radius:50%;
  background:#fff; opacity:0;
  animation:sternBlinken var(--d,3s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes sternBlinken{
  0%,100%{ opacity:0; } 50%{ opacity:var(--op,0.6); }
}

/* HUD oben */
#hud{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px;
  background:rgba(13,27,42,0.85);
  border-bottom:1px solid rgba(139,92,246,0.3);
}
#zaehler{
  font-size:clamp(18px,3vw,26px); font-weight:1000; color:#fff;
}
#zaehler span{ color:#f59e0b; }
#jubel{
  font-size:clamp(16px,2.5vw,22px); font-weight:1000;
  color:#f59e0b; opacity:0; transition:opacity 0.3s;
}
#jubel.aktiv{ opacity:1; }

/* Spielfeld */
#feld{
  position:fixed; inset:0; top:56px; bottom:80px;
  overflow:hidden;
}

/* Eier */
.ei{
  position:absolute;
  cursor:pointer;
  transform-origin:center center;
  transition:transform 0.1s;
}
.ei svg{ display:block; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.ei.dwell-aktiv svg{
  filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 32px var(--farbe,#f59e0b));
}

/* Dwell-Ring ums Ei */
.ei-ring{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:10;
}
.ei-ring circle{
  fill:none; stroke:#fff; stroke-width:4;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
  opacity:0;
}
.ei-ring circle.animating{
  opacity:1;
  animation:dwellRing var(--dwell-duration,1.2s) linear forwards;
}
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }

/* Partikel */
.partikel{
  position:absolute; border-radius:50%;
  pointer-events:none; z-index:200;
  animation:partikelFly var(--t,0.8s) ease-out forwards;
}
@keyframes partikelFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,0px)) scale(0); opacity:0; }
}

/* Stern-Partikel */
.sternPartikel{
  position:absolute; pointer-events:none; z-index:200; font-size:20px;
  animation:sternFly var(--t,1s) ease-out forwards;
}
@keyframes sternFly{
  0%{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,0px)) scale(0.2) rotate(360deg); opacity:0; }
}

/* Konfetti */
.konfetti{
  position:fixed; pointer-events:none; z-index:300;
  width:10px; height:10px; border-radius:2px;
  animation:konfettiFall var(--t,2s) ease-in forwards;
}
@keyframes konfettiFall{
  0%{ transform:translateY(-20px) rotate(0deg); opacity:1; }
  100%{ transform:translateY(100vh) rotate(720deg); opacity:0; }
}

/* Zurück-Leiste */
.zurueckLeiste{
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  padding:10px 16px;
  background:rgba(13,27,42,0.85);
  border-top:1px solid rgba(139,92,246,0.3);
}
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:72px; width:100%;
  font-size:20px; font-weight:1000;
  border-radius:16px; border:2px solid var(--lila);
  background:var(--lila-bg); color:var(--lila-dark);
  text-decoration:none; cursor:pointer; position:relative; transition:none;
}
a.zurueckBtn:hover, a.zurueckBtn:focus{
  background:#ddd6fe; outline:4px solid var(--lila); transition:none;
}
/* Dwell-Ring für Zurück-Button */
a.zurueckBtn .dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:70px; height:70px;
}
a.zurueckBtn .dwell-ring-svg circle{
  fill:none; stroke:var(--lila); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
a.zurueckBtn .dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,1.2s) linear forwards;
}
</style>
</head>
<body>

<div id="bg"></div>

<div id="hud">
  <div id="zaehler">🥚 Gefangen: <span id="anzahl">0</span></div>
  <div id="jubel">🌟 Super! 🌟</div>
</div>

<div id="feld" id="spielfeld"></div>

<div class="zurueckLeiste">
  <a class="zurueckBtn" id="btnZurueck" href="#">
    ← Zurück zur Spielewelt
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </a>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./eierjagd_mod.js"></script>
</body>
</html>
