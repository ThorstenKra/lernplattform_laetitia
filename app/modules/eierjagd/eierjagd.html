<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Eierjagd</title>
<style>
:root{
  --bg:#0d1b2a;
  --lila:#8b5cf6; --lila-bg:#ede9fe; --lila-dark:#4c1d95;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  height:100vh; overflow:hidden; user-select:none;
}

/* Sternenhimmel-Hintergrund */
#bg{
  position:fixed; inset:0; pointer-events:none; overflow:hidden;
}
.stern{
  position:absolute; border-radius:50%;
  background:#fff; opacity:0;
  animation:sternBlinken var(--d,3s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes sternBlinken{
  0%,100%{ opacity:0; } 50%{ opacity:var(--op,0.6); }
}

/* HUD oben */
#hud{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px;
  background:rgba(13,27,42,0.85);
  border-bottom:1px solid rgba(139,92,246,0.3);
}
#zaehler{
  font-size:clamp(18px,3vw,26px); font-weight:1000; color:#fff;
}
#zaehler span{ color:#f59e0b; }
#jubel{
  font-size:clamp(16px,2.5vw,22px); font-weight:1000;
  color:#f59e0b; opacity:0; transition:opacity 0.3s;
}
#jubel.aktiv{ opacity:1; }

/* Spielfeld */
#feld{
  position:fixed; inset:0; top:56px; bottom:80px;
  overflow:hidden;
}

/* Eier */
.ei{
  position:absolute;
  cursor:pointer;
  transform-origin:center center;
  transition:transform 0.1s;
}
.ei svg{ display:block; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.ei.dwell-aktiv svg{
  filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 32px var(--farbe,#f59e0b));
}

/* Dwell-Ring ums Ei */
.ei-ring{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:10;
}
.ei-ring circle{
  fill:none; stroke:#fff; stroke-width:4;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
  opacity:0;
}
.ei-ring circle.animating{
  opacity:1;
  animation:dwellRing var(--dwell-duration,1.2s) linear forwards;
}
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }

/* Partikel */
.partikel{
  position:absolute; border-radius:50%;
  pointer-events:none; z-index:200;
  animation:partikelFly var(--t,0.8s) ease-out forwards;
}
@keyframes partikelFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,0px)) scale(0); opacity:0; }
}

/* Stern-Partikel */
.sternPartikel{
  position:absolute; pointer-events:none; z-index:200; font-size:20px;
  animation:sternFly var(--t,1s) ease-out forwards;
}
@keyframes sternFly{
  0%{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
  100%{ transform:translate(var(--dx,0px),var(--dy,0px)) scale(0.2) rotate(360deg); opacity:0; }
}

/* Konfetti */
.konfetti{
  position:fixed; pointer-events:none; z-index:300;
  width:10px; height:10px; border-radius:2px;
  animation:konfettiFall var(--t,2s) ease-in forwards;
}
@keyframes konfettiFall{
  0%{ transform:translateY(-20px) rotate(0deg); opacity:1; }
  100%{ transform:translateY(100vh) rotate(720deg); opacity:0; }
}

/* Zurück-Leiste */
.zurueckLeiste{
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  padding:10px 16px;
  background:rgba(13,27,42,0.85);
  border-top:1px solid rgba(139,92,246,0.3);
}
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:72px; width:100%;
  font-size:20px; font-weight:1000;
  border-radius:16px; border:2px solid var(--lila);
  background:var(--lila-bg); color:var(--lila-dark);
  text-decoration:none; cursor:pointer; position:relative; transition:none;
}
a.zurueckBtn:hover, a.zurueckBtn:focus{
  background:#ddd6fe; outline:4px solid var(--lila); transition:none;
}
/* Dwell-Ring für Zurück-Button */
a.zurueckBtn .dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:70px; height:70px;
}
a.zurueckBtn .dwell-ring-svg circle{
  fill:none; stroke:var(--lila); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
a.zurueckBtn .dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,1.2s) linear forwards;
}
</style>
</head>
<body>

<div id="bg"></div>

<div id="hud">
  <div id="zaehler">🥚 Gefangen: <span id="anzahl">0</span></div>
  <div id="jubel">🌟 Super! 🌟</div>
</div>

<div id="feld" id="spielfeld"></div>

<div class="zurueckLeiste">
  <a class="zurueckBtn" id="btnZurueck" href="#">
    ← Zurück zur Spielewelt
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </a>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script>
(function(){
"use strict";

// ── Konfiguration ────────────────────────────────────────────────
var DWELL_MS     = 1200;   // ms bis Ei platzt
var LEAVE_GRACE  = 200;
var MAX_EIER     = 4;      // gleichzeitig auf dem Feld
var SPAWN_MS     = 2000;   // neues Ei alle X ms
var SPEED_BASIS  = 80;     // px/Sekunde Grundgeschwindigkeit

// Ei-Designs: [farbe1, farbe2, muster]
var DESIGNS = [
  { f1:"#ff6b6b", f2:"#ffd93d", muster:"streifen" },
  { f1:"#6bcb77", f2:"#fff",    muster:"punkte"   },
  { f1:"#4d96ff", f2:"#ffd93d", muster:"zickzack" },
  { f1:"#f77f00", f2:"#fff",    muster:"karos"    },
  { f1:"#c77dff", f2:"#fff",    muster:"sterne"   },
  { f1:"#ff9ff3", f2:"#54a0ff", muster:"wellen"   },
  { f1:"#ffd93d", f2:"#ff6b6b", muster:"punkte"   },
  { f1:"#00d2d3", f2:"#fff",    muster:"streifen" },
  { f1:"#ff6b6b", f2:"#c77dff", muster:"karos"    },
  { f1:"#6bcb77", f2:"#ffd93d", muster:"sterne"   }
];

var GROESSEN = [
  { w:90,  h:112, speed:1.2  },  // klein
  { w:115, h:144, speed:1.0  },  // mittel
  { w:145, h:181, speed:0.75 }   // groß
];

// ── Zustand ─────────────────────────────────────────────────────
var anzahl    = 0;
var eier      = [];
var feld      = document.getElementById("feld");
var anzahlEl  = document.getElementById("anzahl");
var jubelEl   = document.getElementById("jubel");
var jubelTimer= null;
var animFrame = null;
var letzteZeit= null;

// ── Sternenhimmel ────────────────────────────────────────────────
(function(){
  var bg = document.getElementById("bg");
  for(var i=0; i<60; i++){
    var s = document.createElement("div");
    s.className = "stern";
    var sz = Math.random()*2.5+1;
    s.style.cssText =
      "width:"+sz+"px;height:"+sz+"px;" +
      "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;" +
      "--d:"+(2+Math.random()*4)+"s;" +
      "--delay:"+(Math.random()*4)+"s;" +
      "--op:"+(0.3+Math.random()*0.7)+";";
    bg.appendChild(s);
  }
})();

// ── Audio ────────────────────────────────────────────────────────
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
document.addEventListener("pointerdown", getAudioCtx, {once:false, capture:true});
document.addEventListener("mousedown",   getAudioCtx, {once:false, capture:true});

function spielePling(tonhoehe){
  var ctx = getAudioCtx(); if(!ctx) return;
  var f = tonhoehe || 523;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = "sine";
  osc.frequency.setValueAtTime(f, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(f*1.5, ctx.currentTime+0.1);
  osc.frequency.exponentialRampToValueAtTime(f*0.8, ctx.currentTime+0.4);
  gain.gain.setValueAtTime(0.5, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime+0.6);
}

// Tonleitern für verschiedene Eier
var TOENE = [523, 587, 659, 698, 784, 880, 988, 1047, 1175, 1319];

// ── SVG Ei ───────────────────────────────────────────────────────
function musterSVG(muster, f2, w, h){
  var s = "";
  if(muster === "streifen"){
    for(var i=0; i<8; i++){
      s += '<line x1="0" y1="'+(i*(h/7))+'" x2="'+w+'" y2="'+(i*(h/7))+'" stroke="'+f2+'" stroke-width="5" opacity="0.5"/>';
    }
  } else if(muster === "punkte"){
    for(var r=0; r<3; r++) for(var c=0; c<2; c++){
      var px = w*0.25 + c*(w*0.5), py = h*0.25 + r*(h*0.28);
      s += '<circle cx="'+px+'" cy="'+py+'" r="'+(w*0.07)+'" fill="'+f2+'" opacity="0.7"/>';
    }
  } else if(muster === "zickzack"){
    var pts = "";
    for(var i=0; i<=8; i++){
      pts += (i*(w/8))+","+(i%2===0?h*0.4:h*0.6)+" ";
    }
    s += '<polyline points="'+pts+'" fill="none" stroke="'+f2+'" stroke-width="5" opacity="0.6"/>';
    var pts2 = "";
    for(var i=0; i<=8; i++){
      pts2 += (i*(w/8))+","+(i%2===0?h*0.6:h*0.8)+" ";
    }
    s += '<polyline points="'+pts2+'" fill="none" stroke="'+f2+'" stroke-width="5" opacity="0.6"/>';
  } else if(muster === "karos"){
    s += '<line x1="0" y1="0" x2="'+w+'" y2="'+h+'" stroke="'+f2+'" stroke-width="4" opacity="0.4"/>';
    s += '<line x1="'+w+'" y1="0" x2="0" y2="'+h+'" stroke="'+f2+'" stroke-width="4" opacity="0.4"/>';
    s += '<line x1="'+(w/2)+'" y1="0" x2="'+w+'" y2="'+(h/2)+'" stroke="'+f2+'" stroke-width="4" opacity="0.4"/>';
    s += '<line x1="0" y1="'+(h/2)+'" x2="'+(w/2)+'" y2="'+h+'" stroke="'+f2+'" stroke-width="4" opacity="0.4"/>';
  } else if(muster === "sterne"){
    var stellen = [[w*0.5,h*0.3],[w*0.25,h*0.55],[w*0.75,h*0.55],[w*0.4,h*0.75],[w*0.6,h*0.75]];
    stellen.forEach(function(p){
      s += '<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" font-size="'+(w*0.18)+'" fill="'+f2+'" opacity="0.7">★</text>';
    });
  } else if(muster === "wellen"){
    s += '<path d="M0,'+(h*0.4)+' Q'+(w*0.25)+','+(h*0.25)+' '+(w*0.5)+','+(h*0.4)+' Q'+(w*0.75)+','+(h*0.55)+' '+w+','+(h*0.4)+'" fill="none" stroke="'+f2+'" stroke-width="5" opacity="0.6"/>';
    s += '<path d="M0,'+(h*0.6)+' Q'+(w*0.25)+','+(h*0.45)+' '+(w*0.5)+','+(h*0.6)+' Q'+(w*0.75)+','+(h*0.75)+' '+w+','+(h*0.6)+'" fill="none" stroke="'+f2+'" stroke-width="5" opacity="0.6"/>';
  }
  return s;
}

function erstelleEiSVG(design, g){
  var w = g.w, h = g.h;
  var d = "M"+(w/2)+","+(h*0.08)+" C"+(w*0.85)+","+(h*0.08)+" "+w+","+(h*0.45)+" "+w+","+(h*0.65)+" C"+w+","+(h*0.88)+" "+(w*0.78)+","+h+" "+(w/2)+","+h+" C"+(w*0.22)+","+h+" 0,"+(h*0.88)+" 0,"+(h*0.65)+" C0,"+(h*0.45)+" "+(w*0.15)+","+(h*0.08)+" "+(w/2)+","+(h*0.08)+"Z";
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><clipPath id="ei-clip-'+w+'"><path d="'+d+'"/></clipPath></defs>' +
    '<path d="'+d+'" fill="'+design.f1+'"/>' +
    '<g clip-path="url(#ei-clip-'+w+')">' + musterSVG(design.muster, design.f2, w, h) + '</g>' +
    '<path d="'+d+'" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>' +
    '<ellipse cx="'+(w*0.35)+'" cy="'+(h*0.22)+'" rx="'+(w*0.09)+'" ry="'+(h*0.06)+'" fill="rgba(255,255,255,0.35)" transform="rotate(-30,'+(w*0.35)+','+(h*0.22)+')"/>' +
    '</svg>';
}

// ── Ei spawnen ───────────────────────────────────────────────────
function neuesEi(){
  if(eier.length >= MAX_EIER) return;
  var feldR = feld.getBoundingClientRect();
  var fw = feldR.width, fh = feldR.height;
  var gi    = Math.floor(Math.random()*GROESSEN.length);
  var g     = GROESSEN[gi];
  var di    = Math.floor(Math.random()*DESIGNS.length);
  var des   = DESIGNS[di];
  var speed = SPEED_BASIS * g.speed;
  // Startposition am Rand
  var seite = Math.floor(Math.random()*4);
  var x, y, vx, vy;
  var winkel = (Math.random()*60+15) * (Math.PI/180);
  if(seite===0){ x=Math.random()*(fw-g.w); y=-g.h; vx=(Math.random()-.5)*speed; vy=speed*Math.sin(winkel)+30; }
  else if(seite===1){ x=fw; y=Math.random()*(fh-g.h); vx=-speed*Math.cos(winkel)-30; vy=(Math.random()-.5)*speed; }
  else if(seite===2){ x=Math.random()*(fw-g.w); y=fh; vx=(Math.random()-.5)*speed; vy=-speed*Math.sin(winkel)-30; }
  else { x=-g.w; y=Math.random()*(fh-g.h); vx=speed*Math.cos(winkel)+30; vy=(Math.random()-.5)*speed; }

  var el = document.createElement("div");
  el.className = "ei";
  el.style.cssText = "left:"+x+"px;top:"+y+"px;width:"+g.w+"px;height:"+g.h+"px;--farbe:"+des.f1+";";
  el.innerHTML = erstelleEiSVG(des, g) +
    '<svg class="ei-ring" style="width:'+(g.w+20)+'px;height:'+(g.h+20)+'px;margin-left:-10px;margin-top:-10px;" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>';
  feld.appendChild(el);

  var tonIdx = Math.floor(Math.random()*TOENE.length);
  var ei = { el:el, x:x, y:y, vx:vx, vy:vy, w:g.w, h:g.h, design:des, gross:gi, ton:TOENE[tonIdx], dwellStart:null, dwellAktiv:false };
  eier.push(ei);
  bindEiDwell(ei);
  return ei;
}

// ── Dwell auf Ei ─────────────────────────────────────────────────
function bindEiDwell(ei){
  var ring = ei.el.querySelector(".ei-ring circle");
  var timer = null;

  function startDwell(){
    if(ei.dwellAktiv) return;
    ei.dwellAktiv = true;
    ei.el.classList.add("dwell-aktiv");
    ring.style.setProperty("--dwell-duration", (DWELL_MS/1000)+"s");
    ring.classList.add("animating");
    timer = setTimeout(function(){ platzeEi(ei); }, DWELL_MS);
  }
  function stopDwell(){
    if(!ei.dwellAktiv) return;
    ei.dwellAktiv = false;
    ei.el.classList.remove("dwell-aktiv");
    ring.classList.remove("animating");
    // Ring zurücksetzen
    var clone = ring.cloneNode(true);
    ring.parentNode.replaceChild(clone, ring);
    ring = clone;
    if(timer){ clearTimeout(timer); timer=null; }
    // Dwell neu binden nach Reset
    bindEiDwell(ei);
  }

  ei.el.addEventListener("pointerenter", startDwell);
  ei.el.addEventListener("pointerleave", stopDwell);
  ei.el.addEventListener("click", function(){ platzeEi(ei); });
}

// ── Ei platzt ────────────────────────────────────────────────────
function platzeEi(ei){
  var idx = eier.indexOf(ei);
  if(idx === -1) return;
  eier.splice(idx, 1);

  var cx = ei.x + ei.w/2;
  var cy = ei.y + ei.h/2;

  // Ei entfernen
  if(ei.el.parentNode) ei.el.parentNode.removeChild(ei.el);

  // Partikel
  for(var i=0; i<28; i++){
    var p = document.createElement("div");
    var istStern = i < 8;
    p.className = istStern ? "sternPartikel" : "partikel";
    var winkel = (i/28)*Math.PI*2;
    var dist = 60 + Math.random()*120;
    var dx = Math.cos(winkel)*dist;
    var dy = Math.sin(winkel)*dist;
    var t = 0.6 + Math.random()*0.6;
    var farben = [ei.design.f1, ei.design.f2, "#fff", "#ffd93d", "#ff6b6b", "#c77dff"];
    var farbe = farben[Math.floor(Math.random()*farben.length)];
    if(istStern){
      p.textContent = "★";
      p.style.cssText = "left:"+cx+"px;top:"+cy+"px;color:"+farbe+";--dx:"+dx+"px;--dy:"+dy+"px;--t:"+t+"s;";
    } else {
      var sz = 6+Math.random()*14;
      p.style.cssText = "left:"+cx+"px;top:"+cy+"px;width:"+sz+"px;height:"+sz+"px;background:"+farbe+";--dx:"+dx+"px;--dy:"+dy+"px;--t:"+t+"s;";
    }
    feld.appendChild(p);
    setTimeout(function(el){ if(el.parentNode) el.parentNode.removeChild(el); }, t*1000+100, p);
  }

  // Ton
  spielePling(ei.ton);

  // Zähler
  anzahl++;
  anzahlEl.textContent = anzahl;

  // Jubel alle 5
  if(anzahl % 5 === 0){
    zeigeJubel();
    konfettiRegen();
  }

  // Neues Ei spawnen
  setTimeout(neuesEi, 800);
}

// ── Jubel ────────────────────────────────────────────────────────
function zeigeJubel(){
  var texte = ["🌟 Super! 🌟","🎉 Toll gemacht! 🎉","✨ Wunderbar! ✨","🏆 Fantastisch! 🏆","🌈 Bravo! 🌈"];
  jubelEl.textContent = texte[Math.floor(anzahl/5-1) % texte.length];
  jubelEl.classList.add("aktiv");
  if(jubelTimer) clearTimeout(jubelTimer);
  jubelTimer = setTimeout(function(){ jubelEl.classList.remove("aktiv"); }, 2500);
}

function konfettiRegen(){
  var farben = ["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#c77dff","#ff9ff3","#f77f00"];
  for(var i=0; i<40; i++){
    var k = document.createElement("div");
    k.className = "konfetti";
    k.style.cssText =
      "left:"+(Math.random()*100)+"vw;" +
      "top:-20px;" +
      "background:"+farben[Math.floor(Math.random()*farben.length)]+";" +
      "transform:rotate("+(Math.random()*360)+"deg);" +
      "--t:"+(1.5+Math.random()*1.5)+"s;" +
      "animation-delay:"+(Math.random()*0.5)+"s;";
    document.body.appendChild(k);
    setTimeout(function(el){ if(el.parentNode) el.parentNode.removeChild(el); }, 3500, k);
  }
}

// ── Spielschleife ────────────────────────────────────────────────
function update(ts){
  if(!letzteZeit) letzteZeit = ts;
  var dt = Math.min((ts - letzteZeit)/1000, 0.05);
  letzteZeit = ts;

  var feldR = feld.getBoundingClientRect();
  var fw = feldR.width, fh = feldR.height;

  eier.forEach(function(ei){
    ei.x += ei.vx * dt;
    ei.y += ei.vy * dt;

    // Abprallen
    if(ei.x < 0){ ei.x = 0; ei.vx = Math.abs(ei.vx); }
    if(ei.x + ei.w > fw){ ei.x = fw - ei.w; ei.vx = -Math.abs(ei.vx); }
    if(ei.y < 0){ ei.y = 0; ei.vy = Math.abs(ei.vy); }
    if(ei.y + ei.h > fh){ ei.y = fh - ei.h; ei.vy = -Math.abs(ei.vy); }

    // Leichte Richtungsänderung alle paar Sekunden
    if(Math.random() < 0.002){
      var wink = (Math.random()-0.5) * 0.4;
      var spd = Math.sqrt(ei.vx*ei.vx + ei.vy*ei.vy);
      var winkelAkt = Math.atan2(ei.vy, ei.vx) + wink;
      ei.vx = Math.cos(winkelAkt) * spd;
      ei.vy = Math.sin(winkelAkt) * spd;
    }

    ei.el.style.left = ei.x + "px";
    ei.el.style.top  = ei.y + "px";
  });

  animFrame = requestAnimationFrame(update);
}

// ── Dwell für Zurück-Button ──────────────────────────────────────
var _attachDwell = window.LaetitiaAttachDwell || function(){ return {cancelDwell:function(){}}; };
var dwellMs = parseInt(localStorage.getItem("laetitia_dwell_ms")) || 2000;
var leaveGrace = parseInt(localStorage.getItem("laetitia_leave_grace_ms")) || 150;

var _dwellHandle = _attachDwell("#btnZurueck", {
  dwellMs: dwellMs, leaveGrace: leaveGrace,
  onActivate: function(el){ try{ el.click(); }catch(e){} }
});
if(_dwellHandle && typeof _LDwellState !== "undefined"){
  _LDwellState.protectUntil = Date.now() + 1200;
}

document.getElementById("btnZurueck").addEventListener("click", function(e){
  e.preventDefault();
  cancelAnimationFrame(animFrame);
  try{
    var url = new URL("../../spielewelt.html", window.location.href).href;
    window.location.href = url;
  }catch(ex){ history.back(); }
});

// ── Start ────────────────────────────────────────────────────────
// Erste Eier spawnen
for(var i=0; i<MAX_EIER; i++){
  (function(delay){ setTimeout(neuesEi, delay); })(i * 500);
}

// Periodisch neue Eier spawnen falls < MAX
setInterval(function(){
  if(eier.length < MAX_EIER) neuesEi();
}, SPAWN_MS);

animFrame = requestAnimationFrame(update);

})();
</script>
</body>
