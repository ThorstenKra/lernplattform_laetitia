<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Hilfe</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --border:rgba(15,23,42,.14);
  --shadow:0 10px 26px rgba(15,23,42,.08); --text:#0f172a;
  --muted:rgba(15,23,42,.60); --green:#1db954; --green2:#18a84c;
  --orange:#ff9a3c; --blue:#2299ff; --radius:18px;
}
*{ box-sizing:border-box; }
body{
  margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── Header ── */
.header{
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:12px;
  flex:0 0 auto;
}
.header-icon{ font-size:28px; }
.header-title{ font-size:20px; font-weight:1000; flex:1; }
.header-sub{ font-size:13px; font-weight:900; color:var(--muted); }

/* ── Hauptbereich ── */
.main{
  flex:1; min-height:0; display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px; padding:12px;
}

/* ── Wortliste (links) ── */
.wordPanel{
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  display:flex; flex-direction:column; overflow:hidden;
}
.wordPanel-title{
  padding:10px 14px; font-size:14px; font-weight:1000;
  color:var(--muted); border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.wordList{
  flex:1; overflow-y:auto; padding:8px;
  display:flex; flex-direction:column; gap:6px;
}
.wordRow{
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:12px;
  border:2px solid transparent; cursor:pointer;
  transition:none; position:relative;
}
.wordRow:hover, .wordRow.dwell-active{
  border-color:var(--green); background:rgba(29,185,84,.08);
  outline:3px solid rgba(29,185,84,.40);
}
.wordRow.active{
  border-color:var(--green); background:rgba(29,185,84,.12);
  box-shadow:0 0 0 3px rgba(29,185,84,.30);
}
.wordName{
  font-size:18px; font-weight:1000; flex:1;
}
.wordBadge{
  font-size:11px; font-weight:1000; padding:3px 7px;
  border-radius:999px; white-space:nowrap;
}
.badge-ok  { background:rgba(29,185,84,.15); color:#0b5c22; }
.badge-tts { background:rgba(15,23,42,.08);  color:var(--muted); }

/* ── Erklärung (rechts) ── */
.explainPanel{
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  display:flex; flex-direction:column; padding:16px; gap:12px;
}
.explain-empty{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  color:var(--muted); font-size:15px; font-weight:900; gap:8px;
  text-align:center;
}
.explain-word{
  font-size:32px; font-weight:1000; line-height:1.1;
}
.explain-wortart{
  font-size:13px; font-weight:1000; color:var(--blue);
  background:rgba(34,153,255,.10); border:1px solid rgba(34,153,255,.25);
  border-radius:999px; padding:3px 10px; display:inline-block;
}
.explain-text{
  font-size:18px; font-weight:900; line-height:1.5;
  color:var(--text); flex:1;
}
.explain-meta{
  display:flex; flex-direction:column; gap:4px;
}
.explain-meta-row{
  font-size:14px; font-weight:900; color:var(--muted);
}
.explain-meta-row strong{ color:var(--text); }
.explain-selten{
  font-size:13px; font-weight:900; color:#b45309;
  background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.30);
  border-radius:10px; padding:8px 12px;
}

/* ── TTS Button ── */
.btnSpeak{
  min-height:66px; border-radius:14px; border:none;
  background:var(--blue); color:#fff; font-size:18px;
  font-weight:1000; cursor:pointer; display:flex;
  align-items:center; justify-content:center; gap:8px;
  position:relative; transition:none; flex-shrink:0;
}
.btnSpeak:hover{ background:#1a88e8; }
.btnSpeak.speaking{ background:#1a88e8;
  box-shadow:0 0 0 4px rgba(34,153,255,.40); }

/* ── Footer ── */
.footer{
  flex:0 0 auto; padding:10px 12px;
  display:flex; gap:10px;
  background:var(--panel); border-top:1px solid var(--border);
}
.btnBack{
  flex:1; min-height:66px; border-radius:14px;
  border:1px solid var(--border); background:rgba(15,23,42,.07);
  color:var(--text); font-size:18px; font-weight:1000;
  cursor:pointer; position:relative; transition:none;
}
.btnBack:hover{ background:rgba(15,23,42,.14); }

/* ── Dwell Ring ── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:70px; height:70px;
}
.dwell-ring-svg circle{
  fill:none; stroke:var(--green); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
.dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,0.6s) linear forwards;
}
.dwell-active{
  outline:4px solid var(--green) !important;
  box-shadow:0 0 0 5px rgba(29,185,84,.45) !important;
  transform:scale(1.03) !important; transition:none !important; z-index:2;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📖</div>
  <div>
    <div class="header-title">Hilfe – Wörter erklären</div>
    <div class="header-sub" id="headerSub">Wähle ein Wort aus der Liste</div>
  </div>
</div>

<div class="main">

  <!-- Wortliste links -->
  <div class="wordPanel">
    <div class="wordPanel-title">Wörter aus dieser Aufgabe</div>
    <div class="wordList" id="wordList"></div>
  </div>

  <!-- Erklärung rechts -->
  <div class="explainPanel" id="explainPanel">
    <div class="explain-empty" id="explainEmpty">
      <span style="font-size:48px;">👈</span>
      <span>Wähle ein Wort links<br>um die Erklärung zu sehen</span>
    </div>

    <div id="explainContent" style="display:none;flex:1;flex-direction:column;gap:10px;">
      <div class="explain-word" id="explainWord"></div>
      <div class="explain-wortart" id="explainWortart" style="display:none;"></div>
      <div class="explain-text" id="explainText"></div>
      <div class="explain-meta" id="explainMeta"></div>
      <div class="explain-selten" id="explainSelten" style="display:none;">
        ✨ Das ist ein ganz besonderes Wort — es lohnt sich, es zu lernen!
      </div>
    </div>

    <button class="btnSpeak" id="btnSpeak" style="display:none;">
      <span id="btnSpeakLabel">🔊 Erklärung vorlesen</span>
    </button>
  </div>

</div>

<div class="footer">
  <button class="btnBack" id="btnBack">← Zurück zur Aufgabe</button>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/glossar.js"></script>
<script src="./deutsch_hilfe_mod.js"></script>
</body>
</html>
