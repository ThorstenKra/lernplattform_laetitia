<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Hilfe</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --border:rgba(15,23,42,.14);
  --shadow:0 10px 26px rgba(15,23,42,.08); --text:#0f172a;
  --muted:rgba(15,23,42,.60); --green:#1db954; --green2:#18a84c;
  --orange:#ff9a3c; --blue:#2299ff; --radius:18px;
}
*{ box-sizing:border-box; }
body{
  margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── Header ── */
.header{
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:12px;
  flex:0 0 auto;
}
.header-icon{ font-size:28px; }
.header-title{ font-size:20px; font-weight:1000; flex:1; }
.header-sub{ font-size:13px; font-weight:900; color:var(--muted); }

/* ── Hauptbereich ── */
.main{
  flex:1; min-height:0; display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px; padding:12px;
}

/* ── Wortliste (links) ── */
.wordPanel{
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  display:flex; flex-direction:column; overflow:hidden;
}
.wordPanel-title{
  padding:10px 14px; font-size:14px; font-weight:1000;
  color:var(--muted); border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.wordList{
  flex:1; overflow-y:auto; padding:8px;
  display:flex; flex-direction:column; gap:6px;
}
.wordRow{
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:12px;
  border:2px solid transparent; cursor:pointer;
  transition:none; position:relative;
}
.wordRow:hover, .wordRow.dwell-active{
  border-color:var(--green); background:rgba(29,185,84,.08);
  outline:3px solid rgba(29,185,84,.40);
}
.wordRow.active{
  border-color:var(--green); background:rgba(29,185,84,.12);
  box-shadow:0 0 0 3px rgba(29,185,84,.30);
}
.wordName{
  font-size:18px; font-weight:1000; flex:1;
}
.wordBadge{
  font-size:11px; font-weight:1000; padding:3px 7px;
  border-radius:999px; white-space:nowrap;
}
.badge-ok  { background:rgba(29,185,84,.15); color:#0b5c22; }
.badge-tts { background:rgba(15,23,42,.08);  color:var(--muted); }

/* ── Erklärung (rechts) ── */
.explainPanel{
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  display:flex; flex-direction:column; padding:16px; gap:12px;
}
.explain-empty{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  color:var(--muted); font-size:15px; font-weight:900; gap:8px;
  text-align:center;
}
.explain-word{
  font-size:32px; font-weight:1000; line-height:1.1;
}
.explain-wortart{
  font-size:13px; font-weight:1000; color:var(--blue);
  background:rgba(34,153,255,.10); border:1px solid rgba(34,153,255,.25);
  border-radius:999px; padding:3px 10px; display:inline-block;
}
.explain-text{
  font-size:18px; font-weight:900; line-height:1.5;
  color:var(--text); flex:1;
}
.explain-meta{
  display:flex; flex-direction:column; gap:4px;
}
.explain-meta-row{
  font-size:14px; font-weight:900; color:var(--muted);
}
.explain-meta-row strong{ color:var(--text); }
.explain-selten{
  font-size:13px; font-weight:900; color:#b45309;
  background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.30);
  border-radius:10px; padding:8px 12px;
}

/* ── TTS Button ── */
.btnSpeak{
  min-height:66px; border-radius:14px; border:none;
  background:var(--blue); color:#fff; font-size:18px;
  font-weight:1000; cursor:pointer; display:flex;
  align-items:center; justify-content:center; gap:8px;
  position:relative; transition:none; flex-shrink:0;
}
.btnSpeak:hover{ background:#1a88e8; }
.btnSpeak.speaking{ background:#1a88e8;
  box-shadow:0 0 0 4px rgba(34,153,255,.40); }

/* ── Footer ── */
.footer{
  flex:0 0 auto; padding:10px 12px;
  display:flex; gap:10px;
  background:var(--panel); border-top:1px solid var(--border);
}
.btnBack{
  flex:1; min-height:66px; border-radius:14px;
  border:1px solid var(--border); background:rgba(15,23,42,.07);
  color:var(--text); font-size:18px; font-weight:1000;
  cursor:pointer; position:relative; transition:none;
}
.btnBack:hover{ background:rgba(15,23,42,.14); }

/* ── Dwell Ring ── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:70px; height:70px;
}
.dwell-ring-svg circle{
  fill:none; stroke:var(--green); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
.dwell-ring-svg circle.animating{
  animation:dwellRing var(--dwell-duration,0.6s) linear forwards;
}
.dwell-active{
  outline:4px solid var(--green) !important;
  box-shadow:0 0 0 5px rgba(29,185,84,.45) !important;
  transform:scale(1.03) !important; transition:none !important; z-index:2;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📖</div>
  <div>
    <div class="header-title">Hilfe – Wörter erklären</div>
    <div class="header-sub" id="headerSub">Wähle ein Wort aus der Liste</div>
  </div>
</div>

<div class="main">

  <!-- Wortliste links -->
  <div class="wordPanel">
    <div class="wordPanel-title">Wörter aus dieser Aufgabe</div>
    <div class="wordList" id="wordList"></div>
  </div>

  <!-- Erklärung rechts -->
  <div class="explainPanel" id="explainPanel">
    <div class="explain-empty" id="explainEmpty">
      <span style="font-size:48px;">👈</span>
      <span>Wähle ein Wort links<br>um die Erklärung zu sehen</span>
    </div>

    <div id="explainContent" style="display:none;flex:1;flex-direction:column;gap:10px;">
      <div class="explain-word" id="explainWord"></div>
      <div class="explain-wortart" id="explainWortart" style="display:none;"></div>
      <div class="explain-text" id="explainText"></div>
      <div class="explain-meta" id="explainMeta"></div>
      <div class="explain-selten" id="explainSelten" style="display:none;">
        ✨ Das ist ein ganz besonderes Wort — es lohnt sich, es zu lernen!
      </div>
    </div>

    <button class="btnSpeak" id="btnSpeak" style="display:none;">
      <span id="btnSpeakLabel">🔊 Erklärung vorlesen</span>
    </button>
  </div>

</div>

<div class="footer">
  <button class="btnBack" id="btnBack">← Zurück zur Aufgabe</button>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/glossar.js"></script>
<script>
"use strict";

const STOP = new Set([
  "der","die","das","ein","eine","einer","eines","einem","einen",
  "und","oder","aber","nicht","kein","keine","ist","sind","war","mit",
  "auf","in","im","am","an","aus","bei","zu","von","für","als","wie",
  "sie","er","es","ich","du","wir","ihr","sich","man","hat","haben",
  "wird","wird","nach","über","unter","beim","seit","ohne"
]);

// ── Parameter aus URL lesen ─────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const taskText  = params.get("text")  || "";
const taskFrage = params.get("frage") || "";
const returnUrl = params.get("return") || "../../index.html";

// ── Wörter extrahieren ──────────────────────────────────────────────────
const wörter = [...new Set(
  [taskText, taskFrage].join(" ")
    .toLowerCase()
    .replace(/[^\wäöüß\s]/gi," ")
    .split(/\s+/)
    .filter(w => w.length >= 4 && !STOP.has(w))
)];

const glossar = window.LaetitiaGlossar || {};

// ── Wortliste aufbauen ──────────────────────────────────────────────────
const list = document.getElementById("wordList");
let activeWord = null;

wörter.forEach(w => {
  const eintrag = glossar[w];
  const row = document.createElement("div");
  row.className = "wordRow";
  row.dataset.word = w;

  const name = document.createElement("span");
  name.className = "wordName";
  name.textContent = w;

  const badge = document.createElement("span");
  badge.className = "wordBadge " + (eintrag ? "badge-ok" : "badge-tts");
  badge.textContent = eintrag ? "✓ Erklärung" : "🔊";

  row.appendChild(name);
  row.appendChild(badge);
  row.addEventListener("click", () => showWord(w));
  list.appendChild(row);
});

if(wörter.length === 0){
  list.innerHTML = '<div style="padding:12px;color:var(--muted);font-weight:900;">Keine Wörter gefunden.</div>';
}

// ── Wort anzeigen ───────────────────────────────────────────────────────
function showWord(w){
  // Aktiv-Markierung
  list.querySelectorAll(".wordRow").forEach(r => r.classList.remove("active"));
  const activeRow = list.querySelector(`.wordRow[data-word="${w}"]`);
  if(activeRow) activeRow.classList.add("active");
  activeWord = w;

  const eintrag = glossar[w];
  const empty   = document.getElementById("explainEmpty");
  const content = document.getElementById("explainContent");
  const btnSpeak = document.getElementById("btnSpeak");

  empty.style.display = "none";
  content.style.display = "flex";
  btnSpeak.style.display = "";

  document.getElementById("explainWord").textContent = w;

  if(eintrag && eintrag.erklaerung){
    // Erklärung parsen: [Wortart] Text | Synonym: ... | Gegenteil: ...
    let erk = eintrag.erklaerung;

    // Seltenpräfix entfernen (wird separat angezeigt)
    const isSelten = erk.startsWith("✨");
    erk = erk.replace("✨ Das ist ein ganz besonderes Wort — es lohnt sich, es zu lernen! ","");

    // Wortart extrahieren
    const wortartMatch = erk.match(/^\[([^\]]+)\]\s*/);
    let wortart = "", mainErk = erk;
    if(wortartMatch){
      wortart = wortartMatch[1];
      mainErk = erk.substring(wortartMatch[0].length);
    }

    // Teile aufsplitten
    const parts = mainErk.split(" | ");
    const hauptText = parts[0] || "";
    const metaParts = parts.slice(1);

    document.getElementById("explainWortart").textContent = wortart;
    document.getElementById("explainWortart").style.display = wortart ? "" : "none";
    document.getElementById("explainText").textContent = hauptText;
    document.getElementById("explainSelten").style.display = isSelten ? "" : "none";

    const meta = document.getElementById("explainMeta");
    meta.innerHTML = "";
    metaParts.forEach(p => {
      const div = document.createElement("div");
      div.className = "explain-meta-row";
      // "Synonym: ..." → fett "Synonym:", dann Text
      const colon = p.indexOf(":");
      if(colon > -1){
        div.innerHTML = `<strong>${p.substring(0,colon+1)}</strong>${p.substring(colon+1)}`;
      } else {
        div.textContent = p;
      }
      meta.appendChild(div);
    });
  } else {
    // Kein Glossar-Eintrag — nur vorlesen
    document.getElementById("explainWortart").style.display = "none";
    document.getElementById("explainText").textContent = "Für dieses Wort gibt es noch keine Erklärung. Du kannst es aber vorlesen lassen.";
    document.getElementById("explainMeta").innerHTML = "";
    document.getElementById("explainSelten").style.display = "none";
  }

  // Dwell neu binden (kein automatisches Vorlesen — Edge blockiert TTS ohne direkten Klick)
  rebindDwell();
}

// ── TTS — robust für file:// in Edge ────────────────────────────────────
// Edge liefert getVoices() beim ersten Aufruf leer → onvoiceschanged abwarten
let _deVoice = null;

function loadVoice(callback){
  if(_deVoice){ callback(_deVoice); return; }
  var voices = window.speechSynthesis.getVoices();
  var de = voices.find(v => (v.lang||"").toLowerCase().startsWith("de"));
  if(de){ _deVoice = de; callback(de); return; }
  // Noch nicht geladen — auf Event warten
  window.speechSynthesis.onvoiceschanged = function(){
    var v2 = window.speechSynthesis.getVoices();
    var de2 = v2.find(v => (v.lang||"").toLowerCase().startsWith("de"));
    _deVoice = de2 || null;
    callback(_deVoice);
    window.speechSynthesis.onvoiceschanged = null;
  };
  // Fallback: nach 800ms nochmal versuchen auch ohne Event
  setTimeout(function(){
    if(_deVoice) return;
    var v3 = window.speechSynthesis.getVoices();
    _deVoice = v3.find(v => (v.lang||"").toLowerCase().startsWith("de")) || null;
    callback(_deVoice);
  }, 800);
}

function speakWord(w, eintrag){
  var btn = document.getElementById("btnSpeak");
  var lbl = document.getElementById("btnSpeakLabel");
  // Zweiter Klick = Stopp
  if(window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
    if(btn) btn.classList.remove("speaking");
    if(lbl) lbl.textContent = "🔊 Erklärung vorlesen";
    return;
  }
  loadVoice(function(voice){
    try{
      window.speechSynthesis.cancel();
      var text = w;
      if(eintrag && eintrag.erklaerung){
        var erk = eintrag.erklaerung
          .replace("✨ Das ist ein ganz besonderes Wort — es lohnt sich, es zu lernen! ","")
          .replace(/\[[^\]]+\]\s*/,"")
          .replace(/ \| Synonym:[^|]*/,"")
          .replace(/ \| Gegenteil:[^|]*/,"");
        text = w + ". " + erk;
      }
      var u = new SpeechSynthesisUtterance(text);
      if(voice) u.voice = voice;
      u.lang  = "de-DE";
      u.rate  = 0.88;
      u.pitch = 1.0;
      if(btn) btn.classList.add("speaking");
      if(lbl) lbl.textContent = "⏹ Stopp";
      u.onend   = function(){
        if(btn) btn.classList.remove("speaking");
        if(lbl) lbl.textContent = "🔊 Erklärung vorlesen";
      };
      u.onerror = function(e){
        console.warn("TTS Fehler:",e);
        if(btn) btn.classList.remove("speaking");
        if(lbl) lbl.textContent = "🔊 Erklärung vorlesen";
      };
      window.speechSynthesis.speak(u);
    }catch(e){
      console.warn("TTS Exception:", e);
      if(btn) btn.classList.remove("speaking");
      if(lbl) lbl.textContent = "🔊 Erklärung vorlesen";
    }
  });
}

document.getElementById("btnSpeak").addEventListener("click", ()=>{
  if(activeWord) speakWord(activeWord, glossar[activeWord]);
});

// ── Zurück ───────────────────────────────────────────────────────────────
document.getElementById("btnBack").addEventListener("click", ()=>{
  history.back();
});

// ── Dwell ────────────────────────────────────────────────────────────────
const DWELL_MS    = parseInt(localStorage.getItem("laetitia_dwell_ms"))       || 600;
const LEAVE_GRACE = parseInt(localStorage.getItem("laetitia_leave_grace_ms")) || 100;

function rebindDwell(){
  if(window._dwellHandle && typeof window._dwellHandle.cancelDwell === "function"){
    window._dwellHandle.cancelDwell();
  }
  const attach = window.LaetitiaAttachDwell;
  if(!attach) return;
  window._dwellHandle = attach(".wordRow, #btnBack, #btnSpeak", {
    dwellMs:    DWELL_MS,
    leaveGrace: LEAVE_GRACE,
    onActivate: (el) => {
      if(el.classList.contains("wordRow")) showWord(el.dataset.word);
      else try{ el.click(); }catch(e){}
    }
  });
}

// Stimmen sofort vorladen damit TTS beim ersten Klick funktioniert
loadVoice(function(v){
  console.log("TTS Stimme geladen:", v ? v.name : "Systemstimme");
});
setTimeout(rebindDwell, 100);
</script>
</body>
</html>
