<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Memory</title>
<style>
  :root{
    --bg:#f6f7fb;
    --panel:#ffffff;
    --border:rgba(15,23,42,.14);
    --shadow:0 10px 26px rgba(15,23,42,.08);
    --text:#0f172a;
    --muted:rgba(15,23,42,.65);
    --green:#1db954;
    --green2:#18a84c;
    --red:#e24a4a;
    --red2:#cf3b3b;
    --gold:#f59e0b;
    --radius:18px;
    --card-radius:14px;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; overflow:hidden;
  }

  .viewport{ height:100vh; display:flex; align-items:center; justify-content:center; padding:10px; }
  .app{ width:min(1100px,96vw); height:calc(100vh - 20px); display:flex; flex-direction:column; gap:8px; min-height:0; }

  .smallStatus{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); padding:6px 10px; font-weight:900; font-size:13px;
    color:var(--muted); line-height:1.1; flex:0 0 auto;
  }
  .smallStatus strong{ color:var(--text); }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:10px; flex:1 1 auto; min-height:0; overflow:hidden;
  }

  .screen.hidden{ display:none; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:10px; }
  .headline{ font-size:24px; font-weight:1000; margin:0; }
  .sub{ margin:4px 0 0 0; font-size:14px; font-weight:900; color:var(--muted); }

  /* ── Dwell-Ring ──────────────────────────────────────────────────── */
  @keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
  .dwell-ring-svg{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none; z-index:10; width:70px; height:70px;
  }
  .dwell-ring-svg circle{
    fill:none; stroke:var(--green); stroke-width:5;
    stroke-dasharray:220; stroke-dashoffset:220;
    transform:rotate(-90deg); transform-origin:35px 35px;
  }
  .dwell-ring-svg circle.animating{
    animation:dwellRing var(--dwell-duration,0.6s) linear forwards;
  }
  .dwell-active{
    outline:4px solid var(--green) !important;
    box-shadow:0 0 0 5px rgba(29,185,84,0.45) !important;
    transform:scale(1.06) !important;
    z-index:3; transition:none !important;
  }

  /* ── Generische Buttons ──────────────────────────────────────────── */
  button{ font-family:inherit; }
  a.uibtn, button.uibtn{
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; border-radius:16px;
    border:1px solid rgba(0,0,0,0.10); background:var(--green);
    color:#0b1b10; font-weight:1000; cursor:pointer;
    user-select:none; position:relative; transition:none;
  }
  a.uibtn:hover, button.uibtn:hover{ background:var(--green2); outline:3px solid rgba(29,185,84,.50); outline-offset:2px; z-index:2; }
  a.navBtn, button.navBtn{ min-height:66px; font-size:17px; font-weight:1000; padding:8px 14px; flex:1; }
  button.btnRed{ background:var(--red); color:#fff; border-color:rgba(0,0,0,.10); }
  button.btnRed:hover{ background:var(--red2); }

  /* ── Mute-Button ─────────────────────────────────────────────────── */
  #btnMute{
    background:rgba(15,23,42,.07);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:0 10px;
    font-size:18px;
    min-height:0; height:100%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; width:46px;
    position:relative;
    transition:none;
    user-select:none;
  }
  #btnMute:hover{ background:rgba(15,23,42,.14); outline:3px solid rgba(29,185,84,.40); }
  #btnMute.muted{
    background:rgba(226,74,74,.10);
    border-color:rgba(226,74,74,.30);
    color:var(--red);
  }

  /* ── MENÜ ────────────────────────────────────────────────────────── */
  #screenMenu{ height:100%; display:flex; flex-direction:column; gap:10px; }

  #setGrid{ display:flex; gap:10px; flex-wrap:wrap; }
  .setBtn{
    display:flex; align-items:center; gap:8px;
    padding:10px 16px; border-radius:12px;
    border:2px solid var(--border); background:rgba(15,23,42,.04);
    color:var(--text); font-weight:900; font-size:15px;
    cursor:pointer; position:relative; transition:none; min-height:48px;
  }
  .setBtn:hover, .setBtn:focus{ border-color:var(--green); background:rgba(29,185,84,.08); outline:3px solid rgba(29,185,84,.40); }
  .setBtn--active{ border-color:var(--green); background:rgba(29,185,84,.15); box-shadow:0 0 0 3px rgba(29,185,84,.30); }
  .setEmoji{ font-size:20px; letter-spacing:2px; }
  .setLabel{ font-size:14px; font-weight:1000; }

  #stufeGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:10px; flex:1; align-content:start;
  }
  .stufeBtn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; min-height:130px; padding:12px 10px;
    border-radius:var(--radius); border:2px solid var(--border);
    background:var(--panel); color:var(--text);
    font-weight:1000; cursor:pointer; position:relative;
    box-shadow:var(--shadow); transition:none;
  }
  .stufeBtn:hover:not(.stufeBtn--locked), .stufeBtn:focus:not(.stufeBtn--locked){
    border-color:var(--green); background:rgba(29,185,84,.08);
    transform:scale(1.04); outline:4px solid var(--green);
    box-shadow:0 0 0 5px rgba(29,185,84,.30);
  }
  .stufeBtn--locked{ opacity:0.55; cursor:not-allowed; background:rgba(15,23,42,.04); }
  .stufeLock{ font-size:22px; margin-bottom:2px; }
  .stufeName{ font-size:17px; font-weight:1000; }
  .stufeDesc{ font-size:11px; font-weight:900; color:var(--muted); text-align:center; }
  .stufePreview{ font-size:20px; margin-top:2px; letter-spacing:3px; }
  .stufeBest{ font-size:11px; font-weight:900; color:var(--green); margin-top:3px; }

  .menuFooter{ display:flex; gap:10px; margin-top:auto; }

  /* ── SPIEL ───────────────────────────────────────────────────────── */
  #screenGame{ height:100%; display:flex; flex-direction:column; gap:8px; }
  .gameHeader{ display:flex; gap:10px; align-items:stretch; flex:0 0 auto; }
  .gameHeaderBox{
    background:var(--panel); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow);
    padding:6px 12px; font-weight:900; font-size:13px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .gameHeaderBox strong{ color:var(--text); font-size:15px; }
  #memBoard{ display:grid; gap:8px; flex:1; min-height:0; }

  /* ── FLIP-ANIMATION ──────────────────────────────────────────────── */
  .cardWrapper{
    perspective: 600px;
    cursor:pointer; position:relative;
    min-height:0; min-width:0;
    user-select:none;
  }
  .cardWrapper[data-disabled="1"]{ pointer-events:none; cursor:default; }
  .cardWrapper:hover:not([data-disabled="1"]) .cardInner,
  .cardWrapper.dwell-active .cardInner{
    outline: 4px solid var(--green);
    outline-offset: 2px;
  }

  .cardInner{
    width:100%; height:100%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    border-radius:var(--card-radius);
  }
  .cardInner.flipped{ transform: rotateY(180deg); }

  .cardFace{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--card-radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border:3px solid var(--border);
    box-shadow:0 4px 12px rgba(15,23,42,.08);
  }
  .cardBack{ background:linear-gradient(135deg,#e8f5e9 0%,#f1f8e9 100%); }
  .cardFront{
    background:linear-gradient(135deg,#fff9c4 0%,#fff8e1 100%);
    border-color:var(--gold);
    transform: rotateY(180deg);
  }
  .cardSymbol{
    font-size:clamp(22px,4vw,46px);
    line-height:1;
    pointer-events:none;
  }

  .cardWrapper--matched .cardInner{ transform: rotateY(180deg); }
  .cardWrapper--matched .cardFront{
    background:linear-gradient(135deg,#c8e6c9 0%,#a5d6a7 100%);
    border-color:var(--green);
    opacity:0.85;
  }
  @keyframes matchPulse{
    0%  { transform:rotateY(180deg) scale(1); }
    40% { transform:rotateY(180deg) scale(1.08); }
    100%{ transform:rotateY(180deg) scale(1); }
  }
  .cardWrapper--matched .cardInner{ animation: matchPulse 0.35s ease-out forwards; }

  .gameFooter{ display:flex; gap:10px; flex:0 0 auto; }
  #memStatus{ font-size:13px; font-weight:900; color:var(--muted); text-align:center; padding:2px 0; }

  /* ── END-SCREEN ──────────────────────────────────────────────────── */
  #screenEnd{
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
  }
  .endBox{
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:32px 28px; text-align:center; width:min(500px,94%);
  }
  #endEmoji{ font-size:72px; margin-bottom:8px; }
  #endTitle{ font-size:28px; font-weight:1000; margin:0 0 10px 0; }
  .endStat{ font-size:18px; font-weight:900; color:var(--muted); margin:4px 0; }
  .endStat strong{ color:var(--text); }
  #endBest{ font-size:16px; font-weight:1000; margin:6px 0; }
  #endNext{
    margin-top:10px; padding:8px 14px;
    background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.35);
    border-radius:12px; font-size:15px; font-weight:1000; color:#92400e;
    display:none;
  }
  .endBtns{ display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  button.endBtn{
    min-height:52px; padding:12px 24px; font-size:17px;
    border-radius:16px; border:1px solid rgba(0,0,0,.10);
    font-weight:1000; cursor:pointer; display:flex;
    align-items:center; justify-content:center; position:relative; transition:none;
  }

  /* Zurück-Button Goldstandard */
  #btnReturnFromMenu{
    min-height:72px; font-size:20px;
    background:#ede9fe; color:#4c1d95;
    border:2px solid #8b5cf6;
  }
  #btnReturnFromMenu:hover, #btnReturnFromMenu:focus{
    background:#ddd6fe; outline:3px solid #8b5cf6;
  }
  #btnReturnFromMenu .dwell-ring-svg circle{ stroke:#8b5cf6; }
  .endBtnGreen{ background:var(--green); color:#0b1b10; }
  .endBtnGreen:hover{ background:var(--green2); }
  .endBtnGrey{ background:rgba(15,23,42,.07); color:var(--text); }
  .endBtnGrey:hover{ background:rgba(15,23,42,.14); }

  @media(max-width:600px){
    #memBoard{ gap:5px; }
    .cardFace{ border-radius:10px; }
    .cardWrapper{ border-radius:10px; }
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="app">

    <div class="panel">

      <!-- ══ MENÜ ══════════════════════════════════════════════════ -->
      <div id="screenMenu" class="screen">
        <div class="card">
          <div class="headline">🃏 Memory</div>
          <div class="sub">Wähle ein Symbol-Set und eine Schwierigkeitsstufe</div>
        </div>
        <div class="card">
          <div style="font-size:13px;font-weight:900;color:var(--muted);margin-bottom:8px;">Symbol-Set:</div>
          <div id="setGrid"></div>
        </div>
        <div class="card" style="flex:1;min-height:0;overflow:hidden;">
          <div style="font-size:13px;font-weight:900;color:var(--muted);margin-bottom:8px;">Schwierigkeitsstufe:</div>
          <div id="stufeGrid"></div>
        </div>
        <div class="menuFooter">
          <a class="uibtn navBtn" id="btnReturnFromMenu" href="../../index.html">
            ← Zurück
            <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
          </a>
        </div>
      </div>

      <!-- ══ SPIEL ══════════════════════════════════════════════════ -->
      <div id="screenGame" class="screen hidden">
        <div class="gameHeader">
          <div class="gameHeaderBox" style="flex:1;">⏱ <strong id="memTimer">0 s</strong></div>
          <div class="gameHeaderBox" style="flex:2;"><span id="memStats">Züge: 0</span></div>
          <div class="gameHeaderBox" style="flex:2;"><span id="memStatus">Karte wählen…</span></div>
          <!-- Mute-Button: klein, unauffällig, aber per Dwell erreichbar -->
          <button id="btnMute" title="Musik stumm schalten">🔊</button>
        </div>
        <div id="memBoard"></div>
        <div class="gameFooter">
          <button class="uibtn navBtn btnRed" id="btnMenu">✕ Menü</button>
          <button class="uibtn navBtn" id="btnRetry">↺ Nochmal</button>
        </div>
      </div>

      <!-- ══ END-SCREEN ═════════════════════════════════════════════ -->
      <div id="screenEnd" class="screen hidden">
        <div class="endBox">
          <div id="endEmoji">🎉</div>
          <div id="endTitle">Super gemacht!</div>
          <div class="endStat">Stufe: <strong id="endStufe">–</strong></div>
          <div class="endStat"><strong id="endMoves">–</strong> &nbsp;·&nbsp; <strong id="endTime">–</strong></div>
          <div id="endBest">–</div>
          <div id="endNext">–</div>
          <div class="endBtns">
            <button class="endBtn endBtnGreen" data-action="RETRY">↺ Nochmal</button>
            <button class="endBtn endBtnGrey"  data-action="MENU">☰ Menü</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../../core/config.js"></script>
<script src="../../core/storage.js"></script>
<script src="../../core/return.js"></script>
<script src="../../core/audioQueue.js"></script>
<script src="../../core/audio_bg.js"></script>
<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./memory_mod.js"></script>

</body>
</html>
