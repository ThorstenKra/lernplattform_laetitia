<!doctype html>
<!-- depth:3 — Pfade: ../../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Fabu</title>
<style>
:root{
  --amber:#d97706; --amber-bg:#fef3c7; --amber-dark:#78350f;
  --lila:#8b5cf6; --lila-bg:#ede9fe; --lila-dark:#4c1d95;
  --rot:#ef4444;  --rot-bg:#fee2e2;
  --grau-rand:#cbd5e1; --text:#0f172a;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fffbeb; height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}
#kopfLeiste{
  flex-shrink:0; padding:10px 14px;
  background:#fff; border-bottom:2px solid var(--grau-rand);
  display:flex; align-items:center;
}
#kopfTitel{ font-size:20px; font-weight:1000; color:var(--amber-dark); }
#hauptBereich{
  flex:1; min-height:0; overflow:hidden;
  display:flex; flex-direction:column;
  padding:10px 12px; gap:8px;
}
.status-screen{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; text-align:center;
}
.status-emoji{ font-size:52px; }
.status-text{ font-size:24px; font-weight:1000; color:var(--text); }
.status-sub{ font-size:16px; color:#64748b; }
#btnStarten,#btnGedichte{
  min-height:84px; width:min(320px,90%);
  border-radius:18px; border:3px solid var(--amber);
  background:var(--amber-bg); color:var(--amber-dark);
  font-size:22px; font-weight:1000; cursor:pointer; user-select:none;
  position:relative; transition:none; font-family:inherit;
}
#btnStarten:hover,#btnStarten:focus,#btnGedichte:hover,#btnGedichte:focus{ background:#fde68a; outline:4px solid var(--amber); }
#btnStarten.dwell-active,#btnGedichte.dwell-active{ transform:scale(1.02) !important; outline:3px solid var(--amber) !important; transition:none !important; }

.geschichten-liste{
  flex:1; min-height:0; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px; padding:4px;
}
.geschichte-btn{
  min-height:84px; border-radius:16px; border:3px solid var(--amber);
  background:var(--amber-bg); color:var(--amber-dark);
  font-size:19px; font-weight:1000; cursor:pointer; position:relative;
  transition:none; font-family:inherit; display:flex; align-items:center;
  gap:12px; padding:0 18px; text-align:left; user-select:none;
}
.geschichte-btn:hover,.geschichte-btn:focus{ background:#fde68a; outline:none; }
.geschichte-btn.dwell-active{ transform:scale(1.015) !important; outline:3px solid var(--amber) !important; transition:none !important; }
.geschichte-emoji{ font-size:32px; pointer-events:none; }

#fabuAvatarWrap{ flex-shrink:0; display:flex; justify-content:center; }
.fabu-avatar{ width:104px; height:104px; }
.fabu-avatar.blink .fb-augen{ animation: fbBlinzeln 4.5s ease-in-out infinite; transform-origin:100px 100px; }
@keyframes fbBlinzeln{ 0%,94%,100%{ transform:scaleY(1); } 97%{ transform:scaleY(0.1); } }
.fabu-avatar.spricht .fb-mund{ animation: fbSprechen .32s ease-in-out infinite alternate; transform-origin:100px 138px; }
@keyframes fbSprechen{ from{ transform:scaleY(1); } to{ transform:scaleY(1.6); } }
.fb-funke{ opacity:0; transition:opacity .3s; }
.fabu-avatar.freude .fb-funke{ opacity:1; }

#fabuLabel{ font-size:13px; font-weight:1000; color:var(--amber-dark); text-transform:uppercase; letter-spacing:.05em; flex-shrink:0; }
#fabuAntwort{
  flex:1; min-height:0; background:#fff; border:2px solid var(--grau-rand);
  border-radius:14px; padding:14px 16px;
  font-size:22px; font-weight:700; color:var(--text);
  line-height:1.5; overflow-y:auto;
  pointer-events:none; user-select:none;
}
#vorschlaegeGrid{
  display:grid; grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr; gap:8px;
  flex-shrink:0; height:148px;
}
.vorschlag-btn{
  border-radius:14px; border:2px solid var(--amber); background:var(--amber-bg);
  display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:1000; color:var(--amber-dark);
  line-height:1.25; cursor:pointer; position:relative; transition:none;
  font-family:inherit; text-align:center; padding:4px 10px; user-select:none;
}
.vorschlag-btn:hover,.vorschlag-btn:focus{ background:#fde68a; outline:none; }
.vorschlag-btn.dwell-active{ transform:scale(1.03) !important; outline:3px solid var(--amber) !important; transition:none !important; }

.nav-leiste{
  flex-shrink:0; display:flex; gap:8px; padding:8px 12px;
  background:#fff; border-top:2px solid var(--grau-rand);
}
.nav-btn{
  flex:1; min-height:70px; border-radius:14px;
  font-size:16px; font-weight:1000; cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center;
  gap:6px; transition:none; border:2px solid;
  text-decoration:none; font-family:inherit; background:none;
}
.nav-btn-zurueck{ background:var(--lila-bg); border-color:var(--lila); color:var(--lila-dark); }
.nav-btn-zurueck:hover{ background:#ddd6fe; }
.nav-btn-weiter{ background:#dcfce7; border-color:#16a34a; color:#166534; }
.nav-btn-beenden{ background:var(--rot-bg); border-color:var(--rot); color:#7f1d1d; }
.nav-btn-beenden:hover{ background:#fecaca; }
.nav-btn.dwell-active{ transform:scale(1.02) !important; outline:3px solid currentColor !important; transition:none !important; }
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:48px; height:48px;
}
.dwell-ring-svg circle{
  fill:none; stroke-width:4; stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px; opacity:0;
}
.dwell-ring-svg circle.animating{ opacity:1; animation:dwellRing var(--dwell-duration,.9s) linear forwards; }
</style>
</head>
<body>

<div id="kopfLeiste">
  <div id="kopfTitel">🦊 Fabu — Geschichtenerzähler</div>
</div>

<div id="hauptBereich">

  <div id="startScreen" class="status-screen">
    <div class="status-emoji">🦊</div>
    <div class="status-text">Fabu ist da</div>
    <div class="status-sub">Möchtest du eine Geschichte hören, oder ein Gedicht?</div>
    <button id="btnStarten">
      📖 Geschichten anschauen
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#d97706"/></svg>
    </button>
    <button id="btnGedichte">
      📜 Gedichte anschauen
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#d97706"/></svg>
    </button>
  </div>

  <div id="geschichtenAuswahlScreen" class="status-screen" style="display:none">
    <div class="status-text" style="margin-bottom:6px;">📖 Welche Geschichte?</div>
    <div class="geschichten-liste" id="geschichtenListe"></div>
  </div>

  <div id="gedichteAuswahlScreen" class="status-screen" style="display:none">
    <div class="status-text" style="margin-bottom:6px;">📜 Welches Gedicht?</div>
    <div class="geschichten-liste" id="gedichteListe"></div>
  </div>

  <div id="gespraechContainer" style="display:none">
    <div id="fabuAvatarWrap" aria-hidden="true">
      <svg id="fabuAvatar" class="fabu-avatar blink" viewBox="0 0 200 200">
        <path id="fbOhrL" d="M45,55 L30,10 L75,45 Z" fill="#f59e0b" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
        <path id="fbOhrR" d="M155,55 L170,10 L125,45 Z" fill="#f59e0b" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
        <path id="fbOhrLi" d="M44,45 L36,22 L58,40 Z" fill="#fff7ed"/>
        <path id="fbOhrRi" d="M156,45 L164,22 L142,40 Z" fill="#fff7ed"/>
        <path id="fbFunkeL" class="fb-funke" d="M40,50 l4,10 l10,4 l-10,4 l-4,10 l-4,-10 l-10,-4 l10,-4 Z" fill="#fbbf24"/>
        <path id="fbFunkeR" class="fb-funke" d="M158,45 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 Z" fill="#fbbf24"/>
        <circle cx="100" cy="105" r="75" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
        <ellipse cx="55" cy="128" rx="13" ry="8" fill="#fde68a" opacity="0.8"/>
        <ellipse cx="145" cy="128" rx="13" ry="8" fill="#fde68a" opacity="0.8"/>
        <g class="fb-augen">
          <ellipse id="fbAugeL" cx="72" cy="100" rx="8" ry="11" fill="#78350f"/>
          <ellipse id="fbAugeR" cx="128" cy="100" rx="8" ry="11" fill="#78350f"/>
        </g>
        <path id="fbBraueL" d="M60,83 Q75,77 90,83" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path id="fbBraueR" d="M110,83 Q125,77 140,83" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path id="fbNase" d="M94,112 Q100,118 106,112 Q100,122 94,112 Z" fill="#78350f"/>
        <path id="fbMund" class="fb-mund" d="M78,135 Q100,147 122,135" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="fabuLabel">Fabu erzählt:</div>
    <div id="fabuAntwort"></div>
    <div id="vorschlaegeGrid"></div>
  </div>

</div>

<div class="nav-leiste">
  <button class="nav-btn nav-btn-zurueck" id="btnZurueck">
    ← Zurück
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#8b5cf6"/></svg>
  </button>
  <button class="nav-btn nav-btn-weiter" id="btnGeschichteWeiter" style="display:none">
    ➡️ Weiter
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#16a34a"/></svg>
  </button>
  <button class="nav-btn nav-btn-beenden" id="btnBeenden" style="display:none">
    ✕ Geschichte beenden
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#ef4444"/></svg>
  </button>
</div>

<script src="../../../core/dwell.js"></script>
<script src="../../../core/error_handler.js"></script>
<script src="../../../core/stats.js"></script>
<script src="./geschichten_data.js"></script>
<script src="../../gedichte/gedichte_data.js"></script>
<script src="../lernfortschritt_gemeinsam.js"></script>
<script src="./fabu_mod.js"></script>
<script>
  window.FabuMod && window.FabuMod.init();
</script>
</body>
</html>
