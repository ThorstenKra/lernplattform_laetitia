<!doctype html>
<!-- depth:2 — Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Quasselkiste Training</title>
<style>
:root{
  --lila:#8b5cf6; --lila-bg:#ede9fe; --lila-dark:#4c1d95;
  --blau:#3b82f6; --blau-bg:#dbeafe;
  --gruen:#16a34a; --gruen-bg:#dcfce7;
  --gold:#f59e0b;
  --border:#1a1a1a;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#2a2a2a; height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── Ziel-/Ausgabe-Leiste (ersetzt die Kopfleiste — Platz fuer Icon-Reihen) ── */
#zielLeiste{
  flex-shrink:0; height:34px;
  background:#111; border-bottom:2px solid #444;
  display:flex; align-items:center; justify-content:center;
  padding:2px 10px;
}
#zielAnzeige{
  font-size:16px; font-weight:1000; color:#fff;
  background:#222; border:2px solid #f59e0b; border-radius:8px;
  padding:2px 16px; max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#pfadAnzeige{
  font-size:12px; font-weight:900; color:#aaa;
  white-space:nowrap; margin-left:8px;
}

/* ── Grid ────────────────────────────────────────────────────────────────── */
#grid{
  flex:1; min-height:0;
  display:grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(6, 1fr);
  border-left:2px solid var(--border);
  border-top:2px solid var(--border);
}
.kachel{
  border-right:2px solid var(--border);
  border-bottom:2px solid var(--border);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer; position:relative;
  user-select:none; overflow:hidden;
  transition:none;
}
.kachel:hover{ filter:brightness(.88); }
.kachel:focus{ outline:3px solid #f59e0b; outline-offset:-2px; }
.kachel.richtig{
  outline:4px solid #16a34a !important;
  outline-offset:-2px; z-index:2;
  background-color: rgba(22,163,74,0.25) !important;
}
.kachel.falsch{
  outline:4px solid #ef4444 !important;
  outline-offset:-2px; z-index:2;
  filter:brightness(0.75) saturate(2);
}
.kachel.hinweis{
  outline:5px solid #f59e0b !important;
  outline-offset:-2px; z-index:3;
  animation: hinweisPuls 0.7s ease-in-out infinite alternate;
}
@keyframes hinweisPuls{
  from{ filter:brightness(1.0); }
  to  { filter:brightness(1.35); }
}
.kachel-img{
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  object-fit:contain; pointer-events:none;
}
.kachel-name{
  position:relative; z-index:1;
  font-size:clamp(9px,1.1vw,14px); font-weight:900;
  color:#111; text-align:center; line-height:1.2;
  padding:2px 3px; word-break:break-word;
  pointer-events:none;
}

/* ── Dwell-Ring ──────────────────────────────────────────────────────────── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none; z-index:10;
  width:min(52px,80%) ; height:min(52px,80%);
}
.dwell-ring-svg circle{
  fill:none; stroke-width:4;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
  opacity:0;
}
.dwell-ring-svg circle.animating{
  opacity:1;
  animation:dwellRing var(--dwell-duration,.9s) linear forwards;
}

/* ── Ebene 2 ─────────────────────────────────────────────────────────────── */
.kachel.ebene2-treffer .kachel-img{ opacity:1; }
.kachel.ebene2-treffer .kachel-name{ display:block !important; font-size:clamp(8px,1vw,13px); font-weight:1000; color:#111; background:rgba(255,255,255,0.85); padding:1px 2px; }
.kachel.ebene2-leer{ opacity:0.18; pointer-events:none; }

/* ── Kachel unsichtbar (falsche Seite) ───────────────────────────────────── */
.kachel.kachel-unsichtbar{ pointer-events:none; background:#ffffff !important; }
.kachel.kachel-unsichtbar > *{ display:none; }

/* ── Nav-Leiste ──────────────────────────────────────────────────────────── */
.nav-leiste{
  flex-shrink:0; height:72px;
  display:flex; gap:6px; padding:6px 8px;
  background:#111; border-top:2px solid #444;
}
.nav-btn{
  flex:1; border-radius:12px;
  font-size:clamp(13px,1.5vw,17px); font-weight:1000;
  cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center;
  gap:5px; transition:none; border:2px solid; text-decoration:none;
  background:none;
}
.nav-btn-zurueck{ background:var(--lila-bg); border-color:var(--lila); color:var(--lila-dark); }
.nav-btn-hinweis{ background:#fef3c7; border-color:#f59e0b; color:#92400e; }
.nav-btn-weiter { background:var(--gruen-bg); border-color:var(--gruen); color:#14532d; }
.nav-btn-loeschen{ background:#fee2e2; border-color:#ef4444; color:#991b1b; }
.nav-btn-sprechen{ background:var(--blau-bg); border-color:var(--blau); color:#1e3a8a; }
.nav-btn-seite{ background:#1e3a5f; border-color:#3b82f6; color:#93c5fd; flex:0 0 auto; min-width:84px; }
.nav-btn:hover,.nav-btn:focus{ filter:brightness(.9); outline:3px solid currentColor; }
.nav-btn[aria-disabled="true"]{ opacity:.35; pointer-events:none; }
.nav-btn .dwell-ring-svg{ width:52px; height:52px; }
.nav-btn .dwell-ring-svg circle{ stroke:currentColor; }

/* ── Start-Screen ────────────────────────────────────────────────────────── */
#startScreen{
  flex:1; min-height:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; padding:20px 16px;
  background:#1a1a1a;
}
#startTitel{ font-size:clamp(20px,3vw,28px); font-weight:1000; color:#f59e0b; }
#startUntertitel{ font-size:clamp(13px,1.6vw,17px); color:#888; margin-bottom:4px; }
.stufe-btn{
  width:100%; max-width:540px; min-height:100px;
  border-radius:16px; font-weight:1000;
  cursor:pointer; user-select:none; position:relative;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:5px; border:3px solid; background:none; transition:none;
}
#btnStufe1{ background:#172554; border-color:#3b82f6; color:#93c5fd; }
#btnStufe2{ background:#14532d; border-color:#16a34a; color:#86efac; }
#btnModus0{ background:#451a03; border-color:#f59e0b; color:#fde68a; }
.stufe-btn:hover{ filter:brightness(1.15); }
.stufe-btn.dwell-active{ transform:scale(1.02) !important; outline:3px solid currentColor !important; transition:none !important; }
.stufe-nr{ font-size:clamp(15px,2vw,20px); font-weight:1000; pointer-events:none; }
.stufe-info{ font-size:clamp(11px,1.3vw,14px); opacity:.75; pointer-events:none; }
.stufe-btn .dwell-ring-svg{ width:52px; height:52px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
.stufe-btn .dwell-ring-svg circle{ stroke:currentColor; }
#startZurueck{
  width:100%; max-width:540px; min-height:72px;
  border-radius:16px; font-size:clamp(14px,1.8vw,18px); font-weight:1000;
  cursor:pointer; user-select:none; position:relative;
  display:flex; align-items:center; justify-content:center;
  gap:6px; border:2px solid var(--lila);
  background:var(--lila-bg); color:var(--lila-dark);
  text-decoration:none; transition:none; margin-top:6px;
}
#startZurueck:hover{ background:#ddd6fe; }
#startZurueck.dwell-active{ transform:scale(1.02) !important; outline:3px solid #8b5cf6 !important; transition:none !important; }
#startZurueck .dwell-ring-svg{ width:52px; height:52px; }
#startZurueck .dwell-ring-svg circle{ stroke:#8b5cf6; }
</style>
</head>
<body>

<div id="zielLeiste">
  <div id="zielAnzeige">–</div>
  <div id="pfadAnzeige"></div>
</div>

<!-- Start-Screen -->
<div id="startScreen">
  <div id="startTitel">🎯 Pfad-Training</div>
  <div id="startUntertitel">Wähle eine Stufe</div>
  <button id="btnStufe1" class="stufe-btn">
    <span class="stufe-nr">Stufe 1 — Ein Klick</span>
    <span class="stufe-info">656 Wörter · direkt eine Kachel drücken</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </button>
  <button id="btnStufe2" class="stufe-btn">
    <span class="stufe-nr">Stufe 2 — Zwei Klicks</span>
    <span class="stufe-info">1 224 Wörter · zwei Kacheln nacheinander drücken</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </button>
  <button id="btnModus0" class="stufe-btn">
    <span class="stufe-nr">Modus 0 — Frei sprechen</span>
    <span class="stufe-info">Quasselkiste 60 · frei kommunizieren ohne Vorgabe</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </button>
  <a id="startZurueck" href="">
    ← Zurück
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
  </a>
</div>

<div id="grid" style="display:none"></div>

<div class="nav-leiste" id="navLeiste" style="display:none">
  <button class="nav-btn nav-btn-zurueck" id="btnZurueck">
    <span class="btnLabel">← Zurück</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#8b5cf6"/></svg>
  </button>
  <button class="nav-btn nav-btn-seite" id="btnSeite" style="display:none">
    <span>▌▌▌</span><span id="seiteLabel">S 1</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#3b82f6"/></svg>
  </button>
  <button class="nav-btn nav-btn-hinweis" id="btnHinweis">
    <span class="btnLabel">💡 Hinweis</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#f59e0b"/></svg>
  </button>
  <button class="nav-btn nav-btn-weiter" id="btnWeiter">
    <span class="btnLabel">⏭ Weiter</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#16a34a"/></svg>
  </button>
  <button class="nav-btn nav-btn-loeschen" id="btnLoesche" style="display:none">
    <span class="btnLabel">✕ Löschen</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#ef4444"/></svg>
  </button>
  <button class="nav-btn nav-btn-sprechen" id="btnSpreche" style="display:none">
    <span class="btnLabel">🔊 Sprechen</span>
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#3b82f6"/></svg>
  </button>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./data/quasselkiste_data.js"></script>
<script src="./quasselkiste_training_mod.js"></script>
<script>
  window.QuasselTrainingMod && window.QuasselTrainingMod.init();
</script>
</body>
</html>
