<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Sachkunde</title>
<style>
  :root{
    --bg:#f0fdf4;
    --panel:#ffffff;
    --border:rgba(15,23,42,.14);
    --shadow:0 10px 26px rgba(15,23,42,.08);
    --text:#0f172a;
    --muted:rgba(15,23,42,.65);
    --green:#16a34a;
    --green2:#15803d;
    --lila:#8b5cf6;
    --radius:18px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .app{
    width:min(900px,96vw);
    display:flex; flex-direction:column; gap:14px; padding:16px;
  }

  .greeting{
    background:var(--panel); border:2px solid var(--green);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px 26px; text-align:center;
  }
  .greeting-emoji{ font-size:52px; margin-bottom:8px; }
  .greeting-title{ font-size:clamp(26px,4vw,38px); font-weight:1000; margin:0 0 6px 0; color:var(--green); }
  .greeting-sub{ font-size:clamp(14px,2.2vw,18px); font-weight:800; color:var(--muted); margin:0; }

  .moduleGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  a.modBtn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; min-height:120px; padding:18px 14px;
    background:var(--panel); border:2px solid rgba(22,163,74,0.40);
    border-radius:var(--radius); box-shadow:var(--shadow);
    text-decoration:none; color:var(--text); font-weight:1000;
    user-select:none; cursor:pointer; position:relative; transition:none;
  }
  a.modBtn:hover, a.modBtn:focus{
    transform:scale(1.05); outline:4px solid var(--green);
    background:rgba(22,163,74,0.06); transition:none;
  }
  .mod-emoji{ font-size:40px; }
  .mod-label{ font-size:17px; text-align:center; font-weight:1000; }
  .mod-sub{ font-size:12px; font-weight:900; color:var(--muted); text-align:center; }
  .mod-badge{
    position:absolute; top:10px; right:10px;
    padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:1000;
    background:rgba(22,163,74,.16); border:1px solid rgba(22,163,74,.35); color:var(--green2);
  }

  .zurueck-leiste{ flex-shrink:0; }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:72px; font-size:20px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid var(--lila);
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid var(--lila); transition:none;
  }

  @keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
  .dwell-ring-svg{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none; z-index:10; width:70px; height:70px;
  }
  .dwell-ring-svg circle{
    fill:none; stroke-width:5; stroke-linecap:round;
    stroke-dasharray:220; stroke-dashoffset:220;
    transform:rotate(-90deg); transform-origin:35px 35px;
  }
  .dwell-ring-svg circle.animating{
    animation:dwellRing var(--dwell-duration,0.6s) linear forwards;
  }
  .dwell-active{ transform:scale(1.06) !important; transition:none !important; }
</style>
</head>
<body>

<div class="app">
  <div class="greeting">
    <div class="greeting-emoji">🔬</div>
    <div class="greeting-title">Sachkunde</div>
    <div class="greeting-sub">Wähle ein Thema</div>
  </div>

  <div class="moduleGrid">
    <a class="modBtn" href="./sinnesorgane/sinnesorgane.html" id="btnSinnesorgane">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#16a34a"/></svg>
      <div class="mod-emoji">👁️</div>
      <div class="mod-label">Sinnesorgane</div>
      <div class="mod-sub">Sehen · Hören · Riechen</div>
      <div class="mod-badge">neu</div>
    </a>
  </div>

  <div class="zurueck-leiste">
    <a class="zurueckBtn" href="../../lernen.html" id="btnZurueck">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" style="stroke:#8b5cf6"/></svg>
      ← Zurück zum Lernen
    </a>
  </div>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script>
(function(){
  "use strict";
  try{
    var abs = new URL("./sachkunde.html", window.location.href).href;
    localStorage.setItem("laetitia_return_url_v1", abs);
  }catch(e){}

  var dwellMs    = parseInt(localStorage.getItem("laetitia_dwell_ms"))       || 900;
  var leaveGrace = parseInt(localStorage.getItem("laetitia_leave_grace_ms")) || 150;

  // Rule 7: LaetitiaAttachDwell als primaerer Mechanismus
  var attachDwell = window.LaetitiaAttachDwell || function(){ return {cancelDwell:function(){}}; };
  attachDwell("a.modBtn, a.zurueckBtn", {
    dwellMs: dwellMs, leaveGrace: leaveGrace,
    onActivate: function(el){ try{ el.click(); }catch(e){} }
  });

  // Direktes pointerenter als Fallback (zuverlaessig auf Tobii Accent)
  document.querySelectorAll("a.modBtn, a.zurueckBtn").forEach(function(el){
    var timer = null;
    var ring  = el.querySelector(".dwell-ring-svg circle");

    function start(){
      if(timer) return;
      el.classList.add("dwell-active");
      if(ring){
        ring.classList.remove("animating");
        void ring.offsetWidth;
        ring.style.setProperty("--dwell-duration", (dwellMs/1000) + "s");
        ring.classList.add("animating");
      }
      timer = setTimeout(function(){
        timer = null;
        try{ el.click(); }catch(e){}
      }, dwellMs);
    }
    function stop(){
      if(timer){ clearTimeout(timer); timer = null; }
      el.classList.remove("dwell-active");
      if(ring) ring.classList.remove("animating");
    }

    el.addEventListener("pointerenter", start);
    el.addEventListener("pointerleave", stop);
    el.addEventListener("mouseenter",   start);
    el.addEventListener("mouseleave",   stop);
    el.addEventListener("click",        stop);
  });
})();
</script>
</body>
</html>
