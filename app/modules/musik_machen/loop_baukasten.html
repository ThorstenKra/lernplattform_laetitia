<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Loop-Baukasten</title>
<style>
:root{
  --bg:#0d0f1a; --panel:#1a1d2e; --panel2:#22263a;
  --border:rgba(255,255,255,.10);
  --text:#f0f4ff; --muted:rgba(240,244,255,.50);
  --radius:14px;
  /* Zeilen-Farben */
  --c0:#f472b6; /* Kick      – Pink    */
  --c1:#fb923c; /* Snare     – Orange  */
  --c2:#facc15; /* Hi-Hat    – Gelb    */
  --c3:#4ade80; /* Bass      – Grün    */
  --c4:#60a5fa; /* Glocke    – Blau    */
  --c5:#c084fc; /* Melodie   – Lila    */
}
*{ box-sizing:border-box; }
body{ margin:0; font-family:system-ui,Arial; background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden; user-select:none; }
.app{ height:100vh; display:flex; flex-direction:column; padding:10px; gap:8px; }

/* Header */
.header{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.title{ flex:1; text-align:center; font-size:18px; font-weight:1000; color:#a78bfa; }

/* Tempo + Play-Leiste */
.controls{ display:flex; align-items:center; gap:10px; flex:0 0 auto;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px; }
.tempoLabel{ font-size:13px; font-weight:900; color:var(--muted); }
.tempoVal{ font-size:16px; font-weight:1000; color:#facc15; min-width:60px; }
.btn{
  min-height:60px; border-radius:12px; border:2px solid var(--border);
  background:var(--panel2); color:var(--text); font-size:15px; font-weight:900;
  cursor:pointer; padding:8px 16px; position:relative; transition:none;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn:not(:disabled).dwell-active, .btn:not(:disabled):hover{
  outline:3px solid #a78bfa; background:rgba(167,139,250,.20); transform:scale(1.04);
}
.btn.play-btn{ min-width:110px; background:rgba(74,222,128,.15); border-color:rgba(74,222,128,.50); color:#4ade80; }
.btn.play-btn.active{ background:rgba(251,146,60,.15); border-color:rgba(251,146,60,.50); color:#fb923c; }
.btn.clear-btn{ background:rgba(248,113,113,.10); border-color:rgba(248,113,113,.35); color:#fca5a5; }
.btn.tempo-btn{ min-width:56px; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }

/* Grid */
.gridWrap{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.row{ display:flex; align-items:center; gap:6px; flex:1 1 auto; }
.rowLabel{
  flex:0 0 80px; font-size:13px; font-weight:900; color:var(--muted);
  text-align:right; padding-right:8px; white-space:nowrap;
}
.cells{ flex:1; display:grid; grid-template-columns:repeat(16,1fr); gap:5px; height:100%; }
.cell{
  border-radius:8px; border:2px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05); cursor:pointer;
  position:relative; transition:none; min-height:32px;
}
.cell.on{ background:var(--row-color); border-color:var(--row-color);
  box-shadow:0 0 10px var(--row-color); }
.cell.current{ outline:3px solid rgba(255,255,255,.70) !important; }
.cell.dwell-active{ outline:3px solid rgba(255,255,255,.90) !important;
  background:rgba(255,255,255,.15) !important; transform:scale(1.08); }
.cell.on.dwell-active{ background:var(--row-color) !important; filter:brightness(1.4); }

/* Takt-Trennlinie alle 4 Schritte */
.cell:nth-child(4n+1){ margin-left:3px; }

/* Botton-Bar */
.bottomBar{ display:flex; gap:8px; flex:0 0 auto; }
.bottomBar .btn{ flex:1; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="btn" id="btnBack" style="min-width:80px;">← Start</button>
    <div class="title">🥁 Loop-Baukasten</div>
    <div style="min-width:80px;"></div>
  </div>

  <div class="controls">
    <span class="tempoLabel">Tempo:</span>
    <span class="tempoVal" id="tempoVal">90 BPM</span>
    <button class="btn tempo-btn" id="btnTempoDown">−</button>
    <button class="btn tempo-btn" id="btnTempoUp">＋</button>
    <div style="flex:1;"></div>
    <button class="btn play-btn" id="btnPlay">▶ Start</button>
    <button class="btn clear-btn" id="btnClear">✕ Alles löschen</button>
  </div>

  <div class="gridWrap" id="gridWrap"></div>

  <div class="bottomBar">
    <button class="btn" id="btnPreset1">🎵 Beat 1</button>
    <button class="btn" id="btnPreset2">🎵 Beat 2</button>
    <button class="btn" id="btnPreset3">🎵 Beat 3</button>
    <button class="btn" id="btnPresetClear">⬜ Leer</button>
  </div>

</div>

<script src="./loop_baukasten_mod.js"></script>
<script src="../../core/error_handler.js"></script>
</body>
</html>
