<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Musik machen</title>
<style>
:root{
  --bg:#0d0f1a; --panel:#1a1d2e; --panel2:#22263a;
  --border:rgba(255,255,255,.10); --shadow:0 10px 30px rgba(0,0,0,.4);
  --text:#f0f4ff; --muted:rgba(240,244,255,.55);
  --akzent:#a78bfa; --akzent-bg:rgba(167,139,250,.10); --radius:18px;
}
*{ box-sizing:border-box; }
body{ margin:0; font-family:system-ui,Arial; background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.app{ width:min(900px,96vw); display:flex; flex-direction:column; gap:16px; padding:16px; }
.greeting{ background:var(--panel); border:2px solid var(--akzent);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 26px; text-align:center; }
.greeting-emoji{ font-size:52px; margin-bottom:6px; }
.greeting-title{ font-size:clamp(26px,4vw,38px); font-weight:1000; margin:0 0 4px; color:var(--akzent); }
.greeting-sub{ font-size:clamp(14px,2.5vw,18px); font-weight:800; color:var(--muted); margin:0; }
.moduleGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
a.modBtn{ display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; min-height:130px; padding:18px 14px;
  background:var(--panel); border:2px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); text-decoration:none; color:var(--text); font-weight:1000;
  user-select:none; cursor:pointer; position:relative; transition:none; }
a.modBtn:hover, a.modBtn:focus{ transform:scale(1.05); outline:4px solid var(--akzent); background:var(--akzent-bg); }
a.modBtn.is-disabled{ pointer-events:none; opacity:0.35; }
.mod-emoji{ font-size:42px; }
.mod-label{ font-size:16px; font-weight:1000; text-align:center; }
.mod-desc{ font-size:12px; font-weight:800; color:var(--muted); text-align:center; line-height:1.3; }
.mod-badge{ position:absolute; top:10px; right:10px; padding:5px 9px; border-radius:999px;
  font-size:11px; font-weight:1000; border:1px solid var(--border); }
.mod-badge.ok  { background:rgba(29,185,84,.18); border-color:rgba(29,185,84,.40); color:#86efac; }
.mod-badge.bald{ background:rgba(167,139,250,.12); border-color:rgba(167,139,250,.35); color:#c4b5fd; }
.statusbar{ background:var(--panel); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:8px 14px;
  display:flex; align-items:center; justify-content:flex-start; }
.dwell-active{ transform:scale(1.07) !important; outline:4px solid var(--akzent) !important;
  transition:none !important; }
.zurueckBtn, a.zurueckBtn{ display:flex; align-items:center; justify-content:center;
  min-height:72px; font-size:17px; font-weight:1000; border-radius:14px;
  border:2px solid #8b5cf6; background:rgba(139,92,246,.15); color:#c4b5fd;
  text-decoration:none; cursor:pointer; user-select:none; transition:none; width:100%; }
.zurueckBtn:hover, a.zurueckBtn:hover{ background:rgba(139,92,246,.30); outline:4px solid #8b5cf6; }
</style>
</head>
<body>
<div class="app">
  <div class="greeting">
    <div class="greeting-emoji">🎵</div>
    <div class="greeting-title">Musik machen</div>
    <div class="greeting-sub">Töne, Rhythmen und Melodien erschaffen</div>
  </div>

  <div class="moduleGrid">

    <a class="modBtn" href="./loop_baukasten.html">
      <div class="mod-emoji">🥁</div>
      <div class="mod-label">Loop-Baukasten</div>
      <div class="mod-desc">Rhythmen bauen die in Schleife laufen</div>
      <div class="mod-badge ok">bereit</div>
    </a>

    <a class="modBtn" href="./xylophon.html">
      <div class="mod-emoji">🎹</div>
      <div class="mod-label">Xylophon</div>
      <div class="mod-desc">Töne durch Anschauen spielen</div>
      <div class="mod-badge ok">bereit</div>
    </a>

    <a class="modBtn" href="./melodie_maler.html">
      <div class="mod-emoji">🎨</div>
      <div class="mod-label">Melodie-Maler</div>
      <div class="mod-desc">Mit dem Blick Melodien zeichnen</div>
      <div class="mod-badge ok">bereit</div>
    </a>

    <a class="modBtn is-disabled" href="#">
      <div class="mod-emoji">🎸</div>
      <div class="mod-label">Ensemble</div>
      <div class="mod-desc">Instrumente spielen und aufnehmen</div>
      <div class="mod-badge bald">bald</div>
    </a>

  </div>

  <div class="statusbar">
    <a class="zurueckBtn" href="#" id="btnZurueck">← Zurück</a>
  </div>
</div>

<script>
try{
  var _retAbs = new URL("./musik_machen.html", window.location.href).href;
  localStorage.setItem("laetitia_return_url_v1", _retAbs);
}catch(e){}
var returnUrl = localStorage.getItem("laetitia_return_url_kreativitaet") ||
  new URL("../../kreativitaet.html", window.location.href).href;
document.getElementById("btnZurueck").href = returnUrl;

// Speichere Rückpfad für Untermodule
try{
  localStorage.setItem("laetitia_return_url_musik", new URL("./musik_machen.html", window.location.href).href);
}catch(e){}

var dwellMs = parseInt(localStorage.getItem("laetitia_dwell_ms")) || 900;
document.querySelectorAll("a.modBtn:not(.is-disabled), #btnZurueck").forEach(function(el){
  var timer = null;
  function start(){ if(timer) return; el.classList.add("dwell-active"); timer = setTimeout(function(){ timer=null; try{ el.click(); }catch(e){} }, dwellMs); }
  function stop(){ if(timer){ clearTimeout(timer); timer=null; } el.classList.remove("dwell-active"); }
  el.addEventListener("pointerenter", start);
  el.addEventListener("pointerleave", stop);
  el.addEventListener("click", stop);
  el.addEventListener("mouseenter", start);
  el.addEventListener("mouseleave", stop);
});
</script>
<script src="../../core/error_handler.js"></script>
</body>
</html>
