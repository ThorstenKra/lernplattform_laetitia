<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Lesehilfe</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --border:rgba(15,23,42,.14);
    --shadow:0 10px 26px rgba(15,23,42,.08); --text:#0f172a;
    --muted:rgba(15,23,42,.65); --green:#1db954; --green2:#18a84c;
    --orange:#ffb15a; --orange2:#ffa042; --radius:18px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }

  .viewport{ height:100vh; display:flex; align-items:center;
    justify-content:center; padding:12px; }
  .app{ width:min(1000px,96vw); height:calc(100vh - 24px);
    display:flex; flex-direction:column; gap:10px; min-height:0; }

  /* ── Kopfzeile ── */
  .header{ background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:12px 16px; display:flex; align-items:center;
    gap:12px; flex:0 0 auto; }
  .header-emoji{ font-size:32px; }
  .header-title{ font-size:22px; font-weight:1000; flex:1; }
  .header-sub{ font-size:13px; font-weight:900; color:var(--muted); }

  /* ── Hauptbereich ── */
  .main{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:10px; }

  /* ── Textvorschau (klein, gelb) ── */
  .textPreview{ background:#fff7c2; border:2px solid rgba(245,215,110,.90);
    border-radius:14px; padding:12px 14px; font-size:clamp(14px,1.6vw,18px);
    font-weight:900; line-height:1.4; color:#0b2e18;
    max-height:120px; overflow-y:auto; flex:0 0 auto; }

  /* ── Screen: Wortauswahl ── */
  #screenWahl{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:10px; }
  .wahl-label{ font-size:18px; font-weight:1000; color:var(--text); }
  .wahl-sub{ font-size:14px; font-weight:800; color:var(--muted); margin-top:-4px; }
  .wortGrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    flex:1 1 auto; align-content:start; }
  .wortBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:70px; padding:14px 16px;
    background:var(--panel); border:2px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);
    font-size:clamp(18px,2.2vw,26px); font-weight:1000;
    color:var(--text); text-decoration:none; cursor:pointer;
    position:relative; user-select:none;
  }
  .wortBtn:hover, .wortBtn:focus, .wortBtn.dwell-active{
    border-color:var(--orange); background:rgba(255,177,90,.12);
    outline:4px solid var(--orange); transform:scale(1.04); transition:none; z-index:2;
  }

  /* ── Screen: Erklärung ── */
  #screenErklaerung{ flex:1 1 auto; min-height:0; display:flex;
    flex-direction:column; gap:10px; }
  #screenErklaerung.hidden{ display:none; }
  #screenWahl.hidden{ display:none; }

  .erkl-wort{ font-size:clamp(28px,4vw,48px); font-weight:1000;
    color:var(--text); text-align:center; }
  .erkl-box{ background:#fff7c2; border:2px solid rgba(245,215,110,.90);
    border-radius:var(--radius); padding:18px 20px;
    font-size:clamp(18px,2.2vw,26px); font-weight:900;
    line-height:1.5; color:#0b2e18; flex:1; overflow-y:auto; }
  .erkl-beispiel{ margin-top:12px; font-size:clamp(15px,1.8vw,20px);
    font-weight:800; color:rgba(11,46,24,.70);
    border-top:1px solid rgba(245,215,110,.80); padding-top:10px; }

  /* ── Buttons allgemein ── */
  a.btn, button.btn{
    display:flex; align-items:center; justify-content:center;
    min-height:56px; padding:10px 16px; border-radius:16px;
    border:1px solid rgba(0,0,0,0.10); font-weight:1000;
    font-size:16px; text-decoration:none; cursor:pointer;
    position:relative; user-select:none; flex:1;
  }
  .btn-green{ background:var(--green); color:#0b1b10; }
  .btn-green:hover, .btn-green:focus, .btn-green.dwell-active{
    background:var(--green2); outline:3px solid rgba(29,185,84,.50); transition:none; }
  .btn-orange{ background:var(--orange); color:#3b1f00; }
  .btn-orange:hover, .btn-orange:focus, .btn-orange.dwell-active{
    background:var(--orange2); outline:3px solid rgba(255,177,90,.60); transition:none; }
  .btn-grey{ background:rgba(15,23,42,.07); color:var(--text);
    border-color:var(--border); }
  .btn-grey:hover, .btn-grey:focus, .btn-grey.dwell-active{
    background:rgba(15,23,42,.14); outline:3px solid rgba(15,23,42,.25); transition:none; }

  .footerRow{ display:flex; gap:10px; flex:0 0 auto; }

  /* ── Dwell-Ring ── */
  @keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
  .dwell-ring-svg{ position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); pointer-events:none; z-index:10;
    width:64px; height:64px; }
  .dwell-ring-svg circle{ fill:none; stroke:var(--orange); stroke-width:5;
    stroke-dasharray:220; stroke-dashoffset:220;
    transform:rotate(-90deg); transform-origin:32px 32px; }
  .dwell-ring-svg circle.animating{
    animation:dwellRing var(--dwell-duration,.8s) linear forwards; }
  .dwell-active{ outline:4px solid var(--orange) !important;
    transform:scale(1.05); transition:none; z-index:3; }
</style>
</head>
<body>

<div class="viewport">
  <div class="app">

    <div class="header">
      <div class="header-emoji">💡</div>
      <div>
        <div class="header-title">Lesehilfe</div>
        <div class="header-sub">Welches Wort möchtest du verstehen?</div>
      </div>
    </div>

    <!-- Textvorschau -->
    <div class="textPreview" id="textPreview">–</div>

    <div class="main">

      <!-- Screen 1: Wortauswahl -->
      <div id="screenWahl">
        <div class="wahl-label">Wähle ein Wort:</div>
        <div class="wahl-sub">Dwell auf ein Wort → du bekommst eine Erklärung</div>
        <div class="wortGrid" id="wortGrid"></div>
      </div>

      <!-- Screen 2: Erklärung -->
      <div id="screenErklaerung" class="hidden">
        <div class="erkl-wort" id="erklWort">–</div>
        <div class="erkl-box">
          <div id="erklText">–</div>
          <div class="erkl-beispiel" id="erklBeispiel"></div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footerRow" id="footerWahl">
      <a class="btn btn-orange" href="#" id="btnSprechenWahl">🔊 Vorlesen</a>
      <a class="btn btn-grey"   href="#" id="btnZurueckLesen">← Zurück zum Lesen</a>
    </div>
    <div class="footerRow hidden" id="footerErkl">
      <a class="btn btn-orange" href="#" id="btnSprechenErkl">🔊 Nochmal hören</a>
      <a class="btn btn-green"  href="#" id="btnZurueckWahl">← Andere Wörter</a>
      <a class="btn btn-grey"   href="#" id="btnZurueckLesen2">✓ Fertig</a>
    </div>

  </div>
</div>

<script src="./lesen_hilfe_mod.js"></script>
</body>
</html>
