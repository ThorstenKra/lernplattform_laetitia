<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Puzzle ausmalen</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); }
.topTitel{ font-size:18px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:6px 14px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; white-space:nowrap; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.pink{ background:var(--pink); color:#fff; border-color:transparent; }
a.topBtn.pink:hover{ background:var(--pink2); }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }

.main{ flex:1; display:grid; grid-template-columns:110px 1fr 130px; gap:0; min-height:0; overflow:hidden; }

/* Linke Spalte: Vorlagen */
.linksPanel{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:6px; gap:3px; overflow:hidden; }
.panelLabel{ font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; text-align:center; flex:0 0 auto; margin-bottom:2px; }
a.vorlagenBtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1; border-radius:10px; border:2px solid var(--border); background:rgba(15,23,42,.04); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; font-size:10px; font-weight:900; padding:3px; text-align:center; }
a.vorlagenBtn:hover, a.vorlagenBtn:focus{ background:rgba(236,72,153,0.10); outline:3px solid var(--pink); transition:none; }
a.vorlagenBtn.aktiv{ background:rgba(236,72,153,0.18); border-color:var(--pink); color:var(--pink); }
.vorlagenEmoji{ font-size:22px; }

/* Mitte: SVG Puzzle */
.leinwandWrap{ display:flex; align-items:center; justify-content:center; background:#f8fafc; overflow:hidden; }
#puzzleSvg{ filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15)); }
.puzzleTeil{ cursor:pointer; stroke:#fff; stroke-width:2.5; stroke-linejoin:round; transition:none; }
.puzzleTeil:hover{ stroke:#ec4899; stroke-width:3.5; filter:brightness(0.88); }
@keyframes teilPop{ 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
.puzzleTeil.popping{ animation:teilPop 0.2s ease; transform-origin:center; }

/* Fortschritt */
.fortschrittBar{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.9); border-radius:999px; padding:4px 14px; font-size:12px; font-weight:900; color:var(--text); }

/* Rechte Spalte: Farben */
.rechtsPanel{ background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; padding:6px 4px; gap:4px; overflow:hidden; }
.farbGrid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:3px; align-content:start; overflow:hidden; }
a.farbBtn{ border-radius:10px; border:3px solid transparent; cursor:pointer; user-select:none; position:relative; transition:none; text-decoration:none; display:block; min-height:52px; }
a.farbBtn:hover, a.farbBtn:focus{ transform:scale(1.12); outline:3px solid var(--text); transition:none; z-index:2; }
a.farbBtn.gewaehlt{ border:3px solid var(--text); transform:scale(1.10); box-shadow:0 0 0 2px rgba(0,0,0,0.25); }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ stroke:var(--pink) !important; stroke-width:4 !important; filter:brightness(0.85) !important; }
.puzzleTeil.dwell-active{ stroke:#ec4899 !important; }
a.farbBtn.dwell-active{ transform:scale(1.18) !important; outline:3px solid var(--text) !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel" id="topTitelText">🧩 Puzzle ausmalen</div>
  <a class="topBtn" href="#" id="btnUndo">↩</a>
  <a class="topBtn" href="#" id="btnReset">🗑</a>
  <a class="topBtn pink" href="#" id="btnSpeichern">💾</a>
  
</div>
<div class="main">
  <div class="linksPanel">
    <div class="panelLabel">Vorlage</div>
    <a class="vorlagenBtn aktiv" href="#" data-vorlage="land"><span class="vorlagenEmoji">🗺️</span>Landschaft</a>
    <a class="vorlagenBtn" href="#" data-vorlage="tier"><span class="vorlagenEmoji">🦁</span>Tier</a>
    <a class="vorlagenBtn" href="#" data-vorlage="stadt"><span class="vorlagenEmoji">🏙️</span>Stadt</a>
    <a class="vorlagenBtn" href="#" data-vorlage="meer"><span class="vorlagenEmoji">🌊</span>Meer</a>
    <a class="vorlagenBtn" href="#" data-vorlage="all"><span class="vorlagenEmoji">🚀</span>Weltall</a>
  </div>
  <div class="leinwandWrap" id="leinwandWrap">
    <svg id="puzzleSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="fortschrittBar" id="fortschritt"></div>
  </div>
  <div class="rechtsPanel">
    <div class="panelLabel">🎨</div>
    <div class="farbGrid" id="farbGrid"></div>
  </div>
</div>
<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./puzzle_ausmalen_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
