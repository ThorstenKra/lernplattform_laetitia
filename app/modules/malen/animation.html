<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Animationen</title>
<style>
:root{
  --bg:#0f172a; --panel:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --text:#f8fafc; --muted:rgba(248,250,252,0.55);
  --pink:#ec4899; --pink2:#db2777;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:rgba(15,23,42,0.95); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:10px; }
.topTitel{ font-size:20px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:8px 16px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.08); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; white-space:nowrap; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(255,255,255,0.16); outline:3px solid var(--pink); transition:none; }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }

.main{ flex:1; display:grid; grid-template-columns:130px 1fr; gap:0; min-height:0; overflow:hidden; }

/* Linke Spalte: Animationen */
.linksPanel{ background:rgba(15,23,42,0.8); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:8px; gap:4px; overflow:hidden; }
.panelLabel{ font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; text-align:center; flex:0 0 auto; margin-bottom:4px; }
a.animBtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; flex:1; border-radius:12px; border:2px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; font-size:11px; font-weight:900; padding:4px; text-align:center; }
a.animBtn:hover, a.animBtn:focus{ background:rgba(236,72,153,0.20); outline:3px solid var(--pink); transform:scale(1.03); transition:none; }
a.animBtn.aktiv{ background:rgba(236,72,153,0.30); border-color:var(--pink); }
.animEmoji{ font-size:28px; }
.animLabel{ font-size:10px; color:var(--muted); }

/* Mitte: Animations-Bühne */
.buehne{ display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
#buehnenSvg{ border-radius:12px; }

/* Steuerung unten */
.steuerung{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; }
a.steuerBtn{ display:flex; align-items:center; justify-content:center; min-height:60px; min-width:60px; border-radius:14px; border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.10); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; font-size:22px; transition:none; }
a.steuerBtn:hover, a.steuerBtn:focus{ background:rgba(236,72,153,0.35); outline:3px solid var(--pink); transition:none; }
a.steuerBtn.play{ background:var(--pink); border-color:transparent; min-width:90px; }
a.steuerBtn.play:hover{ background:var(--pink2); }

/* Audio-Status */
.audioStatus{ position:absolute; top:14px; right:14px; background:rgba(15,23,42,0.8); border:1px solid var(--border); border-radius:10px; padding:6px 12px; font-size:12px; font-weight:900; color:var(--muted); }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:70px; height:70px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:35px 35px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ background:rgba(236,72,153,0.25) !important; outline:3px solid var(--pink) !important; transition:none !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel">🎥 Animationen</div>
  
</div>
<div class="main">
  <div class="linksPanel">
    <div class="panelLabel">Szene</div>
    <a class="animBtn aktiv" href="#" data-anim="sterne"><span class="animEmoji">⭐</span><span class="animLabel">Sternenhimmel</span></a>
    <a class="animBtn" href="#" data-anim="regen"><span class="animEmoji">🌧️</span><span class="animLabel">Regen</span></a>
    <a class="animBtn" href="#" data-anim="feuer"><span class="animEmoji">🔥</span><span class="animLabel">Feuer</span></a>
    <a class="animBtn" href="#" data-anim="ozean"><span class="animEmoji">🌊</span><span class="animLabel">Ozean</span></a>
    <a class="animBtn" href="#" data-anim="schmett"><span class="animEmoji">🦋</span><span class="animLabel">Schmetterlinge</span></a>
    <a class="animBtn" href="#" data-anim="schnee"><span class="animEmoji">❄️</span><span class="animLabel">Schneefall</span></a>
    <!-- Audio-Dateien: Je Szene eine Datei in ./audio/ ablegen, z.B. sterne.mp3 -->
  </div>
  <div class="buehne" id="buehne">
    <svg id="buehnenSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="audioStatus" id="audioStatus">🔇 Kein Audio</div>
    <div class="steuerung">
      <a class="steuerBtn" href="#" id="btnVorig" title="Vorherige">◀</a>
      <a class="steuerBtn play" href="#" id="btnPlay">▶</a>
      <a class="steuerBtn" href="#" id="btnWeiter" title="Nächste">▶</a>
    </div>
  </div>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./animation_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
