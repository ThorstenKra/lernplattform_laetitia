<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Galerie</title>
<style>
:root{
  --bg:#0f172a; --panel:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --text:#f8fafc; --muted:rgba(248,250,252,0.60);
  --pink:#ec4899; --pink2:#db2777;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:rgba(15,23,42,0.95); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:10px; }
.topTitel{ font-size:20px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:8px 16px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.08); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; white-space:nowrap; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(255,255,255,0.16); outline:3px solid var(--pink); transition:none; }
a.topBtn.pink{ background:var(--pink); color:#fff; border-color:transparent; }
a.topBtn.pink:hover{ background:var(--pink2); }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }
a.topBtn.aktiv{ background:var(--pink); color:#fff; border-color:transparent; }

/* Haupt-Anzeige */
.showBereich{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }

/* Einzelnes Werk anzeigen */
.werkAnzeige{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.werkTitel{ font-size:18px; font-weight:1000; color:var(--muted); }
.werkCanvas{ border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.werkCanvas svg{ display:block; }

/* Leer-Zustand */
.leerZustand{ text-align:center; padding:40px; }
.leerEmoji{ font-size:72px; margin-bottom:16px; }
.leerText{ font-size:20px; font-weight:1000; color:var(--muted); margin-bottom:8px; }
.leerSub{ font-size:15px; font-weight:800; color:rgba(248,250,252,0.40); }

/* Navigation */
.navBereich{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:12px; padding:10px 16px; background:rgba(15,23,42,0.95); border-top:1px solid var(--border); }
a.navBtn{ display:flex; align-items:center; justify-content:center; min-height:64px; padding:10px 20px; font-size:16px; font-weight:1000; border-radius:14px; border:1px solid var(--border); background:rgba(255,255,255,0.08); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; }
a.navBtn:hover, a.navBtn:focus{ background:rgba(255,255,255,0.18); outline:3px solid var(--pink); transition:none; }
a.navBtn[aria-disabled="true"]{ opacity:0.3; pointer-events:none; }
a.navBtn.play{ background:var(--pink); color:#fff; border-color:transparent; min-width:100px; }
a.navBtn.play:hover{ background:var(--pink2); }
.navInfo{ font-size:14px; font-weight:900; color:var(--muted); min-width:80px; text-align:center; }

/* Diashow-Fortschritt */
.diashowBalken{ position:absolute; bottom:0; left:0; height:3px; background:var(--pink); transition:width 0.1s linear; }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:70px; height:70px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:35px 35px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ background:rgba(236,72,153,0.25) !important; outline:3px solid var(--pink) !important; transition:none !important; }

@keyframes einblenden{ from{opacity:0;transform:scale(0.94)} to{opacity:1;transform:scale(1)} }
.werkCanvas.einblenden{ animation:einblenden 0.5s ease; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel">🖼️ Meine Galerie</div>
  <a class="topBtn pink" href="#" id="btnDiashow">▶ Diashow</a>
  
</div>

<div class="showBereich" id="showBereich">
  <div class="diashowBalken" id="diashowBalken" style="width:0%"></div>
</div>

<div class="navBereich">
  <a class="navBtn" href="#" id="btnVorig">◀ Zurück</a>
  <div class="navInfo" id="navInfo">– / –</div>
  <a class="navBtn" href="#" id="btnWeiter">Weiter ▶</a>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./galerie_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
