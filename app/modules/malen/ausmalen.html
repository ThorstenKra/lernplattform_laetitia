<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Ausmalen</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777;
  --radius:16px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
}

/* ── Top-Bar ── */
.topBar{
  flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border);
  padding:8px 12px; display:flex; align-items:center; gap:10px;
  box-shadow:var(--shadow);
}
.topTitel{ font-size:18px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  min-height:52px; padding:8px 14px; font-size:14px; font-weight:1000;
  border-radius:12px; border:1px solid var(--border);
  background:rgba(15,23,42,.06); color:var(--text);
  text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none;
  white-space:nowrap;
}
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.pink{ background:var(--pink); color:#fff; border-color:transparent; }
a.topBtn.pink:hover, a.topBtn.pink:focus{ background:var(--pink2); }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover, a.topBtn.lila:focus{ background:#ddd6fe; outline:3px solid #8b5cf6; }

/* ── Haupt-Layout ── */
.main{
  flex:1; display:grid;
  grid-template-columns:200px 1fr 130px;
  gap:0; min-height:0; overflow:hidden;
}

/* ── Linke Spalte: Vorlagen ── */
.vorlagenPanel{
  background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:0; overflow:hidden;
}
.panelLabel{
  font-size:11px; font-weight:900; color:var(--muted); padding:8px 10px 4px;
  text-transform:uppercase; letter-spacing:0.05em; flex:0 0 auto;
}
.vorlagenListe{
  flex:1; overflow:hidden; display:flex; flex-direction:column; gap:3px; padding:4px 8px 8px;
}
a.vorlagenBtn{
  display:flex; align-items:center; gap:8px;
  min-height:44px; padding:5px 8px; font-size:12px; font-weight:900;
  border-radius:10px; border:1px solid var(--border);
  background:rgba(15,23,42,.04); color:var(--text);
  text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none;
  flex-shrink:0;
}
a.vorlagenBtn:hover, a.vorlagenBtn:focus{
  background:rgba(236,72,153,0.10); outline:3px solid var(--pink); transition:none;
}
a.vorlagenBtn.aktiv{
  background:rgba(236,72,153,0.15); border-color:var(--pink); color:var(--pink);
}
.vorlagenEmoji{ font-size:20px; }
.themenTrennlinie{
  font-size:10px; font-weight:900; color:var(--muted); padding:8px 10px 2px;
  text-transform:uppercase; letter-spacing:0.06em; flex-shrink:0;
}

/* ── Mitte: Zeichenfläche ── */
.leinwandWrap{
  display:flex; align-items:center; justify-content:center;
  background:#fff; overflow:hidden; position:relative;
}
#leinwand{
  max-width:100%; max-height:100%;
  /* Auswahl-Cursor verhindern */
  user-select:none;
}
/* SVG-Flächen: klickbar, Hover-Effekt */
#leinwand .malFlaeche{
  cursor:pointer;
  stroke:#1a1a2e; stroke-width:2;
  transition:filter 0.1s;
}
#leinwand .malFlaeche:hover{
  filter:brightness(0.88);
}
/* Aktiv-Fläche blinkt kurz */
@keyframes flaechePop{ 0%{filter:brightness(1)} 50%{filter:brightness(1.3)} 100%{filter:brightness(1)} }
.malFlaeche.popping{ animation:flaechePop 0.25s ease; }

/* ── Rechte Spalte: Farbpalette ── */
.farbPanel{
  background:var(--panel); border-left:1px solid var(--border);
  display:flex; flex-direction:column; gap:0; overflow:hidden;
}
.farbListe{
  flex:1; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:6px 4px;
  align-content:start;
}
a.farbBtn{
  width:100%; height:44px; border-radius:10px;
  border:3px solid transparent;
  cursor:pointer; user-select:none; position:relative; transition:none;
  flex-shrink:0; text-decoration:none; display:block;
}
a.farbBtn:hover, a.farbBtn:focus{
  transform:scale(1.15); outline:3px solid var(--text); transition:none; z-index:2;
}
a.farbBtn.gewaehlt{
  border:4px solid var(--text); transform:scale(1.12);
  box-shadow:0 0 0 3px rgba(0,0,0,0.25);
}

/* ── Dwell-Ring ── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:70px; height:70px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:35px 35px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.4s) linear forwards; }
.dwell-active{ transform:scale(1.08) !important; outline:4px solid var(--pink) !important; box-shadow:0 0 0 4px rgba(236,72,153,0.35) !important; transition:none !important; }
a.farbBtn.dwell-active{ transform:scale(1.20) !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>

<!-- Top-Bar -->
<div class="topBar">
  <div class="topTitel">🖌️ Ausmalen</div>
  <a class="topBtn" href="#" id="btnUndo" title="Rückgängig">↩ Rückgängig</a>
  <a class="topBtn" href="#" id="btnReset" title="Alles löschen">🗑 Neu</a>
  <a class="topBtn pink" href="#" id="btnSpeichern">💾 Speichern</a>
  
</div>

<!-- Haupt-Layout -->
<div class="main">

  <!-- Linke Spalte: Vorlagen -->
  <div class="vorlagenPanel">
    <div class="panelLabel">Vorlagen</div>
    <div class="vorlagenListe" id="vorlagenListe"></div>
  </div>

  <!-- Mitte: Zeichenfläche -->
  <div class="leinwandWrap">
    <svg id="leinwand" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- Rechte Spalte: Farbpalette -->
  <div class="farbPanel">
    <div class="panelLabel" style="text-align:center;">🎨</div>
    <div class="farbListe" id="farbListe"></div>
  </div>

</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./ausmalen_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
