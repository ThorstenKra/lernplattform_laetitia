<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Pixel-Art</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777; --radius:16px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); }
.topTitel{ font-size:18px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:6px 12px; font-size:13px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; white-space:nowrap; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.pink{ background:var(--pink); color:#fff; border-color:transparent; }
a.topBtn.pink:hover, a.topBtn.pink:focus{ background:var(--pink2); }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover, a.topBtn.lila:focus{ background:#ddd6fe; outline:3px solid #8b5cf6; }
a.topBtn.aktiv{ background:var(--pink); color:#fff; border-color:transparent; }

.main{ flex:1; display:grid; grid-template-columns:90px 1fr 130px; gap:0; min-height:0; overflow:hidden; }

.linksPanel{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; gap:3px; padding:6px; overflow:hidden; }
.panelLabel{ font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:2px; flex:0 0 auto; text-align:center; }
a.vorlagenBtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1; border-radius:10px; border:1px solid var(--border); background:rgba(15,23,42,.04); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; font-size:10px; font-weight:900; text-align:center; padding:3px; }
a.vorlagenBtn:hover, a.vorlagenBtn:focus{ background:rgba(236,72,153,0.10); outline:3px solid var(--pink); transition:none; }
a.vorlagenBtn.aktiv{ background:rgba(236,72,153,0.18); border-color:var(--pink); color:var(--pink); }
.vorlagenEmoji{ font-size:20px; }

.rasterWrap{ display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; padding:8px; }
#pixelRaster{ display:grid; gap:1px; background:#ccc; border:2px solid #ccc; border-radius:4px; }
a.pixel{ background:#ffffff; cursor:pointer; user-select:none; position:relative; transition:none; display:block; }
a.pixel:hover, a.pixel:focus{ filter:brightness(0.78); z-index:2; }
@keyframes pixelPop{ 0%{transform:scale(1)} 50%{transform:scale(1.35)} 100%{transform:scale(1)} }
a.pixel.popping{ animation:pixelPop 0.15s ease; z-index:3; }

.rechtsPanel{ background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; padding:6px 4px; gap:4px; }
.farbGrid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:3px; align-content:start; overflow:hidden; }
a.farbBtn{ border-radius:10px; border:3px solid transparent; cursor:pointer; user-select:none; position:relative; transition:none; text-decoration:none; display:block; min-height:52px; }
a.farbBtn:hover, a.farbBtn:focus{ transform:scale(1.12); outline:3px solid var(--text); transition:none; z-index:2; }
a.farbBtn.gewaehlt{ border:3px solid var(--text); transform:scale(1.10); box-shadow:0 0 0 2px rgba(0,0,0,0.25); }
a.radierer{ display:flex; align-items:center; justify-content:center; min-height:40px; border-radius:8px; border:2px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; font-size:16px; flex:0 0 auto; transition:none; }
a.radierer:hover, a.radierer:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.radierer.aktiv{ background:#fca5a5; border-color:#ef4444; }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ outline:3px solid var(--pink) !important; filter:brightness(0.80) !important; transition:none !important; }
a.farbBtn.dwell-active{ transform:scale(1.18) !important; filter:none !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel" id="topTitelText">🟦 Pixel-Art</div>
  <a class="topBtn" href="#" id="btnG8">8×8</a>
  <a class="topBtn aktiv" href="#" id="btnG12">12×12</a>
  <a class="topBtn" href="#" id="btnG16">16×16</a>
  <a class="topBtn" href="#" id="btnUndo">↩</a>
  <a class="topBtn" href="#" id="btnReset">🗑</a>
  <a class="topBtn pink" href="#" id="btnSpeichern">💾</a>
  
</div>
<div class="main">
  <div class="linksPanel">
    <div class="panelLabel">Vorlage</div>
    <a class="vorlagenBtn aktiv" href="#" id="vFrei"><span class="vorlagenEmoji">✨</span>Frei</a>
    <a class="vorlagenBtn" href="#" id="vHerz"><span class="vorlagenEmoji">❤️</span>Herz</a>
    <a class="vorlagenBtn" href="#" id="vStern"><span class="vorlagenEmoji">⭐</span>Stern</a>
    <a class="vorlagenBtn" href="#" id="vHaus"><span class="vorlagenEmoji">🏠</span>Haus</a>
    <a class="vorlagenBtn" href="#" id="vBlume"><span class="vorlagenEmoji">🌸</span>Blume</a>
    <a class="vorlagenBtn" href="#" id="vSmiley"><span class="vorlagenEmoji">😊</span>Smiley</a>
  </div>
  <div class="rasterWrap" id="rasterWrap">
    <div id="pixelRaster"></div>
  </div>
  <div class="rechtsPanel">
    <div class="panelLabel">🎨</div>
    <a class="radierer" href="#" id="btnRadierer" title="Radierer">⬜</a>
    <div class="farbGrid" id="farbGrid"></div>
  </div>
</div>
<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./pixelart_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
