<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Farbmischer</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); }
.topTitel{ font-size:20px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:8px 16px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }

.main{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:0; overflow:hidden; }

/* Linke Hälfte: Farbkreis */
.farbkreisSeite{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; border-right:1px solid var(--border); }
.farbkreisTitel{ font-size:16px; font-weight:1000; color:var(--muted); }
#farbkreisSvg{ filter:drop-shadow(0 4px 16px rgba(0,0,0,0.15)); }
.farbkreisSektor{ cursor:pointer; transition:none; }
.farbkreisSektor:hover, .farbkreisSektor:focus{ filter:brightness(1.15); outline:none; }
.farbkreisSektor.gewaehlt{ filter:brightness(1.25) drop-shadow(0 0 8px rgba(0,0,0,0.4)); }
.gewaehltInfo{ display:flex; gap:10px; align-items:center; }
.gewaehltBox{ width:52px; height:52px; border-radius:12px; border:2px solid var(--border); }
.gewaehltName{ font-size:16px; font-weight:1000; }

/* Rechte Hälfte: Mischen */
.mischSeite{ display:flex; flex-direction:column; gap:12px; padding:16px; overflow:hidden; }
.mischTitel{ font-size:16px; font-weight:1000; color:var(--muted); flex:0 0 auto; }
.mischReihe{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.mischLabel{ font-size:13px; font-weight:900; color:var(--muted); width:60px; }
.farbAuswahl{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; flex:1; }
a.mischFarbBtn{ border-radius:8px; border:3px solid transparent; cursor:pointer; user-select:none; position:relative; transition:none; text-decoration:none; display:block; min-height:52px; }
a.mischFarbBtn:hover, a.mischFarbBtn:focus{ transform:scale(1.12); outline:3px solid var(--text); transition:none; z-index:2; }
a.mischFarbBtn.gewaehlt{ border:3px solid var(--text); transform:scale(1.10); box-shadow:0 0 0 2px rgba(0,0,0,0.25); }
.mischPfeil{ font-size:28px; text-align:center; flex:0 0 auto; }
.ergebnisBox{ flex:0 0 auto; }
.ergebnisAnzeige{ width:100%; height:100px; border-radius:18px; border:3px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:1000; color:rgba(0,0,0,0.5); }
.mischInfo{ font-size:14px; font-weight:900; color:var(--muted); text-align:center; }
.lernBox{ background:rgba(236,72,153,0.06); border:2px solid rgba(236,72,153,0.20); border-radius:14px; padding:12px 16px; flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.lernTitel{ font-size:14px; font-weight:1000; color:var(--pink); }
.lernEintrag{ font-size:13px; font-weight:900; color:var(--text); padding:4px 0; border-bottom:1px solid rgba(236,72,153,0.10); }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ filter:brightness(1.18) !important; outline:3px solid var(--pink) !important; transition:none !important; }
a.mischFarbBtn.dwell-active{ transform:scale(1.18) !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel">🌈 Farbmischer</div>
  
</div>
<div class="main">

  <!-- Links: Farbkreis -->
  <div class="farbkreisSeite">
    <div class="farbkreisTitel">🎨 Farbkreis — antippen zum Auswählen</div>
    <svg id="farbkreisSvg" width="280" height="280" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="gewaehltInfo">
      <div class="gewaehltBox" id="gewaehltBox" style="background:#ec4899;"></div>
      <div class="gewaehltName" id="gewaehltName">Pink</div>
    </div>
  </div>

  <!-- Rechts: Mischen -->
  <div class="mischSeite">
    <div class="mischTitel">🧪 Farben mischen</div>
    <div class="mischReihe">
      <div class="mischLabel">Farbe 1</div>
      <div class="farbAuswahl" id="farbAuswahl1"></div>
    </div>
    <div class="mischReihe">
      <div class="mischLabel">Farbe 2</div>
      <div class="farbAuswahl" id="farbAuswahl2"></div>
    </div>
    <div class="mischPfeil">⬇ Ergebnis</div>
    <div class="ergebnisBox">
      <div class="ergebnisAnzeige" id="ergebnisAnzeige" style="background:#f0abfc;">Mische!</div>
    </div>
    <div class="mischInfo" id="mischInfo"></div>
    <div class="lernBox">
      <div class="lernTitel">💡 Was entsteht?</div>
      <div id="lernListe"></div>
    </div>
  </div>

</div>
<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script>
(function(){
"use strict";

// Farbkreis-Segmente
var KREISFARBEN = [
  {name:"Rot",       hex:"#ef4444", h:0},
  {name:"Rot-Orange",hex:"#f97316", h:30},
  {name:"Orange",    hex:"#fb923c", h:45},
  {name:"Gelb-Orange",hex:"#fbbf24",h:60},
  {name:"Gelb",      hex:"#facc15", h:75},
  {name:"Gelb-Grün", hex:"#a3e635", h:90},
  {name:"Grün",      hex:"#22c55e", h:120},
  {name:"Blau-Grün", hex:"#10b981", h:150},
  {name:"Türkis",    hex:"#06b6d4", h:180},
  {name:"Blau",      hex:"#3b82f6", h:210},
  {name:"Blau-Violett",hex:"#6366f1",h:240},
  {name:"Violett",   hex:"#8b5cf6", h:270},
  {name:"Rot-Violett",hex:"#c026d3",h:300},
  {name:"Magenta",   hex:"#ec4899", h:330},
  {name:"Rosa",      hex:"#fb7185", h:345},
  {name:"Weiß",      hex:"#ffffff", h:-1},
  {name:"Schwarz",   hex:"#1a1a2e", h:-2}
];

var MISCHFARBEN = [
  "#ef4444","#f97316","#fbbf24","#22c55e","#3b82f6","#8b5cf6",
  "#ec4899","#06b6d4","#ffffff","#1a1a2e","#92400e","#fde68a"
];

// Bekannte Mischungen
var MISCHUNGEN = [
  {f1:"#ef4444",f2:"#fbbf24",ergebnis:"#f97316",name:"Orange"},
  {f1:"#fbbf24",f2:"#ef4444",ergebnis:"#f97316",name:"Orange"},
  {f1:"#ef4444",f2:"#3b82f6",ergebnis:"#8b5cf6",name:"Violett"},
  {f1:"#3b82f6",f2:"#ef4444",ergebnis:"#8b5cf6",name:"Violett"},
  {f1:"#fbbf24",f2:"#3b82f6",ergebnis:"#22c55e",name:"Grün"},
  {f1:"#3b82f6",f2:"#fbbf24",ergebnis:"#22c55e",name:"Grün"},
  {f1:"#ef4444",f2:"#ffffff",ergebnis:"#fca5a5",name:"Rosa"},
  {f1:"#ffffff",f2:"#ef4444",ergebnis:"#fca5a5",name:"Rosa"},
  {f1:"#3b82f6",f2:"#ffffff",ergebnis:"#bfdbfe",name:"Hellblau"},
  {f1:"#ffffff",f2:"#3b82f6",ergebnis:"#bfdbfe",name:"Hellblau"},
  {f1:"#fbbf24",f2:"#ffffff",ergebnis:"#fde68a",name:"Hellgelb"},
  {f1:"#1a1a2e",f2:"#ffffff",ergebnis:"#6b7280",name:"Grau"},
  {f1:"#ef4444",f2:"#1a1a2e",ergebnis:"#7f1d1d",name:"Dunkelrot"},
  {f1:"#ec4899",f2:"#8b5cf6",ergebnis:"#c026d3",name:"Magenta"},
  {f1:"#22c55e",f2:"#3b82f6",ergebnis:"#06b6d4",name:"Türkis"},
  {f1:"#3b82f6",f2:"#22c55e",ergebnis:"#06b6d4",name:"Türkis"},
  {f1:"#f97316",f2:"#fbbf24",ergebnis:"#fbbf24",name:"Goldgelb"},
  {f1:"#92400e",f2:"#ef4444",ergebnis:"#b45309",name:"Rostrot"}
];

var LERN = [
  "Rot + Gelb = Orange 🟠",
  "Rot + Blau = Violett 💜",
  "Gelb + Blau = Grün 💚",
  "Farbe + Weiß = heller ☀️",
  "Farbe + Schwarz = dunkler 🌙",
  "Rosa, Grün und Violett heißen Sekundärfarben",
  "Rot, Gelb und Blau heißen Primärfarben"
];

var state = { gewaehlt1: "#ef4444", gewaehlt2: "#3b82f6" };

// ── Farbkreis ─────────────────────────────────────────────────────────────────
function baueFarbkreis(){
  var svg = document.getElementById("farbkreisSvg");
  var cx = 140, cy = 140, r = 125, ri = 55;
  var n = 15; // äußere Segmente (ohne Weiß/Schwarz)
  svg.innerHTML = "";

  for(var i = 0; i < n; i++){
    var a1 = (2*Math.PI*i/n) - Math.PI/2;
    var a2 = (2*Math.PI*(i+1)/n) - Math.PI/2;
    var x1o = cx + r*Math.cos(a1), y1o = cy + r*Math.sin(a1);
    var x2o = cx + r*Math.cos(a2), y2o = cy + r*Math.sin(a2);
    var x1i = cx + ri*Math.cos(a1), y1i = cy + ri*Math.sin(a1);
    var x2i = cx + ri*Math.cos(a2), y2i = cy + ri*Math.sin(a2);
    var d = "M"+x1i.toFixed(1)+","+y1i.toFixed(1)+" L"+x1o.toFixed(1)+","+y1o.toFixed(1)+" A"+r+","+r+" 0 0,1 "+x2o.toFixed(1)+","+y2o.toFixed(1)+" L"+x2i.toFixed(1)+","+y2i.toFixed(1)+" A"+ri+","+ri+" 0 0,0 "+x1i.toFixed(1)+","+y1i.toFixed(1)+" Z";
    var farbe = KREISFARBEN[i];
    var path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",d); path.setAttribute("fill",farbe.hex);
    path.setAttribute("class","farbkreisSektor"); path.setAttribute("tabindex","0");
    path.setAttribute("data-hex",farbe.hex); path.setAttribute("data-name",farbe.name);
    path.addEventListener("click",function(){
      waehleFarbe(this.getAttribute("data-hex"), this.getAttribute("data-name"));
    });
    svg.appendChild(path);
  }
  // Weiß und Schwarz als kleine Kreise in der Mitte
  [{f:"#ffffff",n:"Weiß",cx:125,cy:140},{f:"#1a1a2e",n:"Schwarz",cx:155,cy:140}].forEach(function(s){
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",s.cx); c.setAttribute("cy",s.cy); c.setAttribute("r","22");
    c.setAttribute("fill",s.f); c.setAttribute("stroke","#e5e7eb"); c.setAttribute("stroke-width","2");
    c.setAttribute("class","farbkreisSektor"); c.setAttribute("tabindex","0");
    c.setAttribute("data-hex",s.f); c.setAttribute("data-name",s.n);
    c.addEventListener("click",function(){ waehleFarbe(s.f,s.n); });
    svg.appendChild(c);
  });
}

function waehleFarbe(hex, name){
  document.getElementById("gewaehltBox").style.background = hex;
  document.getElementById("gewaehltName").textContent = name;
}

// ── Misch-Palette ─────────────────────────────────────────────────────────────
function baueMischPalette(containerId, auswahl){
  var grid = document.getElementById(containerId);
  grid.innerHTML = "";
  MISCHFARBEN.forEach(function(farbe){
    var a = document.createElement("a");
    a.href = "#"; a.className = "mischFarbBtn" + (farbe === auswahl ? " gewaehlt" : "");
    a.style.background = farbe;
    if(farbe==="#ffffff") a.style.border="3px solid #ccc";
    a.setAttribute("data-farbe",farbe);
    a.addEventListener("click",function(ev){
      ev.preventDefault();
      if(containerId==="farbAuswahl1") state.gewaehlt1=farbe;
      else state.gewaehlt2=farbe;
      grid.querySelectorAll(".mischFarbBtn").forEach(function(b){b.classList.toggle("gewaehlt",b.getAttribute("data-farbe")===farbe);});
      mischen();
    });
    grid.appendChild(a);
  });
}

function mischen(){
  var f1=state.gewaehlt1, f2=state.gewaehlt2;
  var gefunden=null;
  MISCHUNGEN.forEach(function(m){ if(m.f1===f1&&m.f2===f2) gefunden=m; });

  var ergebnis, info;
  if(gefunden){
    ergebnis=gefunden.ergebnis;
    info="✨ Ergibt: "+gefunden.name;
  } else {
    // Farben numerisch mischen
    var r1=parseInt(f1.slice(1,3),16), g1=parseInt(f1.slice(3,5),16), b1=parseInt(f1.slice(5,7),16);
    var r2=parseInt(f2.slice(1,3),16), g2=parseInt(f2.slice(3,5),16), b2=parseInt(f2.slice(5,7),16);
    var rm=Math.round((r1+r2)/2), gm=Math.round((g1+g2)/2), bm=Math.round((b1+b2)/2);
    ergebnis="#"+rm.toString(16).padStart(2,"0")+gm.toString(16).padStart(2,"0")+bm.toString(16).padStart(2,"0");
    info="Gemischte Farbe";
  }
  document.getElementById("ergebnisAnzeige").style.background=ergebnis;
  document.getElementById("ergebnisAnzeige").textContent="";
  document.getElementById("mischInfo").textContent=info;
}

// ── Lern-Einträge ─────────────────────────────────────────────────────────────
function baueLernListe(){
  var liste=document.getElementById("lernListe");
  LERN.forEach(function(l){
    var div=document.createElement("div");
    div.className="lernEintrag"; div.textContent=l;
    liste.appendChild(div);
  });
}

// ── Dwell ─────────────────────────────────────────────────────────────────────
var _dh=null;
function rebindDwell(){
  var att=window.LaetitiaAttachDwell||function(){return{cancelDwell:function(){}};};
  if(_dh)_dh.cancelDwell();
  var ms=Math.min(parseInt(localStorage.getItem("laetitia_dwell_ms")) || 700, 700);
  var lg=parseInt(localStorage.getItem("laetitia_leave_grace_ms"))||100;
  _dh=att("path.farbkreisSektor, circle.farbkreisSektor, a.mischFarbBtn, a.topBtn, #btnZurueck",{
    dwellMs:ms, leaveGrace:lg, onActivate:function(el){try{el.click();}catch(e){}}
  });
}

baueFarbkreis();
baueMischPalette("farbAuswahl1","#ef4444");
baueMischPalette("farbAuswahl2","#3b82f6");
baueLernListe();
mischen();
rebindDwell();
})();
</script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
