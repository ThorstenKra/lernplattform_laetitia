<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Farbmischer</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); }
.topTitel{ font-size:20px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:8px 16px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover{ background:#ddd6fe; outline:3px solid #8b5cf6; }

.main{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:0; overflow:hidden; }

/* Linke Hälfte: Farbkreis */
.farbkreisSeite{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; border-right:1px solid var(--border); }
.farbkreisTitel{ font-size:16px; font-weight:1000; color:var(--muted); }
#farbkreisSvg{ filter:drop-shadow(0 4px 16px rgba(0,0,0,0.15)); }
.farbkreisSektor{ cursor:pointer; transition:none; }
.farbkreisSektor:hover, .farbkreisSektor:focus{ filter:brightness(1.15); outline:none; }
.farbkreisSektor.gewaehlt{ filter:brightness(1.25) drop-shadow(0 0 8px rgba(0,0,0,0.4)); }
.gewaehltInfo{ display:flex; gap:10px; align-items:center; }
.gewaehltBox{ width:52px; height:52px; border-radius:12px; border:2px solid var(--border); }
.gewaehltName{ font-size:16px; font-weight:1000; }

/* Rechte Hälfte: Mischen */
.mischSeite{ display:flex; flex-direction:column; gap:12px; padding:16px; overflow:hidden; }
.mischTitel{ font-size:16px; font-weight:1000; color:var(--muted); flex:0 0 auto; }
.mischReihe{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.mischLabel{ font-size:13px; font-weight:900; color:var(--muted); width:60px; }
.farbAuswahl{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; flex:1; }
a.mischFarbBtn{ border-radius:8px; border:3px solid transparent; cursor:pointer; user-select:none; position:relative; transition:none; text-decoration:none; display:block; min-height:52px; }
a.mischFarbBtn:hover, a.mischFarbBtn:focus{ transform:scale(1.12); outline:3px solid var(--text); transition:none; z-index:2; }
a.mischFarbBtn.gewaehlt{ border:3px solid var(--text); transform:scale(1.10); box-shadow:0 0 0 2px rgba(0,0,0,0.25); }
.mischPfeil{ font-size:28px; text-align:center; flex:0 0 auto; }
.ergebnisBox{ flex:0 0 auto; }
.ergebnisAnzeige{ width:100%; height:100px; border-radius:18px; border:3px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:1000; color:rgba(0,0,0,0.5); }
.mischInfo{ font-size:14px; font-weight:900; color:var(--muted); text-align:center; }
.lernBox{ background:rgba(236,72,153,0.06); border:2px solid rgba(236,72,153,0.20); border-radius:14px; padding:12px 16px; flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.lernTitel{ font-size:14px; font-weight:1000; color:var(--pink); }
.lernEintrag{ font-size:13px; font-weight:900; color:var(--text); padding:4px 0; border-bottom:1px solid rgba(236,72,153,0.10); }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ filter:brightness(1.18) !important; outline:3px solid var(--pink) !important; transition:none !important; }
a.mischFarbBtn.dwell-active{ transform:scale(1.18) !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel">🌈 Farbmischer</div>
  
</div>
<div class="main">

  <!-- Links: Farbkreis -->
  <div class="farbkreisSeite">
    <div class="farbkreisTitel">🎨 Farbkreis — antippen zum Auswählen</div>
    <svg id="farbkreisSvg" width="280" height="280" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="gewaehltInfo">
      <div class="gewaehltBox" id="gewaehltBox" style="background:#ec4899;"></div>
      <div class="gewaehltName" id="gewaehltName">Pink</div>
    </div>
  </div>

  <!-- Rechts: Mischen -->
  <div class="mischSeite">
    <div class="mischTitel">🧪 Farben mischen</div>
    <div class="mischReihe">
      <div class="mischLabel">Farbe 1</div>
      <div class="farbAuswahl" id="farbAuswahl1"></div>
    </div>
    <div class="mischReihe">
      <div class="mischLabel">Farbe 2</div>
      <div class="farbAuswahl" id="farbAuswahl2"></div>
    </div>
    <div class="mischPfeil">⬇ Ergebnis</div>
    <div class="ergebnisBox">
      <div class="ergebnisAnzeige" id="ergebnisAnzeige" style="background:#f0abfc;">Mische!</div>
    </div>
    <div class="mischInfo" id="mischInfo"></div>
    <div class="lernBox">
      <div class="lernTitel">💡 Was entsteht?</div>
      <div id="lernListe"></div>
    </div>
  </div>

</div>
<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./farbmischer_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
