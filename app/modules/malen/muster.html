<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Muster-Magie</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777; --radius:16px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); }
.topTitel{ font-size:18px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:6px 14px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; white-space:nowrap; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.pink{ background:var(--pink); color:#fff; border-color:transparent; }
a.topBtn.pink:hover, a.topBtn.pink:focus{ background:var(--pink2); }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover, a.topBtn.lila:focus{ background:#ddd6fe; outline:3px solid #8b5cf6; }

.main{ flex:1; display:grid; grid-template-columns:110px 1fr 130px; gap:0; min-height:0; overflow:hidden; }

/* Linke Spalte: Muster-Vorlagen */
.linksPanel{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:6px; gap:3px; overflow:hidden; }
.panelLabel{ font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:2px; flex:0 0 auto; text-align:center; }
a.musterBtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1; border-radius:10px; border:2px solid var(--border); background:rgba(15,23,42,.04); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; font-size:10px; font-weight:900; padding:3px; text-align:center; }
a.musterBtn:hover, a.musterBtn:focus{ background:rgba(236,72,153,0.12); outline:3px solid var(--pink); transition:none; }
a.musterBtn.aktiv{ background:rgba(236,72,153,0.20); border-color:var(--pink); color:var(--pink); }
.musterEmoji{ font-size:22px; }

/* Mitte: SVG-Leinwand */
.leinwandWrap{ display:flex; align-items:center; justify-content:center; background:#1a1a2e; overflow:hidden; }
#leinwand{ border-radius:8px; }

/* Rechte Spalte: Farbe + Geschwindigkeit */
.rechtsPanel{ background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; padding:6px; gap:6px; overflow:hidden; }
.sektLabel{ font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; text-align:center; flex:0 0 auto; }
.farbGrid{ display:grid; grid-template-columns:1fr 1fr; gap:4px; flex:0 0 auto; }
a.farbBtn{ border-radius:8px; border:3px solid transparent; cursor:pointer; user-select:none; position:relative; transition:none; text-decoration:none; display:block; min-height:52px; }
a.farbBtn:hover, a.farbBtn:focus{ transform:scale(1.12); outline:3px solid #fff; transition:none; z-index:2; }
a.farbBtn.gewaehlt{ border:3px solid #fff; transform:scale(1.10); }
.schnellButtons{ display:flex; flex-direction:column; gap:4px; flex:0 0 auto; }
a.schnellBtn{ display:flex; align-items:center; justify-content:center; min-height:44px; border-radius:10px; border:2px solid var(--border); background:rgba(15,23,42,.04); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; font-size:12px; font-weight:1000; transition:none; }
a.schnellBtn:hover, a.schnellBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.schnellBtn.aktiv{ background:var(--pink); color:#fff; border-color:transparent; }
.animBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; border-radius:10px; border:2px solid var(--border); background:rgba(236,72,153,0.10); color:var(--pink); text-decoration:none; cursor:pointer; user-select:none; position:relative; font-size:13px; font-weight:1000; flex:0 0 auto; transition:none; }
.animBtn:hover, .animBtn:focus{ background:rgba(236,72,153,0.22); outline:3px solid var(--pink); transition:none; }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:60px; height:60px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:30px 30px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ outline:3px solid var(--pink) !important; transition:none !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>

<div class="topBar">
  <div class="topTitel" id="topTitelText">✨ Muster-Magie</div>
  <a class="topBtn" href="#" id="btnAnimieren">▶ Animieren</a>
  <a class="topBtn" href="#" id="btnNeu">🗑 Neu</a>
  <a class="topBtn pink" href="#" id="btnSpeichern">💾 Speichern</a>
  
</div>

<div class="main">

  <!-- Links: Muster -->
  <div class="linksPanel">
    <div class="panelLabel">Muster</div>
    <a class="musterBtn aktiv" href="#" data-muster="kreis"><span class="musterEmoji">⭕</span>Kreise</a>
    <a class="musterBtn" href="#" data-muster="stern"><span class="musterEmoji">✨</span>Stern</a>
    <a class="musterBtn" href="#" data-muster="spirale"><span class="musterEmoji">🌀</span>Spirale</a>
    <a class="musterBtn" href="#" data-muster="welle"><span class="musterEmoji">〰️</span>Wellen</a>
    <a class="musterBtn" href="#" data-muster="blume"><span class="musterEmoji">🌸</span>Blume</a>
    <a class="musterBtn" href="#" data-muster="netz"><span class="musterEmoji">🕸️</span>Netz</a>
    <a class="musterBtn" href="#" data-muster="diamant"><span class="musterEmoji">💎</span>Diamant</a>
    <a class="musterBtn" href="#" data-muster="strahlen"><span class="musterEmoji">🌟</span>Strahlen</a>
  </div>

  <!-- Mitte: SVG -->
  <div class="leinwandWrap" id="leinwandWrap">
    <svg id="leinwand" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- Rechts: Farbe + Anzahl -->
  <div class="rechtsPanel">
    <div class="sektLabel">🎨 Farbe</div>
    <div class="farbGrid" id="farbGrid"></div>
    <div class="sektLabel">Linien</div>
    <div class="schnellButtons">
      <a class="schnellBtn" href="#" data-n="6">6</a>
      <a class="schnellBtn aktiv" href="#" data-n="12">12</a>
      <a class="schnellBtn" href="#" data-n="24">24</a>
      <a class="schnellBtn" href="#" data-n="36">36</a>
    </div>
    <a class="animBtn" href="#" id="btnAnim2">🎬 Schritt</a>
  </div>

</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./muster_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
