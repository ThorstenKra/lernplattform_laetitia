<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Kleckse</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff;
  --border:rgba(15,23,42,.14); --shadow:0 4px 16px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --pink:#ec4899; --pink2:#db2777;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.topBar{ flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); }
.topTitel{ font-size:18px; font-weight:1000; color:var(--pink); flex:1; }
a.topBtn{ display:flex; align-items:center; justify-content:center; min-height:52px; padding:6px 14px; font-size:14px; font-weight:1000; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; white-space:nowrap; }
a.topBtn:hover, a.topBtn:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.topBtn.pink{ background:var(--pink); color:#fff; border-color:transparent; }
a.topBtn.pink:hover, a.topBtn.pink:focus{ background:var(--pink2); }
a.topBtn.lila{ background:#ede9fe; color:#4c1d95; border:2px solid #8b5cf6; }
a.topBtn.lila:hover, a.topBtn.lila:focus{ background:#ddd6fe; outline:3px solid #8b5cf6; }
a.topBtn.aktiv{ background:var(--pink); color:#fff; border-color:transparent; }

.main{ flex:1; display:grid; grid-template-columns:80px 1fr 130px; gap:0; min-height:0; overflow:hidden; }

/* Linke Spalte: Pinsel-Größen */
.linksPanel{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:6px; gap:4px; overflow:hidden; }
.panelLabel{ font-size:10px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; text-align:center; flex:0 0 auto; margin-bottom:2px; }
a.groesseBtn{ display:flex; align-items:center; justify-content:center; flex:1; border-radius:10px; border:2px solid var(--border); background:rgba(15,23,42,.04); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; transition:none; }
a.groesseBtn:hover, a.groesseBtn:focus{ background:rgba(236,72,153,0.10); outline:3px solid var(--pink); transition:none; }
a.groesseBtn.aktiv{ background:rgba(236,72,153,0.18); border-color:var(--pink); }
.pinselDot{ border-radius:50%; background:var(--pink); pointer-events:none; }

/* Mitte: Leinwand als SVG */
.leinwandWrap{ display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; position:relative; }
#leinwand{ border:1px solid #e5e7eb; border-radius:8px; cursor:crosshair; }

/* Klecks-Zellen (unsichtbares Hover-Raster) */
.zellenGrid{ position:absolute; display:grid; pointer-events:none; }
a.zelle{ display:block; background:transparent; cursor:pointer; user-select:none; position:relative; transition:none; border-radius:50%; pointer-events:all; }
a.zelle:hover{ background:rgba(236,72,153,0.08); }

/* Rechte Spalte: Farben */
.rechtsPanel{ background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; padding:6px 4px; gap:4px; overflow:hidden; }
.farbGrid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:3px; align-content:start; overflow:hidden; }
a.farbBtn{ border-radius:10px; border:3px solid transparent; cursor:pointer; user-select:none; position:relative; transition:none; text-decoration:none; display:block; min-height:52px; }
a.farbBtn:hover, a.farbBtn:focus{ transform:scale(1.12); outline:3px solid var(--text); transition:none; z-index:2; }
a.farbBtn.gewaehlt{ border:3px solid var(--text); transform:scale(1.10); box-shadow:0 0 0 2px rgba(0,0,0,0.25); }
a.radierer{ display:flex; align-items:center; justify-content:center; min-height:38px; border-radius:8px; border:2px solid var(--border); background:rgba(15,23,42,.06); color:var(--text); text-decoration:none; cursor:pointer; user-select:none; position:relative; font-size:16px; flex:0 0 auto; transition:none; }
a.radierer:hover, a.radierer:focus{ background:rgba(15,23,42,.14); outline:3px solid var(--pink); transition:none; }
a.radierer.aktiv{ background:#fca5a5; border-color:#ef4444; }

@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:50px; height:50px; }
.dwell-ring-svg circle{ fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:25px 25px; }
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.8s) linear forwards; }
.dwell-active{ background:rgba(236,72,153,0.20) !important; outline:2px solid var(--pink) !important; transition:none !important; }
a.farbBtn.dwell-active{ transform:scale(1.18) !important; filter:none !important; }

  /* Zurück-Button unten mittig */
  .zurueckLeiste{
    flex:0 0 auto; padding:8px 12px;
    background:var(--panel, #fff); border-top:1px solid var(--border, rgba(15,23,42,.14));
  }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:78px; font-size:18px; font-weight:1000; width:100%;
    border-radius:16px; border:2px solid #8b5cf6;
    background:#ede9fe; color:#4c1d95;
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{
    background:#ddd6fe; outline:4px solid #8b5cf6; transition:none;
  }

</style>
</head>
<body>
<div class="topBar">
  <div class="topTitel" id="topTitelText">🖌️ Kleckse</div>
  <a class="topBtn" href="#" id="btnUndo">↩</a>
  <a class="topBtn" href="#" id="btnReset">🗑</a>
  <a class="topBtn pink" href="#" id="btnSpeichern">💾</a>
  
</div>
<div class="main">
  <div class="linksPanel">
    <div class="panelLabel">Größe</div>
    <a class="groesseBtn" href="#" data-groesse="8"><div class="pinselDot" style="width:8px;height:8px;"></div></a>
    <a class="groesseBtn" href="#" data-groesse="14"><div class="pinselDot" style="width:14px;height:14px;"></div></a>
    <a class="groesseBtn aktiv" href="#" data-groesse="22"><div class="pinselDot" style="width:22px;height:22px;"></div></a>
    <a class="groesseBtn" href="#" data-groesse="32"><div class="pinselDot" style="width:32px;height:32px;"></div></a>
    <a class="groesseBtn" href="#" data-groesse="46"><div class="pinselDot" style="width:46px;height:46px;"></div></a>
  </div>
  <div class="leinwandWrap" id="leinwandWrap">
    <svg id="leinwand" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zellenGrid" id="zellenGrid"></div>
  </div>
  <div class="rechtsPanel">
    <div class="panelLabel">🎨</div>
    <a class="radierer" href="#" id="btnRadierer">⬜</a>
    <div class="farbGrid" id="farbGrid"></div>
  </div>
</div>
<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="./kleckse_mod.js"></script>

<div class="zurueckLeiste"><a class="zurueckBtn" href="./malen.html" id="btnZurueck">← Zurück</a></div>
</body>
</html>
