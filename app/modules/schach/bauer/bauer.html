<!doctype html>
<!-- depth:3 -- Pfade: ../../../core/ -->
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Laetitia – Bauer lernen</title>
  <style>
    :root{
      --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef0f5;
      --text:#0f172a; --muted:#64748b; --line:#d1d9e6;
      --good:#1a9e4a; --warn:#b45a00;
      --tileA:#e8e0d4; --tileB:#c8bfb0; --radius:16px;
      --green:#1db954; --red:#e24a4a;
      --bauergruen:#15803d; --bauergruen-hell:rgba(21,128,61,.20);
      --dwell-color: rgba(29,185,84,.95);
    }
    html,body{ height:100%; margin:0; }
    body{
      background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      overflow:hidden;
    }
    .app{
      height:100vh; display:flex; align-items:stretch;
      padding:8px; box-sizing:border-box; gap:8px;
    }

    /* ── Linke Seite ── */
    .brett-seite{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; }
    .boardWrap{
      flex:1 1 auto; min-height:0; padding:8px; border-radius:var(--radius);
      border:1px solid var(--line); background:rgba(0,0,0,.18); box-sizing:border-box;
    }
    .grid{ height:100%; width:100%; display:grid; gap:5px; }

    /* Topbar UNTEN */
    .topbar{
      display:flex; align-items:center; gap:8px;
      background:var(--panel2); border:1px solid var(--line);
      border-radius:12px; padding:6px 10px; flex:0 0 auto;
    }
    .topTitle{ flex:1; text-align:center; font-weight:900; font-size:15px; }

    /* ── Zellen ── */
    .cell{
      border-radius:10px; border:2px solid var(--line);
      background:var(--tileA); position:relative;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; cursor:pointer; user-select:none; transition:none;
    }
    .cell.alt{ background:var(--tileB); }
    .cell.inactive{ cursor:default; }

    /* Aktive Züge — GRÜN */
    .cell.active{
      background:rgba(29,185,84,.22);
      border:3px solid rgba(29,185,84,.80);
      box-shadow:0 0 0 2px rgba(29,185,84,.15) inset;
      cursor:pointer;
    }
    .cell.active:hover, .cell.active.dwell-active{
      background:rgba(29,185,84,.40); border-color:#1db954;
      transform:scale(1.06); outline:3px solid rgba(29,185,84,.60);
      box-shadow:0 0 12px rgba(29,185,84,.35);
    }
    /* Schlagzug-Feld — gelb-orange Rahmen wenn anwählbar */
    .cell.active.schlag-cell{
      background:rgba(234,179,8,.25) !important;
      border:3px solid rgba(234,179,8,.90) !important;
    }
    .cell.active.schlag-cell:hover, .cell.active.schlag-cell.dwell-active{
      background:rgba(234,179,8,.45) !important;
      border-color:#ca8a04 !important;
    }
    /* Bauer — Dunkelgrün */
    .cell.player{
      border-color:rgba(21,128,61,.90);
      background:rgba(21,128,61,.18);
    }
    /* Zielfeld — Gold; wenn anwählbar — grün */
    .cell.goal-cell{
      border-color:rgba(245,158,11,.90);
      background:rgba(245,158,11,.18);
    }
    .cell.active.goal-cell{
      border-color:rgba(29,185,84,.90) !important;
      background:rgba(29,185,84,.30) !important;
    }
    .cell.active.goal-cell:hover, .cell.active.goal-cell.dwell-active{
      background:rgba(29,185,84,.50) !important; border-color:#1db954 !important;
    }
    /* Vorwärts-Indikator: Felder direkt vor dem Bauer */
    .cell.vorwaerts{
      background:rgba(21,128,61,.07);
      border-color:rgba(21,128,61,.22);
    }

    /* ── Dwell-Ring ── */
    @keyframes dwellRing{ from{stroke-dashoffset:220;} to{stroke-dashoffset:0;} }
    .dwell-ring-svg{
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none; z-index:10; width:64px; height:64px;
    }
    .dwell-ring-svg circle{
      fill:none; stroke:var(--dwell-color); stroke-width:5;
      stroke-dasharray:220; stroke-dashoffset:220;
      transform:rotate(-90deg); transform-origin:32px 32px;
    }
    .dwell-ring-svg circle.animating{
      animation:dwellRing var(--dwell-duration,0.9s) linear forwards;
    }
    .dwell-active{ outline:3px solid var(--dwell-color) !important; transform:scale(1.05); transition:none; }

    /* ── Rechte Seite ── */
    .info-seite{
      flex:0 0 200px; display:flex; flex-direction:column; gap:8px;
      background:var(--panel); border:1px solid var(--line);
      border-radius:var(--radius); padding:10px; overflow-y:auto;
    }
    .progressWrap{
      flex:0 0 auto; padding:8px 10px; border:1px solid var(--line);
      border-radius:12px; background:rgba(0,0,0,.18);
    }
    .progressTop{ display:flex; justify-content:space-between; color:var(--muted); font-size:11px; margin-bottom:5px; }
    .bar{ height:8px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; }
    .bar>div{ height:100%; width:0%; background:rgba(29,185,84,.75); transition:width .4s; }
    .moveInfo{ font-size:12px; color:var(--muted); margin-top:5px; text-align:center; }
    .instruction{ font-size:15px; font-weight:900; line-height:1.3; text-align:center; color:var(--text); }
    .subline{ font-size:12px; color:var(--muted); text-align:center; }
    .legend{ display:flex; flex-direction:column; gap:4px; }
    .pill{
      display:flex; gap:6px; align-items:center;
      padding:5px 8px; border:1px solid var(--line);
      border-radius:8px; background:rgba(0,0,0,.10); font-size:12px;
    }
    .pill b{ font-size:14px; }
    .pill.gruen  { border-color:rgba(29,185,84,.50);  background:rgba(29,185,84,.10);  color:#0b5c22; }
    .pill.dunkelgruen{ border-color:rgba(21,128,61,.50); background:rgba(21,128,61,.10); color:#14532d; }
    .pill.gelb   { border-color:rgba(202,138,4,.50);  background:rgba(234,179,8,.10);  color:#713f12; }
    .pill.gold   { border-color:rgba(160,90,0,.40);   background:rgba(160,90,0,.08);   color:#7a4200; }
    .pill.grau   { border-color:rgba(100,100,100,.40); background:rgba(100,100,100,.08); }
    .feedback{
      font-size:13px; font-weight:900; text-align:center; min-height:36px;
      padding:6px; border-radius:10px; background:rgba(0,0,0,.12);
      border:1px solid var(--line); line-height:1.3;
    }
    .feedback.good{ color:#0b5c22; border-color:rgba(29,185,84,.35); background:rgba(29,185,84,.08); }
    .feedback.warn{ color:#7a3d00; border-color:rgba(160,90,0,.35); background:rgba(160,90,0,.08); }
    .btn{
      border:1px solid var(--line); background:transparent; color:var(--text);
      border-radius:12px; padding:10px 8px; font-weight:800; font-size:14px;
      cursor:pointer; width:100%; user-select:none; position:relative;
      display:flex; align-items:center; justify-content:center; min-height:68px;
    }
    .btn.small{ min-height:44px; padding:8px; }
    .btn.primary{ background:rgba(29,185,84,.18); border-color:rgba(29,185,84,.55); }
    .btn.gruen{ background:rgba(29,185,84,.22); border-color:rgba(29,185,84,.55); color:#0b5c22; }
    .btn.topbtn{ background:rgba(29,185,84,.18); border-color:rgba(29,185,84,.50); color:#0b5c22; }
    .btn:disabled{ opacity:.4; cursor:not-allowed; }
    .btn:not(:disabled):hover, .btn:not(:disabled).dwell-active{
      background:rgba(29,185,84,.30); border-color:rgba(29,185,84,.80);
      outline:3px solid rgba(29,185,84,.45); transform:scale(1.03);
    }
    .btn.topbtn:not(:disabled):hover, .btn.topbtn:not(:disabled).dwell-active{
      background:rgba(29,185,84,.35); border-color:rgba(29,185,84,.80);
      outline:3px solid rgba(29,185,84,.45); transform:scale(1.03);
    }
    .btn.aktion{ background:rgba(29,185,84,.15); border-color:rgba(29,185,84,.45); color:#0b5c22; }
    .btn.aktion:not(:disabled):hover, .btn.aktion:not(:disabled).dwell-active{
      background:rgba(29,185,84,.35); border-color:rgba(29,185,84,.80);
      outline:3px solid rgba(29,185,84,.45); transform:scale(1.03);
    }
    .btn.zurueck{
      background:rgba(139,92,246,.12); border-color:rgba(139,92,246,.50);
      color:#6d28d9; margin-top:auto;
    }
    .btn.zurueck:not(:disabled):hover, .btn.zurueck:not(:disabled).dwell-active{
      background:rgba(139,92,246,.28); border-color:rgba(139,92,246,.80);
      outline:3px solid rgba(139,92,246,.40);
    }
    .btn-gruppe{ display:flex; flex-direction:column; gap:6px; }

    /* Overlays */
    .overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.65);
      display:none; align-items:center; justify-content:center;
      padding:12px; box-sizing:border-box; z-index:100;
    }
    .overlay.show{ display:flex; }
    .modal{
      width:min(700px,96vw); background:var(--panel); border:1px solid var(--line);
      border-radius:calc(var(--radius)+8px); padding:20px;
      box-shadow:0 22px 70px rgba(0,0,0,.7);
    }
    .modal h2{ margin:0 0 10px; font-size:20px; }
    .modal p{ margin:0 0 14px; color:var(--muted); font-size:15px; line-height:1.4; }
    .modal .highlight{
      background:rgba(21,128,61,.08); border:1px solid rgba(21,128,61,.30);
      border-radius:12px; padding:10px 14px; font-size:15px;
      font-weight:900; color:var(--text); margin-bottom:14px; line-height:1.4;
    }
    .modal .bottomRow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .modal .btn{ width:auto; min-width:120px; }

    /* Level-Auswahl */
    .levelSelectGrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .lvlSelectBtn{
      min-height:70px; border-radius:14px; border:1px solid var(--line);
      background:rgba(0,0,0,.18); color:var(--text); cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px; font-weight:900;
    }
    .lvlSelectBtn:hover, .lvlSelectBtn.dwell-active{
      background:rgba(29,185,84,.18); border-color:rgba(29,185,84,.55);
      outline:3px solid rgba(29,185,84,.40); transform:scale(1.03);
    }
    .lvlSelectBtn.done{ border-color:rgba(126,242,154,.45); background:rgba(126,242,154,.08); }
    .lvlSelectBtn .lvlNum{ font-size:16px; font-weight:1000; }
    .lvlSelectBtn .lvlName{ font-size:12px; color:var(--muted); }
    .lvlSelectBtn .lvlStar{ font-size:11px; color:var(--warn); }
  </style>
</head>
<body>
<div class="app">

  <div class="brett-seite">
    <div class="boardWrap">
      <div class="grid" id="grid"></div>
    </div>
    <div class="topbar">
      <button class="btn small topbtn" id="btnBack" style="width:auto;min-width:80px;">← Start</button>
      <div class="topTitle">Bauer – Schach lernen</div>
      <button class="btn small topbtn" id="btnPause" style="width:auto;min-width:80px;">⏸ Pause</button>
    </div>
  </div>

  <div class="info-seite" id="viewRoot"></div>

</div>

<div class="overlay" id="overlayPause">
  <div class="modal">
    <h2>⏸ Pause</h2>
    <p>Kurze Pause — kein Stress!</p>
    <div class="bottomRow">
      <button id="btnPauseContinue" class="btn primary">▶ Weiter</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayTutorial">
  <div class="modal">
    <h2 id="tutTitle">Erklärung</h2>
    <p id="tutText">–</p>
    <div class="highlight" id="tutTip">–</div>
    <div class="bottomRow">
      <button class="btn primary" id="btnTutOk">Verstanden – Los!</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlayLevelSelect">
  <div class="modal">
    <h2>Level wählen</h2>
    <div id="levelSelectGrid" class="levelSelectGrid"></div>
    <div class="bottomRow">
      <button class="btn small" id="btnLevelSelectClose">Schließen</button>
    </div>
  </div>
</div>

<script src="../../../core/dwell.js"></script>
<script src="../../../core/error_handler.js"></script>
<script src="./bauer_mod.js"></script>
</body>
</html>
