<!doctype html>
<!-- depth:3 -- Pfade: ../../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Psalmen</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff;
    --border:rgba(15,23,42,.14);
    --shadow:0 10px 26px rgba(15,23,42,.08);
    --text:#0f172a; --muted:rgba(15,23,42,.65);
    --akzent:#7c3aed; --akzent2:#6d28d9;
    --akzent-bg:rgba(124,58,237,0.10);
    --green:#1db954; --red:#e24a4a;
    --lila:#8b5cf6; --lila-bg:#ede9fe; --lila-dark:#4c1d95;
    --radius:18px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; overflow:hidden;
  }
  .viewport{ height:100vh; display:flex; align-items:center; justify-content:center; padding:10px; }
  .app{ width:min(1000px,96vw); height:calc(100vh - 20px); display:flex; flex-direction:column; gap:8px; min-height:0; }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:12px; flex:1 1 auto; min-height:0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .screen.hidden{ display:none !important; }

  /* Dwell-Ring */
  @keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
  .dwell-active{ transform:scale(1.06); outline:4px solid var(--akzent); box-shadow:0 0 0 5px rgba(124,58,237,0.30); transition:none; }
  .dwell-ring-svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:10; width:70px; height:70px; }
  .dwell-ring-svg circle{ fill:none; stroke:var(--akzent); stroke-width:5; stroke-dasharray:220; stroke-dashoffset:220; transform:rotate(-90deg); transform-origin:35px 35px; }
  .dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,0.6s) linear forwards; }

  /* Buttons */
  a.uibtn, button.uibtn{
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    border-radius:14px; border:1px solid rgba(0,0,0,0.10); background:var(--akzent);
    color:#fff; font-weight:1000; user-select:none; cursor:pointer; position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  a.uibtn:hover, a.uibtn:focus, button.uibtn:hover, button.uibtn:focus{
    background:var(--akzent2); outline:3px solid rgba(124,58,237,0.50); outline-offset:2px; transition:none; z-index:2;
  }
  a.uibtn.grau{ background:rgba(15,23,42,.07); color:var(--text); border-color:var(--border); }
  a.uibtn.grau:hover, a.uibtn.grau:focus{ background:rgba(15,23,42,.14); }
  a.uibtn.gruen{ background:var(--green); color:#fff; }
  a.uibtn.gruen:hover{ background:#18a84c; }
  a.uibtn[aria-disabled="true"]{ opacity:0.4; pointer-events:none; }

  /* ── SCREEN 1: Alben-Übersicht ── */
  #screenAlben{ display:flex; flex-direction:column; gap:10px; height:100%; }
  .alben-header{ display:flex; align-items:center; gap:12px; padding-bottom:10px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .alben-header-emoji{ font-size:32px; }
  .alben-header-title{ font-size:clamp(20px,3.5vw,28px); font-weight:1000; }
  .alben-header-sub{ font-size:14px; color:var(--muted); font-weight:700; }
  .alben-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px; flex:1; overflow-y:auto; padding:4px 2px;
  }
  a.album-kachel{
    display:flex; flex-direction:column; align-items:center;
    border-radius:16px; border:2px solid var(--border); background:var(--panel);
    box-shadow:var(--shadow); text-decoration:none; color:var(--text);
    overflow:hidden; cursor:pointer; user-select:none; position:relative; transition:none;
  }
  a.album-kachel:hover, a.album-kachel:focus{ outline:4px solid var(--akzent); transform:scale(1.03); transition:none; }
  .album-kachel img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .album-kachel-info{ padding:10px; width:100%; text-align:center; }
  .album-kachel-name{ font-size:15px; font-weight:1000; }
  .album-kachel-anzahl{ font-size:12px; color:var(--muted); font-weight:700; margin-top:2px; }

  /* ── SCREEN 2: Psalm-Liste ── */
  #screenListe{ display:flex; flex-direction:column; gap:8px; height:100%; }
  .liste-header{ display:flex; align-items:center; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .liste-cover{ width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .liste-albumname{ font-size:clamp(16px,3vw,22px); font-weight:1000; }
  .liste-anzahl{ font-size:13px; color:var(--muted); font-weight:700; }
  .psalm-liste{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:2px; }
  a.psalmBtn{
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-radius:12px; border:1px solid var(--border); background:var(--panel);
    text-decoration:none; color:var(--text); font-weight:700; cursor:pointer;
    user-select:none; position:relative; min-height:54px; transition:none;
  }
  a.psalmBtn:hover, a.psalmBtn:focus{ background:var(--akzent-bg); outline:3px solid var(--akzent); transition:none; }
  a.psalmBtn.aktiv{ background:var(--akzent-bg); border-color:var(--akzent); }
  .psalm-nr{ font-size:13px; color:var(--muted); font-weight:700; min-width:28px; }
  .psalm-name{ flex:1; font-size:15px; }
  .psalm-play-icon{ font-size:18px; }

  /* ── SCREEN 3: Player ── */
  #screenPlayer{ display:flex; flex-direction:column; gap:10px; height:100%; }
  .player-header{ display:flex; align-items:center; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .player-cover{ width:64px; height:64px; border-radius:10px; object-fit:cover; flex-shrink:0; }
  .player-meta{ flex:1; min-width:0; }
  .player-albumname{ font-size:13px; color:var(--muted); font-weight:700; }
  .player-psalmname{ font-size:clamp(17px,3vw,24px); font-weight:1000; }

  .player-fortschritt{ flex-shrink:0; }
  .progress-wrap{ background:rgba(15,23,42,.08); border-radius:999px; height:10px; overflow:hidden; }
  .progress-bar{ height:100%; background:var(--akzent); border-radius:999px; width:0%; transition:width 0.5s linear; }
  .progress-zeit{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:700; margin-top:4px; }

  .player-controls{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; flex-shrink:0; }
  .player-controls a.uibtn{ min-height:72px; font-size:22px; }

  .player-vol{ display:grid; grid-template-columns:1fr 1fr; gap:10px; flex-shrink:0; }
  .player-vol a.uibtn{ min-height:72px; font-size:22px; }

  /* Zurück-Leiste */
  .zurueckLeiste{ flex-shrink:0; }
  a.zurueckBtn{
    display:flex; align-items:center; justify-content:center;
    min-height:58px; width:min(340px,100%); margin:0 auto;
    font-size:16px; font-weight:1000;
    border-radius:16px; border:2px solid var(--lila);
    background:var(--lila-bg); color:var(--lila-dark);
    text-decoration:none; cursor:pointer; user-select:none;
    position:relative; transition:none;
  }
  a.zurueckBtn:hover, a.zurueckBtn:focus{ background:#ddd6fe; outline:4px solid var(--lila); transition:none; }
</style>
</head>
<body>
<div class="viewport">
<div class="app">

  <!-- ══ SCREEN 1: Alben ══ -->
  <div class="panel screen" id="screenAlben">
    <div class="alben-header">
      <span class="alben-header-emoji">📖</span>
      <div>
        <div class="alben-header-title">Psalmen</div>
        <div class="alben-header-sub" id="albenAnzahl">wird geladen …</div>
      </div>
    </div>
    <div class="alben-grid" id="albenGrid"></div>
  </div>

  <!-- ══ SCREEN 2: Psalm-Liste ══ -->
  <div class="panel screen hidden" id="screenListe">
    <div class="liste-header">
      <img class="liste-cover" id="listeCover" src="" alt="Cover">
      <div>
        <div class="liste-albumname" id="listeAlbumname">Album</div>
        <div class="liste-anzahl" id="listeAnzahl">0 Psalmen</div>
      </div>
    </div>
    <div class="psalm-liste" id="psalmListe"></div>
  </div>

  <!-- ══ SCREEN 3: Player ══ -->
  <div class="panel screen hidden" id="screenPlayer">
    <div class="player-header">
      <img class="player-cover" id="playerCover" src="" alt="Cover">
      <div class="player-meta">
        <div class="player-albumname" id="playerAlbumname">Album</div>
        <div class="player-psalmname" id="playerPsalmname">Psalm</div>
      </div>
    </div>
    <div class="player-fortschritt">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-zeit">
        <span id="zeitAkt">0:00</span>
        <span id="zeitGes">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <a class="uibtn grau" id="btnVorig" href="#">⏮</a>
      <a class="uibtn" id="btnPlayPause" href="#">▶</a>
      <a class="uibtn grau" id="btnNaechst" href="#">⏭</a>
    </div>
    <div class="player-vol">
      <a class="uibtn grau" id="btnVolMinus" href="#">🔉 Leiser</a>
      <a class="uibtn grau" id="btnVolPlus" href="#">🔊 Lauter</a>
    </div>
  </div>

  <!-- ══ Zurück-Leiste ══ -->
  <div class="zurueckLeiste">
    <a class="zurueckBtn" id="btnReturn" href="#">← Zurück</a>
  </div>

</div><!-- /app -->
</div><!-- /viewport -->

<!-- ══ Info-Dateien ══ -->
<script src="./alben/ReinerUnglaub/info.js"></script>
<script src="./glaube_psalmen_media_config.js"></script>

<!-- ══ Dwell ══ -->
<script src="../../../core/dwell.js"></script>

<script>
(function(){
  "use strict";

  var DWELL_MS   = 1600;
  var VOL_MIN    = 0.1, VOL_MAX = 0.8, VOL_STEP = 0.1, VOL_KEY = "laetitia_lautstaerke";
  var alben      = window.LaetitiaGlaubenLieder || [];
  var screen     = "alben";
  var aktAlbum   = null;
  var aktIdx     = 0;
  var audio      = null;
  var _playing   = false;

  var returnGlaube = new URL("../../../glaube.html", window.location.href).href;

  /* DOM */
  function $(id){ return document.getElementById(id); }
  var elAlben      = $("screenAlben");
  var elListe      = $("screenListe");
  var elPlayer     = $("screenPlayer");
  var elAlbenGrid  = $("albenGrid");
  var elAlbenAnzahl= $("albenAnzahl");
  var elListeCover = $("listeCover");
  var elListeName  = $("listeAlbumname");
  var elListeAnzahl= $("listeAnzahl");
  var elPsalmListe = $("psalmListe");
  var elPlayerCover= $("playerCover");
  var elPlayerAlb  = $("playerAlbumname");
  var elPlayerPsalm= $("playerPsalmname");
  var elProgress   = $("progressBar");
  var elZeitAkt    = $("zeitAkt");
  var elZeitGes    = $("zeitGes");
  var btnPlay      = $("btnPlayPause");
  var btnVorig     = $("btnVorig");
  var btnNaechst   = $("btnNaechst");
  var btnVolMinus  = $("btnVolMinus");
  var btnVolPlus   = $("btnVolPlus");
  var btnReturn    = $("btnReturn");

  /* Lautstärke */
  function getLautstaerke(){
    var v = parseFloat(localStorage.getItem(VOL_KEY));
    if(isNaN(v) || v < VOL_MIN || v > VOL_MAX) v = 0.6;
    return v;
  }

  /* Zeit formatieren */
  function fmtZeit(s){
    if(!isFinite(s)) return "0:00";
    var m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ":" + (sec<10?"0":"") + sec;
  }

  /* Audio-Unlock */
  var _unlocked = false;
  function unlockAudio(){
    if(_unlocked) return; _unlocked = true;
    try{ var c=new(window.AudioContext||window.webkitAudioContext)(); c.resume().then(function(){c.close();}); }catch(e){}
  }
  document.addEventListener("pointerdown", unlockAudio, {capture:true});
  document.addEventListener("mousedown",   unlockAudio, {capture:true});

  /* ── Alben-Grid ── */
  function renderAlben(){
    elAlbenGrid.innerHTML = "";
    elAlbenAnzahl.textContent = alben.length + (alben.length===1?" Sammlung":" Sammlungen");
    alben.forEach(function(alb, i){
      var a = document.createElement("a");
      a.className = "album-kachel";
      a.href = "#";
      a.dataset.idx = i;
      a.innerHTML =
        '<img src="' + (alb.cover||"") + '" alt="' + alb.name + '" onerror="this.style.background=\'#ddd6fe\';this.src=\'\';">' +
        '<div class="album-kachel-info">' +
          '<div class="album-kachel-name">' + alb.name + '</div>' +
          '<div class="album-kachel-anzahl">' + (alb.psalmen?alb.psalmen.length:0) + ' Psalmen</div>' +
        '</div>';
      elAlbenGrid.appendChild(a);
    });
  }

  /* ── Psalm-Liste zeigen ── */
  function zeigeAlbum(alb){
    aktAlbum = alb;
    screen = "liste";
    elAlben.classList.add("hidden");
    elPlayer.classList.add("hidden");
    elListe.classList.remove("hidden");
    elListeCover.src = alb.cover || "";
    elListeName.textContent = alb.name;
    elListeAnzahl.textContent = alb.psalmen.length + " Psalmen";
    elPsalmListe.innerHTML = "";
    alb.psalmen.forEach(function(ps, i){
      var a = document.createElement("a");
      a.className = "psalmBtn";
      a.href = "#";
      a.dataset.idx = i;
      a.innerHTML =
        '<span class="psalm-nr">' + (i+1) + '</span>' +
        '<span class="psalm-name">' + ps.titel + '</span>' +
        '<span class="psalm-play-icon">▶</span>';
      elPsalmListe.appendChild(a);
    });
    btnReturn.textContent = "← Zurück zur Übersicht";
    rebindDwell();
  }

  /* ── Player starten ── */
  function spielePsalm(idx){
    if(!aktAlbum) return;
    aktIdx = idx;
    var ps = aktAlbum.psalmen[idx];
    if(!ps) return;

    if(audio){
      audio.pause();
      audio.src = "";
    }
    audio = new Audio();
    audio.addEventListener("loadedmetadata", function(){
      audio.volume = getLautstaerke();
      elZeitGes.textContent = fmtZeit(audio.duration);
      audio.play().catch(function(){
        setTimeout(function(){ audio.play().catch(function(){}); }, 300);
      });
      _playing = true;
      btnPlay.textContent = "⏸";
    });
    audio.addEventListener("timeupdate", function(){
      if(!audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      elProgress.style.width = pct + "%";
      elZeitAkt.textContent = fmtZeit(audio.currentTime);
    });
    audio.addEventListener("ended", function(){
      if(aktIdx < aktAlbum.psalmen.length - 1){
        spielePsalm(aktIdx + 1);
      } else {
        _playing = false;
        btnPlay.textContent = "▶";
        elProgress.style.width = "0%";
      }
    });
    audio.src = ps.datei;

    /* Player-UI */
    screen = "player";
    elAlben.classList.add("hidden");
    elListe.classList.add("hidden");
    elPlayer.classList.remove("hidden");
    elPlayerCover.src = aktAlbum.cover || "";
    elPlayerAlb.textContent = aktAlbum.name;
    elPlayerPsalm.textContent = ps.titel;
    elProgress.style.width = "0%";
    elZeitAkt.textContent = "0:00";
    elZeitGes.textContent = "0:00";
    btnPlay.textContent = "⏸";
    btnVorig.setAttribute("aria-disabled",   idx===0 ? "true" : "false");
    btnNaechst.setAttribute("aria-disabled", idx===aktAlbum.psalmen.length-1 ? "true" : "false");
    btnReturn.textContent = "← Zurück zur Liste";
    rebindDwell();
  }

  /* ── Klick-Handler ── */
  elAlbenGrid.addEventListener("click", function(e){
    var a = e.target.closest(".album-kachel");
    if(!a) return;
    e.preventDefault();
    zeigeAlbum(alben[parseInt(a.dataset.idx,10)]);
  });

  elPsalmListe.addEventListener("click", function(e){
    var a = e.target.closest(".psalmBtn");
    if(!a) return;
    e.preventDefault();
    spielePsalm(parseInt(a.dataset.idx,10));
  });

  btnPlay.addEventListener("click", function(e){
    e.preventDefault();
    if(!audio) return;
    if(_playing){ audio.pause(); _playing=false; btnPlay.textContent="▶"; }
    else { audio.play(); _playing=true; btnPlay.textContent="⏸"; }
  });
  btnVorig.addEventListener("click", function(e){
    e.preventDefault();
    if(aktIdx>0) spielePsalm(aktIdx-1);
  });
  btnNaechst.addEventListener("click", function(e){
    e.preventDefault();
    if(aktAlbum && aktIdx<aktAlbum.psalmen.length-1) spielePsalm(aktIdx+1);
  });
  btnVolMinus.addEventListener("click", function(e){
    e.preventDefault();
    var v = Math.max(VOL_MIN, Math.round((getLautstaerke()-VOL_STEP)*10)/10);
    localStorage.setItem(VOL_KEY, String(v));
    if(audio) audio.volume = v;
  });
  btnVolPlus.addEventListener("click", function(e){
    e.preventDefault();
    var v = Math.min(VOL_MAX, Math.round((getLautstaerke()+VOL_STEP)*10)/10);
    localStorage.setItem(VOL_KEY, String(v));
    if(audio) audio.volume = v;
  });

  btnReturn.addEventListener("click", function(e){
    e.preventDefault();
    if(screen==="player"){
      if(audio){ audio.pause(); audio.src=""; audio=null; _playing=false; }
      zeigeAlbum(aktAlbum);
    } else if(screen==="liste"){
      screen="alben";
      elListe.classList.add("hidden");
      elAlben.classList.remove("hidden");
      btnReturn.textContent = "← Zurück";
      rebindDwell();
    } else {
      window.location.href = returnGlaube;
    }
  });

  /* ── Dwell ── */
  var _attachDwell = window.LaetitiaAttachDwell || function(){ return {cancelDwell:function(){}}; };
  var _dwellHandle = null;
  function rebindDwell(){
    var sel;
    if(screen==="alben")       sel = "a.album-kachel, #btnReturn";
    else if(screen==="liste")  sel = "a.psalmBtn, #btnReturn";
    else                       sel = "#btnPlayPause, #btnVorig, #btnNaechst, #btnVolMinus, #btnVolPlus, #btnReturn";
    if(_dwellHandle===null){
      _dwellHandle = _attachDwell(sel, {
        dwellMs: DWELL_MS, leaveGrace: 150,
        onActivate: function(el){ try{ el.click(); }catch(ex){} }
      });
      if(_dwellHandle && typeof _LDwellState !== "undefined"){
        _LDwellState.protectUntil = Date.now() + 1200;
      }
    } else {
      if(_dwellHandle.rebind) _dwellHandle.rebind(sel);
    }
  }

  /* ── Init ── */
  renderAlben();
  rebindDwell();

})();
</script>
</body>
</html>
