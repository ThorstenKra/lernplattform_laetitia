<!doctype html>
<!-- depth:2 — Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia - Reimen</title>
<style>
:root{
  --bg:#fff8f0; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 6px 18px rgba(15,23,42,.07);
  --text:#0f172a; --muted:rgba(15,23,42,.65);
  --akzent:#e85d04; --akzent2:#c2410c;
  --akzent-bg:rgba(232,93,4,0.08); --radius:16px;
  --lila:#8b5cf6; --lila-bg:#ede9fe;
  --gruen:#16a34a; --gruen-bg:#dcfce7;
  --rot:#dc2626; --rot-bg:rgba(220,38,38,0.08);
  --orange:#f97316; --orange-bg:#fff7ed;
  --lese-bg:#fffaf5; --lese-border:#fed7aa;
  --trenn-bg:#fff1e6; --trenn-border:#fdba74;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── Header ─────────────────────────────────────────────────────── */
.header{
  background:var(--panel); border-bottom:2px solid var(--akzent);
  box-shadow:0 2px 8px rgba(15,23,42,.06); flex-shrink:0;
  padding:10px 16px; display:flex; align-items:center; gap:10px;
}
.header-emoji{ font-size:30px; }
.header-titel{ font-size:20px; font-weight:1000; color:var(--akzent); }
.header-sub{ font-size:13px; font-weight:800; color:var(--muted); margin-left:auto; }

/* ── Fortschritt ─────────────────────────────────────────────────── */
.fortschritt-bar{ height:7px; background:rgba(232,93,4,0.12); flex-shrink:0; }
.fortschritt-fill{ height:100%; background:var(--akzent); transition:width .4s ease; }

/* ── Spielfeld ───────────────────────────────────────────────────── */
.spielfeld{
  flex:1; overflow-y:hidden; padding:10px 14px;
  display:flex; flex-direction:column; gap:0;
  min-height:0;
}

/* ── LESEBEREICH (passiv — kein Dwell) ──────────────────────────── */
.lese-bereich{
  background:var(--lese-bg);
  border:2px solid var(--lese-border);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:16px 18px;
  flex-shrink:0;
  pointer-events:none;
  user-select:none;
}
.lese-frage{
  font-size:22px; font-weight:1000; color:var(--text);
  line-height:1.3;
}
.lese-satz{
  margin-top:10px;
  font-size:24px; font-weight:800;
  color:var(--akzent2);
  background:var(--akzent-bg);
  border:2px solid var(--akzent);
  border-radius:10px; padding:12px 16px;
  line-height:1.4;
}
.lese-luecke{
  display:inline-block; min-width:100px; border-bottom:3px solid var(--akzent);
  color:rgba(232,93,4,.4); font-style:italic;
}
.lese-woerter{
  margin-top:10px; display:flex; align-items:center; justify-content:center;
  gap:16px; font-size:clamp(26px,4.5vw,44px); font-weight:1000; color:var(--text);
}
.lese-trenner{ font-size:clamp(18px,3vw,28px); color:var(--muted); font-weight:400; }

/* ── TRENNSTREIFEN ───────────────────────────────────────────────── */
.trenn-streifen{
  background:var(--trenn-bg);
  border-left:2px solid var(--trenn-border);
  border-right:2px solid var(--trenn-border);
  padding:6px 18px;
  display:flex; align-items:center; gap:6px;
  flex-shrink:0;
  pointer-events:none;
}
.trenn-label{
  font-size:13px; font-weight:1000;
  color:#9a3412; text-transform:uppercase; letter-spacing:.05em;
}

/* ── AKTIONSBEREICH (dwell-aktiv) ───────────────────────────────── */
.aktions-bereich{
  background:var(--panel);
  border:2px solid var(--trenn-border);
  border-top:none;
  border-radius:0 0 var(--radius) var(--radius);
  padding:12px 14px;
  display:flex; flex-direction:column; gap:10px;
  flex-shrink:0;
}

/* ── Feedback ────────────────────────────────────────────────────── */
.feedback-zeile{
  padding:12px 16px; border-radius:12px;
  font-size:19px; font-weight:800; display:none;
  border:2px solid transparent; flex-shrink:0; line-height:1.4;
  margin-top:8px;
  pointer-events:none;
}
.feedback-richtig{ display:block; background:#dcfce7; border-color:var(--gruen); color:#166534; }
.feedback-falsch{ display:block; background:#fee2e2; border-color:var(--rot); color:#991b1b; }

/* ── Antwort-Buttons Zweier (Ja/Nein) ───────────────────────────── */
.antwort-zweier{ display:flex; gap:10px; }
.antwort-btn{
  flex:1; min-height:96px;
  border-radius:var(--radius); border:2px solid var(--akzent);
  background:var(--akzent-bg); color:var(--akzent2);
  font-size:22px; font-weight:1000;
  cursor:pointer; user-select:none;
  position:relative; display:flex;
  align-items:center; justify-content:center;
  transition:none; text-align:center; padding:10px; line-height:1.3;
}
.antwort-btn:hover:not(:disabled){ background:rgba(232,93,4,.18); outline:3px solid var(--akzent); }
.antwort-btn.dwell-active{ transform:scale(1.03) !important; outline:3px solid var(--akzent) !important; transition:none !important; }
.antwort-btn:disabled{ opacity:.5; cursor:default; }
.antwort-ja{ background:#dcfce7; border-color:var(--gruen); color:#166534; }
.antwort-ja:hover:not(:disabled){ background:#bbf7d0; outline:3px solid var(--gruen); }
.antwort-nein{ background:#fee2e2; border-color:var(--rot); color:#991b1b; }
.antwort-nein:hover:not(:disabled){ background:#fecaca; outline:3px solid var(--rot); }

/* ── Antwort-Buttons Vierer (A/B/C/D) ───────────────────────────── */
.antwort-vierer{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.antwort-vierer .antwort-btn{ min-height:80px; font-size:20px; }

/* ── Erklär-Screen ───────────────────────────────────────────────── */
.erklaer-card{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:var(--panel); border:2px solid var(--akzent);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:24px 20px; gap:16px; text-align:center;
}
.erklaer-emoji{ font-size:64px; }
.erklaer-titel{ font-size:26px; font-weight:1000; color:var(--akzent); }
.erklaer-autor{ font-size:15px; font-weight:800; color:var(--muted); }
.erklaer-merksatz{
  font-size:22px; font-weight:1000;
  background:var(--akzent-bg); border:2px solid var(--akzent);
  border-radius:12px; padding:14px 22px;
  color:var(--akzent2); line-height:1.4;
}

/* ── Fertig-Screen ───────────────────────────────────────────────── */
.fertig-screen{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; padding:24px; text-align:center;
}
.fertig-stern{ font-size:72px; }
.fertig-stern.gold{ filter:drop-shadow(0 0 14px #fbbf24); }
.fertig-titel{ font-size:28px; font-weight:1000; color:var(--akzent); }
.fertig-punkte{ font-size:34px; font-weight:1000; color:var(--akzent2); }
.fertig-btn{
  min-height:76px; min-width:240px;
  border-radius:var(--radius); border:2px solid var(--akzent);
  background:var(--akzent-bg); color:var(--akzent2);
  font-size:20px; font-weight:1000;
  cursor:pointer; user-select:none;
  position:relative; display:flex;
  align-items:center; justify-content:center;
  gap:8px; transition:none;
}
.fertig-btn:hover{ background:rgba(232,93,4,.18); outline:3px solid var(--akzent); }
.fertig-btn.dwell-active{ transform:scale(1.02) !important; outline:3px solid var(--akzent) !important; transition:none !important; }
.fertig-btn.vorlesen{ border-color:var(--lila); background:var(--lila-bg); color:#4c1d95; }
.fertig-btn.vorlesen:hover{ background:#ddd6fe; outline:3px solid var(--lila); }
.fertig-btn.vorlesen.dwell-active{ outline:3px solid var(--lila) !important; }

/* ── Nav-Leiste Goldstandard ─────────────────────────────────────── */
.nav-leiste-unten{ display:flex; gap:8px; padding:8px 12px; flex-shrink:0; }
.nav-btn{
  flex:1; min-height:70px; border-radius:var(--radius);
  font-size:17px; font-weight:1000;
  cursor:pointer; user-select:none;
  position:relative; display:flex;
  align-items:center; justify-content:center;
  gap:6px; transition:none; border:2px solid;
  text-decoration:none;
}
a.nav-btn{ color:inherit; }
.nav-btn-zurueck{ background:var(--lila-bg); border-color:var(--lila); color:#4c1d95; }
.nav-btn-zurueck:hover{ background:#ddd6fe; outline:3px solid var(--lila); }
.nav-btn-zurueck .dwell-ring-svg circle{ stroke:var(--lila); }
.nav-btn-weiter{ background:var(--gruen-bg); border-color:var(--gruen); color:#166534; display:none; }
.nav-btn-weiter.sichtbar{ display:flex; }
.nav-btn-weiter:hover{ background:#bbf7d0; outline:3px solid var(--gruen); }
.nav-btn-weiter .dwell-ring-svg circle{ stroke:var(--gruen); }
.nav-btn-ueberspringen{ background:var(--orange-bg); border-color:var(--orange); color:#9a3412; }
.nav-btn-ueberspringen:hover{ background:#ffedd5; outline:3px solid var(--orange); }
.nav-btn-ueberspringen .dwell-ring-svg circle{ stroke:var(--orange); }
.nav-btn.dwell-active{ transform:scale(1.02) !important; outline:3px solid currentColor !important; transition:none !important; }

/* ── Dwell-Ring ─────────────────────────────────────────────────── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:60px; height:60px;
}
.dwell-ring-svg circle{
  fill:none; stroke:var(--akzent); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,.9s) linear forwards; }
</style>
</head>
<body>

<div class="header">
  <span class="header-emoji">🎵</span>
  <span class="header-titel" id="headerTitel">Reimen</span>
  <span class="header-sub" id="headerSub">Lade…</span>
</div>

<div class="fortschritt-bar"><div class="fortschritt-fill" id="fortschritt" style="width:0%"></div></div>

<div class="spielfeld" id="spielfeld">
  <!-- wird von reim_spielen_mod.js befüllt -->
</div>

<div class="nav-leiste-unten" id="navLeiste">
  <a class="nav-btn nav-btn-zurueck" id="btnZurueck" href="./reim.html">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
    ← Zurück
  </a>
  <button class="nav-btn nav-btn-weiter" id="weiterBtn">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
    Weiter ✅
  </button>
  <button class="nav-btn nav-btn-ueberspringen" id="btnUeberspringen">
    <svg class="dwell-ring-svg" viewBox="0 0 70 70"><circle cx="35" cy="35" r="30"/></svg>
    → Überspringen
  </button>
</div>

<script src="../../core/dwell.js"></script>
<script src="../../core/error_handler.js"></script>
<script src="../../core/stats.js"></script>
<script src="./reim_data.js"></script>
<script src="../gedichte/gedichte_data.js"></script>
<script src="./reim_spielen_mod.js"></script>

</script>
</body>
</html>
