<!doctype html>
<!-- depth:2 — Pfade: ../../core/, ../../lernen.html -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia - Reimen</title>
<style>
:root{
  --bg:#fff8f0; --panel:#ffffff;
  --border:rgba(15,23,42,.14); --shadow:0 10px 26px rgba(15,23,42,.08);
  --text:#0f172a; --muted:rgba(15,23,42,.60);
  --akzent:#e85d04; --akzent2:#dc2f02;
  --akzent-bg:rgba(232,93,4,0.09); --radius:20px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
  display:flex; flex-direction:column;
}
.app{
  width:min(860px,96vw); margin:0 auto; padding:16px;
  flex:1; min-height:0; display:flex; flex-direction:column; gap:14px;
}

/* ── Header ── */
.header{
  background:var(--panel); border:2px solid var(--akzent);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 24px; text-align:center; flex-shrink:0;
}
.header-emoji{ font-size:40px; margin-bottom:4px; }
.header-titel{ font-size:clamp(24px,5vw,34px); font-weight:1000; color:var(--akzent); margin:0 0 4px; }
.header-sub{ font-size:clamp(14px,2.5vw,18px); font-weight:800; color:var(--muted); }

/* ── Einheiten-Grid: eigener Scrollbereich, damit Header + Zurueck-Button
   immer sichtbar bleiben, egal wie viele Gedichte spaeter dazukommen
   (gleiches Muster wie Fabus .geschichten-liste) ── */
.einheiten-scroll{ flex:1; min-height:0; overflow-y:auto; padding:2px; }
.einheiten-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }

a.einheit-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; min-height:150px; padding:18px 14px;
  background:var(--panel); border:2px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  text-decoration:none; color:var(--text); font-weight:1000;
  user-select:none; cursor:pointer; position:relative; transition:none;
}
a.einheit-btn:hover, a.einheit-btn:focus{
  transform:scale(1.03); outline:4px solid var(--akzent);
  background:var(--akzent-bg);
}
a.einheit-btn.gemeistert{ border-color:#f59e0b; background:rgba(245,158,11,0.06); }
.einheit-emoji{ font-size:38px; }
.einheit-titel{ font-size:17px; font-weight:1000; color:var(--akzent); text-align:center; }
.einheit-autor{ font-size:12px; font-weight:800; color:var(--muted); text-align:center; }
.einheit-count{ font-size:12px; font-weight:1000; padding:3px 10px; border-radius:999px;
  background:var(--akzent-bg); border:1px solid rgba(232,93,4,.25); color:var(--akzent); }

/* ── Zurueck ── */
.zurueck-wrap{ display:flex; flex-shrink:0; }
a.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:72px; font-size:20px; font-weight:1000;
  border-radius:16px; border:2px solid #8b5cf6;
  background:#ede9fe; color:#4c1d95;
  text-decoration:none; cursor:pointer; user-select:none;
  position:relative; transition:none; width:100%;
}
a.zurueckBtn:hover, a.zurueckBtn:focus{ background:#ddd6fe; outline:4px solid #8b5cf6; }

/* ── Dwell-Ring ── */
@keyframes dwellRing{ from{stroke-dashoffset:220} to{stroke-dashoffset:0} }
.dwell-ring-svg{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; width:70px; height:70px;
}
.dwell-ring-svg circle{
  fill:none; stroke:var(--akzent); stroke-width:5;
  stroke-dasharray:220; stroke-dashoffset:220;
  transform:rotate(-90deg); transform-origin:35px 35px;
}
.dwell-ring-svg circle.animating{ animation:dwellRing var(--dwell-duration,.9s) linear forwards; }
.dwell-active{
  transform:scale(1.06) !important; outline:4px solid var(--akzent) !important;
  box-shadow:0 0 0 5px rgba(0,0,0,0.12) !important; transition:none !important;
}
a.zurueckBtn.dwell-active{ outline-color:#8b5cf6 !important; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-emoji">🎵</div>
    <div class="header-titel">Reimen</div>
    <div class="header-sub">Gedichte hören — Reime erkennen!</div>
  </div>

  <div class="einheiten-scroll">
    <div class="einheiten-grid" id="einheitenBereich">
      <!-- wird von reim_uebersicht.js befuellt -->
    </div>
  </div>

  <div class="zurueck-wrap">
    <a class="zurueckBtn" href="../../lernen.html" id="btnZurueck">
      <svg class="dwell-ring-svg" viewBox="0 0 70 70" style="width:50px;height:50px;">
        <circle cx="35" cy="35" r="30" style="stroke:#8b5cf6;"/>
      </svg>
      ← Zurueck zum Lernen
    </a>
  </div>

</div>
<script src="../../core/dwell.js"></script>
<script src="./reim_data.js"></script>
<script src="./reim_uebersicht.js"></script>
<script>
try{
  localStorage.setItem("laetitia_return_url_v1", new URL("./modules/reim/reim.html", window.location.href).href);
}catch(e){}
window.ReimUebersicht && window.ReimUebersicht.baueUebersicht();
</script>
</body>
</html>
