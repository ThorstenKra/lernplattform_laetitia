<!doctype html>
<!-- depth:2 -- Pfade: ../../core/ -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laetitia – Labyrinth</title>
<style>
:root{
  --bg:#e8edf5;           /* heller blaugrauer Hintergrund */
  --panel:#ffffff;
  --panel2:#f1f5f9;
  --border:rgba(15,23,42,.14);
  --wall:#334155;          /* dunkle Wände — deutlich vom Boden abgesetzt */
  --wall-border:#1e293b;
  --floor:#cbd5e1;         /* helles Grau für begehbare Felder */
  --floor-border:#94a3b8;
  --spur:#bfdbfe;          /* helles Blau für Spur */
  --spur-border:#93c5fd;
  --green:#16a34a; --green-dim:rgba(22,163,74,.15);
  --red:#ef4444;
  --akzent:#7c3aed;
  --text:#0f172a; --muted:rgba(15,23,42,.55);
  --radius:14px;
  --cell:min(8.5vw, 8.5vh, 56px);
}
*{ box-sizing:border-box; }
body{ margin:0; font-family:system-ui,Arial; background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden; user-select:none; }
.app{ height:100vh; display:flex; flex-direction:column; padding:10px; gap:6px; }

/* Header */
.header{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.title{ flex:1; text-align:center; font-size:18px; font-weight:1000; color:var(--akzent); }
.hud-info{ font-size:14px; font-weight:900; color:var(--muted);
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:6px 14px; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.08); }
.hud-info span{ color:#b45309; font-weight:1000; }

/* Haupt-Layout: Pfeil oben — [Pfeil-L | Brett | Pfeil-R] — Pfeil unten */
.game-outer{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px;
}
.game-row{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }

/* Richtungs-Buttons */
.dirBtn{
  display:flex; align-items:center; justify-content:center;
  border-radius:var(--radius); border:3px solid var(--border);
  background:var(--panel); cursor:pointer;
  font-size:clamp(22px,4vw,38px);
  font-weight:1000; color:var(--muted);
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  transition:none; position:relative; flex-shrink:0;
}
/* Horizontal: schmal und hoch */
.dirBtn.h{ width:clamp(52px,6vw,66px); height:clamp(70px,12vh,120px); }
/* Vertikal: breit und flach */
.dirBtn.v{ height:clamp(48px,6vh,66px); width:clamp(130px,24vw,260px); }

/* Zustand: frei (grün) */
.dirBtn.frei{
  border-color:rgba(22,163,74,.7);
  background:rgba(22,163,74,.12);
  color:var(--green);
}
.dirBtn.frei:hover, .dwell-active.dirBtn.frei{
  background:rgba(22,163,74,.25) !important;
  outline:4px solid var(--green) !important;
  transform:scale(1.06) !important;
}
/* Zustand: gesperrt (Wand) */
.dirBtn.wand{
  border-color:rgba(15,23,42,.08);
  background:rgba(15,23,42,.04);
  color:rgba(15,23,42,.20);
  cursor:default;
  box-shadow:none;
}
/* Dwell-Feedback */
.dwell-active.dirBtn{
  outline:4px solid var(--akzent) !important;
  transform:scale(1.06) !important;
  transition:none !important;
}
/* Dwell-Fortschrittsbalken unten in den Buttons */
.dwell-bar{
  position:absolute; bottom:0; left:0; height:5px;
  background:var(--green); border-radius:0 0 10px 10px;
  width:0%; transition:none;
}

/* Labyrinth-Brett */
.brett{
  display:grid;
  gap:3px;
  background:#475569;   /* dunkles Brett-Hintergrund = sichtbare Lücken */
  border:3px solid #334155;
  border-radius:var(--radius);
  padding:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);
}
.zelle{
  width:var(--cell); height:var(--cell);
  border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--cell) * 0.55);
  line-height:1;
}
.zelle.wand{
  background:#1e293b;        /* sehr dunkel — klar als Wand erkennbar */
  border:1px solid #0f172a;
}
.zelle.frei{
  background:#f1f5f9;        /* hell — klar als Weg erkennbar */
  border:1px solid #cbd5e1;
}
.zelle.ziel{
  background:#fef9c3;
  border:2px solid #f59e0b;
}
.zelle.spieler{
  background:#ede9fe;
  border:2px solid #7c3aed;
}
/* Spur (besuchte Felder) */
.zelle.spur{
  background:#dbeafe;
  border:1px solid #93c5fd;
}

/* Level-Anzeige */
.level-dots{ display:flex; gap:6px; justify-content:center; flex:0 0 auto; }
.ldot{ width:12px; height:12px; border-radius:50%; background:rgba(15,23,42,.15); border:2px solid rgba(15,23,42,.25); }
.ldot.aktiv{ background:var(--akzent); border-color:var(--akzent); }
.ldot.fertig{ background:var(--green); border-color:var(--green); }

/* Konfetti */
.konfetti-wrap{
  position:fixed; inset:0; pointer-events:none; z-index:199; overflow:hidden;
}
.konfetti-wrap.show{ display:block; }
.kf{
  position:absolute; top:-20px;
  width:10px; height:14px; border-radius:3px;
  animation:kfFall linear forwards;
}
@keyframes kfFall{
  0%  { transform:translateY(0) rotate(0deg); opacity:1; }
  80% { opacity:1; }
  100%{ transform:translateY(105vh) rotate(720deg); opacity:0; }
}

/* Sieg-Overlay — großzügiger, fröhlicher */
.overlay{
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.55); align-items:center; justify-content:center;
  z-index:200; padding:16px;
}
.overlay.show{ display:flex; }
.overlayBox{
  background:#fff; border:3px solid var(--akzent);
  border-radius:28px; padding:32px 28px;
  width:min(440px,92vw); text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.25);
  animation:ovPop .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes ovPop{
  from{ transform:scale(.7); opacity:0; }
  to  { transform:scale(1);  opacity:1; }
}
.ov-emoji{ font-size:72px; margin-bottom:8px; line-height:1;
  animation:ovEmojiBounce .6s ease-out .2s both; }
@keyframes ovEmojiBounce{
  0%  { transform:scale(0) rotate(-15deg); }
  60% { transform:scale(1.25) rotate(5deg); }
  100%{ transform:scale(1) rotate(0deg); }
}
.ov-title{ font-size:30px; font-weight:1000; margin:0 0 6px; color:var(--green); }
.ov-sub{ font-size:16px; font-weight:900; color:var(--muted); margin:0 0 22px; }
.ov-sterne{ font-size:28px; letter-spacing:6px; margin:0 0 16px; }
.ov-btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.ovBtn{
  min-height:60px; min-width:140px; padding:10px 22px;
  border-radius:14px; border:2px solid var(--akzent);
  background:rgba(124,58,237,.10); color:#5b21b6;
  font-size:16px; font-weight:1000; cursor:pointer;
}
.ovBtn.gruen{ border-color:var(--green); background:rgba(22,163,74,.12); color:#15803d; font-size:18px; }
.ovBtn:hover{ filter:brightness(.92); }
.ov-title.gold{ color:#b45309; }

/* Statusbar — kompakt, Zurück links, Level-Wahl rechts */
.statusbar{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  padding:6px 10px; flex:0 0 auto;
  display:flex; gap:8px; align-items:center;
  justify-content:flex-start;          /* links ausrichten */
}
.zurueckBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:52px; width:min(200px, 30vw);  /* kompakte feste Breite */
  font-size:15px; font-weight:1000; border-radius:10px;
  border:2px solid #7c3aed; background:#ede9fe; color:#4c1d95;
  cursor:pointer; text-decoration:none; flex-shrink:0;
}
.zurueckBtn:hover{ background:#ddd6fe; outline:3px solid #7c3aed; }
.dwell-active.zurueckBtn{
  transform:scale(1.03) !important; outline:3px solid var(--akzent) !important; transition:none !important;
}
.levelBtn{
  display:flex; align-items:center; justify-content:center;
  min-height:52px; padding:0 16px; font-size:13px; font-weight:1000; border-radius:10px;
  border:2px solid rgba(180,83,9,.5); background:rgba(251,191,36,.12); color:#92400e;
  cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.levelBtn:hover{ background:rgba(251,191,36,.25); outline:3px solid #d97706; }
.dwell-active.levelBtn{
  transform:scale(1.04) !important; outline:3px solid #d97706 !important; transition:none !important;
}
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <button class="hud-info" id="btnBack">← Start</button>
    <div class="title">🌀 Labyrinth</div>
    <div class="hud-info">Schritte: <span id="schritte">0</span></div>
  </div>

  <!-- Level-Dots -->
  <div class="level-dots" id="levelDots"></div>

  <!-- Spiel -->
  <div class="game-outer">
    <!-- Pfeil oben -->
    <div class="game-row">
      <div class="dirBtn v" id="btnOben" data-dir="oben">
        ↑
        <div class="dwell-bar" id="barOben"></div>
      </div>
    </div>
    <!-- Pfeil links | Brett | Pfeil rechts -->
    <div class="game-row">
      <div class="dirBtn h" id="btnLinks" data-dir="links">
        ←
        <div class="dwell-bar" id="barLinks"></div>
      </div>
      <div class="brett" id="brett"></div>
      <div class="dirBtn h" id="btnRechts" data-dir="rechts">
        →
        <div class="dwell-bar" id="barRechts"></div>
      </div>
    </div>
    <!-- Pfeil unten -->
    <div class="game-row">
      <div class="dirBtn v" id="btnUnten" data-dir="unten">
        ↓
        <div class="dwell-bar" id="barUnten"></div>
      </div>
    </div>
  </div>

  <!-- Statusbar -->
  <div class="statusbar">
    <a class="zurueckBtn" href="#" id="btnZurueck">← Zurück</a>
    <button class="levelBtn" id="btnLevel">Level wählen</button>
  </div>

</div>

<!-- Konfetti -->
<div class="konfetti-wrap" id="konfettiWrap"></div>

<!-- Sieg-Overlay -->
<div class="overlay" id="overlay">
  <div class="overlayBox">
    <div class="ov-emoji" id="ovEmoji">🎉</div>
    <div class="ov-title" id="ovTitle">Geschafft!</div>
    <div class="ov-sterne" id="ovSterne">⭐⭐⭐</div>
    <div class="ov-sub" id="ovSub"></div>
    <div class="ov-btns">
      <button class="ovBtn gruen" id="ovWeiter">Weiter ▶</button>
      <button class="ovBtn" id="ovNochmal">🔄 Nochmal</button>
    </div>
  </div>
</div>

<script src="./labyrinth_mod.js"></script>
<script src="../../core/error_handler.js"></script>
</body>
</html>
